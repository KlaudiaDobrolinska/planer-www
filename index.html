<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd7f90">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikona-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bd7f90'/%3E%3Crect x='9' y='8' width='14' height='17' rx='2' fill='%23fffdfb'/%3E%3Cpath d='M12 13h8M12 17h8M12 21h5' stroke='%23bd7f90' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Planer Klaudii</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
<style>
/* Układ: pasek boczny z działami, treść w kartach na papierze. Papier w kratkę tylko jako tło biurka,
   nigdy pod tekstem. Kolory: okładka FairyFloss, papier Tomoe River, atramenty Sabimidori i Budounezu. */
:root{
  --desk:#ece3e0; --paper:#fffdfb; --paper-2:#faf5f2; --side:#f4ecea;
  --grid:rgba(140,100,90,.09); --grid-5:rgba(140,100,90,.16);
  --fg:#2e2a29; --fg-2:#6b615d; --fg-3:#9c918c;
  --line:#e6dbd6; --line-2:#efe6e2;
  --pink:#bd7f90; --pink-2:#a86a7c; --pink-soft:#f7e9ec;
  --ink:#4a6a5b; --dziennik:#6b5a6e;
  /* Staedtler Triplus — odczytane z wzornika Klaudii */
  --s:#81559c; --g:#5c94b7; --t:#c53501; --z:#44251b; --o:#5a6016; --r:#9f2b37;
  --d:#fa970b; --j:#006c59;        /* 16 Golden Ochre, 38 Sea Green */
  --nawyk:#985e7d;                 /* 26 Antique Pink */
  --sc5:#148a72; --sc4:#68742a; --sc3:#cf9420; --sc2:#c85f20; --sc1:#b8283a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --disp:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#191617; --paper:#262223; --paper-2:#2c2728; --side:#201c1d;
  --grid:rgba(255,230,220,.045); --grid-5:rgba(255,230,220,.08);
  --fg:#efe9e7; --fg-2:#a89e9a; --fg-3:#7d7470;
  --line:#3a3335; --line-2:#322c2e;
  --pink:#d395a5; --pink-2:#e3adba; --pink-soft:#3a2b30;
  --ink:#9ec0ac; --dziennik:#c9b0cc;
  --s:#b196c2; --g:#9abdd2; --t:#db8262; --z:#8b7872; --o:#999c6f; --r:#c37c83;
  --d:#fcbe68; --j:#61a498; --nawyk:#bf9bae;
  --sc5:#2bb394; --sc4:#9aa84a; --sc3:#e0b44a; --sc2:#ec8c4e; --sc1:#e2616f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#191617; --paper:#262223; --paper-2:#2c2728; --side:#201c1d;
  --grid:rgba(255,230,220,.045); --grid-5:rgba(255,230,220,.08);
  --fg:#efe9e7; --fg-2:#a89e9a; --fg-3:#7d7470;
  --line:#3a3335; --line-2:#322c2e;
  --pink:#d395a5; --pink-2:#e3adba; --pink-soft:#3a2b30;
  --ink:#9ec0ac; --dziennik:#c9b0cc;
  --s:#b196c2; --g:#9abdd2; --t:#db8262; --z:#8b7872; --o:#999c6f; --r:#c37c83;
  --d:#fcbe68; --j:#61a498; --nawyk:#bf9bae;
  --sc5:#2bb394; --sc4:#9aa84a; --sc3:#e0b44a; --sc2:#ec8c4e; --sc1:#e2616f;
  color-scheme:dark;
}
/* skórka „System” — wygląd aplikacji macOS; włączana w Legendzie, nie nadpisuje papieru */
:root[data-skin="mac"]{
  --desk:#f2f2f6; --paper:#ffffff; --paper-2:#f7f7f9; --side:#eaeaef;
  --grid:transparent; --grid-5:transparent;
  --fg:#1d1d1f; --fg-2:#5f5f64; --fg-3:#8c8c91;
  --line:#d9d9de; --line-2:#ebebef;
  --pink:#0a6cff; --pink-2:#0a58d0; --pink-soft:#e9f0ff;
  --ink:#30506a; --dziennik:#3a3a3f;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-skin="mac"]:not([data-theme="light"]){
  --desk:#1c1c1e; --paper:#2a2a2d; --paper-2:#313135; --side:#232326;
  --fg:#f2f2f7; --fg-2:#a3a3a8; --fg-3:#7c7c82;
  --line:#3b3b3f; --line-2:#333337;
  --pink:#0a84ff; --pink-2:#64aaff; --pink-soft:#1b2c45;
  --ink:#9ec4e8; --dziennik:#d8d8dd;
  color-scheme:dark;
}}
:root[data-skin="mac"][data-theme="dark"]{
  --desk:#1c1c1e; --paper:#2a2a2d; --paper-2:#313135; --side:#232326;
  --fg:#f2f2f7; --fg-2:#a3a3a8; --fg-3:#7c7c82;
  --line:#3b3b3f; --line-2:#333337;
  --pink:#0a84ff; --pink-2:#64aaff; --pink-soft:#1b2c45;
  --ink:#9ec4e8; --dziennik:#d8d8dd;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--ui);font-size:14.5px;
  line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:1px;border-radius:5px}

#shell{display:flex;height:100%;min-height:0}
#side{width:190px;flex:0 0 190px;background:var(--side);border-right:1px solid var(--line);
  padding:16px 11px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
#side h1{font-family:var(--disp);font-size:17px;font-weight:500;letter-spacing:.02em;
  margin:2px 0 14px 9px;color:var(--pink-2)}
.nav{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;background:transparent;
  border-radius:7px;width:100%;text-align:left;color:var(--fg);font-family:var(--disp);font-size:15px}
.nav:hover{background:var(--pink-soft)}
.nav[aria-current="page"]{background:var(--pink);color:#fff}
#side .foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--fg-3);line-height:1.55}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:color-mix(in srgb,var(--desk) 90%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header.bar h2{margin:0;font-family:var(--disp);font-size:20px;font-weight:500;letter-spacing:-.005em}
header.bar .sub{color:var(--fg-2);font-size:12.5px}
.spacer{flex:1}
.scroll{flex:1;overflow-y:auto;padding:20px 22px 44px;
  background-image:linear-gradient(var(--grid-5) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-5) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:60px 60px,60px 60px,12px 12px,12px 12px}
.wrap{max-width:900px;display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,290px);gap:16px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.colbox{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:820px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}

/* karta = kartka papieru */
.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px 17px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;
  box-shadow:0 1px 2px rgba(90,60,55,.05)}
.sec>h3{margin:0;font-family:var(--disp);font-size:13px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pink-2);border-bottom:1px solid var(--line-2);padding-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{flex-wrap:nowrap}
.row.tight input{flex:1 1 90px;min-width:0}
.note{color:var(--fg-2);font-size:12.5px;line-height:1.6}
.serif{font-family:var(--disp)}

.btn{border:1px solid var(--line);background:var(--paper-2);border-radius:6px;
  padding:3px 10px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--pink);color:var(--pink-2)}
.btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.icon{padding:2px 9px}
.ghost{border:0;background:transparent;color:var(--fg-3);padding:2px 5px;border-radius:4px;font-size:12px}
.ghost:hover{background:var(--pink-soft);color:var(--pink-2)}
input[type=text],input[type=time],textarea,select{background:transparent;border:0;
  border-bottom:1px solid var(--line);border-radius:0;padding:2px 2px;width:100%;color:var(--fg)}
input[type=text]:focus,textarea:focus,input[type=time]:focus{outline:0;border-bottom-color:var(--pink)}
textarea{resize:none;line-height:1.65;padding:3px 2px}
.grow{resize:vertical}
::placeholder{color:var(--fg-3)}
label.fld{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--fg-3);
  font-family:var(--disp);letter-spacing:.09em;text-transform:uppercase}

/* zadania */
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;align-items:flex-start;gap:8px;padding:2px 3px;border-radius:6px;min-height:26px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  border:0;background:transparent;font:inherit;color:inherit;text-align:left;width:100%}
.task:hover{background:var(--pink-soft)}
.mark{border:0;background:transparent;width:18px;flex:0 0 18px;text-align:center;font-size:14px;
  line-height:1.65;padding:0}
.ttxt{flex:1;min-width:0;line-height:1.55;word-break:break-word;background:transparent;border:0;
  -webkit-touch-callout:none;
  padding:0;text-align:left;color:var(--fg)}
.task.done .ttxt{color:var(--fg-2)}
.task.canc .ttxt{color:var(--fg-3);text-decoration:line-through}
.task.moved .ttxt,.task.later .ttxt{color:var(--fg-2)}
.tools{display:flex;gap:0;opacity:0;flex:0 0 auto}
.task:hover .tools,.task:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:.6}}
.divider{border-top:1px dashed var(--line);margin:6px 0 6px 26px;width:120px;height:0}

/* oś godzin */
.axis{display:grid;grid-template-columns:30px 1fr;border:1px solid var(--line-2);
  border-radius:7px;overflow:hidden;background:var(--paper-2)}
.hr{display:contents}
.hlab{font-size:10px;color:var(--fg-3);padding-right:5px;text-align:right;height:11px;
  display:flex;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;
  border-top:1px solid var(--line-2)}
.hcell{height:11px;position:relative;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);
  cursor:pointer}
.hcell:hover{background:var(--pink-soft)}
.hr.pol .hcell,.hr.pol .hlab{border-top-style:dotted}
.hr.cwierc .hcell,.hr.cwierc .hlab{border-top-color:transparent}
.pasek{border:1px dashed var(--line);background:var(--paper-2);color:var(--fg-3);
  font-size:11px;padding:6px 8px;border-radius:7px;margin:2px 0;text-align:center;width:100%}
.pasek:hover{border-color:var(--pink);color:var(--pink-2)}
.hr:first-child .hlab,.hr:first-child .hcell{border-top:0}
.blk{position:absolute;left:3px;right:3px;border-radius:4px;padding:0 6px;font-size:11.5px;
  overflow:hidden;white-space:nowrap;border:1.5px solid currentColor;
  display:flex;align-items:center;line-height:1.2;font-size:11px;z-index:1;cursor:pointer}
.btn.papier{color:var(--nawyk);border-color:color-mix(in srgb,var(--nawyk) 45%,transparent)}
.btn.papier:hover:not(:disabled){border-color:var(--nawyk);
  background:color-mix(in srgb,var(--nawyk) 12%,transparent);color:var(--nawyk)}
.btn.papier:disabled{opacity:.3;cursor:default}
.btn.papier:disabled:hover{background:transparent}
.blk.ciagnie{box-shadow:0 3px 10px rgba(0,0,0,.25);opacity:.92;z-index:3}
.blk.wybrany{box-shadow:0 0 0 2px var(--nawyk);z-index:2}
.przenosnik{margin:0 4px 8px 28px;gap:4px}
:root[data-skin="mac"] .przenosnik{margin:0 14px 9px 40px}
.blokedyt{margin:8px 0;border-color:var(--pink)}
.blk.waski{font-size:10px;padding:0 4px;background:color-mix(in srgb,var(--paper) 92%,transparent)}
.blk.waski.done{background:color-mix(in srgb,currentColor 24%,transparent)}
.blk.done{background:color-mix(in srgb,currentColor 24%,transparent)}
.blk.done span{font-weight:600}
.blk span{color:var(--fg)}
.blk.kal{color:var(--pink);background:color-mix(in srgb,var(--paper) 88%,transparent);cursor:default}
.blk.kal span{font-weight:600}
.blk.dojazd{border:1px dashed color-mix(in srgb,var(--ink-3) 55%,transparent);color:var(--ink-3);
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink-3) 14%,transparent) 0 3px,
    transparent 3px 7px);font-size:9px;padding:0 3px;cursor:default;z-index:0}
.blk.dojazd span{color:var(--ink-3);font-weight:400}

/* tabele */
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini .mdow{font-size:9.5px;color:var(--fg-3);line-height:18px}
.mini .mday{border:0;background:transparent;color:var(--fg);font-size:12px;padding:4px 0;
  border-radius:5px;font-variant-numeric:tabular-nums}
.mini .mday:hover{background:var(--line-2)}
.mini .mday.wtyg{background:var(--pink-soft)}
.mini .mday.dzisiaj{box-shadow:inset 0 0 0 1px var(--pink)}
.mini .mday.wybrany{background:var(--pink);color:#fff;font-weight:600}
.przep{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.55;background:var(--paper-2);border:1px solid var(--line-2);
  border-radius:7px;padding:8px 10px;margin:0;overflow-x:auto}
.grupa{display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--fg-3);padding:10px 2px 3px;
  border-bottom:1px solid var(--line-2);margin-bottom:2px}
:root[data-skin="mac"] .sec>.tasks .grupa,:root[data-skin="mac"] .grupa{padding-left:14px;padding-right:14px}
.kroklicz{font-size:10px;color:#fff;background:var(--ink);border-radius:9px;padding:1px 6px;
  letter-spacing:0;text-transform:none;flex:0 0 auto}
.tin{width:78px;flex:0 0 auto}
.tnote{margin:0 4px 6px 28px;width:calc(100% - 34px);font-size:13px;color:var(--fg-2);
  border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--paper-2)}
.blkrow{flex-wrap:wrap}
.blkrow .ttxt,.blkrow input[type=text]{flex:1 1 110px;min-width:0}
.tb{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.tb .lft{width:38%}
.tb.hab .lft{width:26%}
.tb th{font-weight:400;color:var(--fg-3);font-size:10.5px;padding:0 1px 4px;text-align:center;
  font-family:var(--disp);letter-spacing:.06em}
.tb th.lft{text-align:left}
.tb td{border-top:1px solid var(--line-2);padding:0;text-align:center}
.tb td.lft{text-align:left;padding:0 3px;color:var(--fg-2);white-space:nowrap;line-height:26px}
.tb.siatka{table-layout:fixed;width:100%}
.tb.siatka .lft{width:112px;white-space:nowrap;padding-right:8px;overflow:hidden;
  text-overflow:ellipsis;font-size:11.5px}
.tb.siatka th{padding:0 0 3px;font-size:9px}
.tb.ala{table-layout:auto;min-width:420px}
.tb.ala .lft{width:auto;min-width:160px;white-space:normal;line-height:1.3;padding:3px 4px;
  display:flex;align-items:flex-start;gap:4px}
.tb.ala .lft .mark{line-height:1.4}
.tb.ala .lft .ttxt{font-size:12px}
.tb.ala th{min-width:26px}
.tb.ala .alad{font-size:9px;color:var(--fg-3)}
.ala{width:100%;min-width:24px;height:26px;border:0;background:transparent;cursor:pointer;
  font-size:13px;color:var(--fg-3);line-height:1;border-radius:4px}
.ala:hover{background:var(--pink-soft)}
.ala.jest{font-weight:700;font-size:14px}
.ala.byl{color:var(--fg-3);opacity:.75}
.tb.siatka td{border-top:0;padding:1px}
.tb.siatka th.wk,.tb.siatka td.wk{background:var(--paper-2)}
.cell.kw{width:100%;min-width:0;height:auto;aspect-ratio:1;border:1px solid var(--line);border-radius:3px;
  background:transparent;display:block;padding:0;border-left:1px solid var(--line)}
.legkw{width:17px;height:17px;min-height:17px;flex:0 0 17px;aspect-ratio:auto;border-radius:4px}
.tb.dom td{padding:2px;text-align:center;border-top:0}
.tb.dom td.lft{text-align:left;padding-left:2px}
.tb.dom .cell.kw{width:24px;height:24px;min-width:24px;aspect-ratio:auto;margin:0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;
  font-variant-numeric:tabular-nums}
@media (max-width:900px){ .tb.siatka th:not(.co5){color:transparent} }
@media (max-width:720px){
  .tb.siatka{table-layout:auto;width:auto}          /* na telefonie przesuwamy w bok */
  .tb.siatka .lft{width:auto;font-size:11px;position:sticky;left:0;background:var(--paper);
    z-index:1;padding-right:8px}
  .tb.siatka th{font-size:9px;min-width:24px}
  .tb.siatka th:not(.co5){color:var(--fg-3)}
  .cell.kw{width:24px;min-width:24px;height:24px;aspect-ratio:auto}
}
.cell.kw.s1{background:var(--nawyk);border-color:transparent}
.cell.kw.s2{background:linear-gradient(135deg,var(--nawyk) 0 50%,transparent 50% 100%)}
.cell.kw.s0{background:var(--line-2);border-color:var(--line)}
.cell.kw.s0::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:1.5px;
  background:var(--fg-3);border-radius:1px}
.cell.kw{position:relative}
.cell.kw.s3{background:repeating-linear-gradient(135deg,var(--line) 0 1.5px,transparent 1.5px 5px)}
.cell{width:100%;height:26px;border:0;background:transparent;border-left:1px solid var(--line-2);
  font-size:12.5px;padding:0;color:var(--fg)}
.cell:hover{background:var(--pink-soft)}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px}
.tb tr.wk td{background:var(--paper-2)}
.scrollx{overflow-x:auto}
:root[data-widok="trackery"] .wrap{max-width:1180px}

/* miesiąc */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-2);
  border-left:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.mg .dow{font-size:10px;color:var(--fg-3);text-align:center;line-height:19px;font-family:var(--disp);
  letter-spacing:.06em;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.mcell{min-height:58px;background:transparent;border:0;border-right:1px solid var(--line-2);
  border-bottom:1px solid var(--line-2);padding:3px 4px;text-align:left;display:flex;
  flex-direction:column;gap:0;overflow:hidden;font-size:10.5px;color:var(--fg);line-height:1.35}
.mcell:hover{background:var(--pink-soft)}
.mcell.out{opacity:.35}
.mcell.today{box-shadow:inset 0 0 0 2px var(--pink)}
.mcell.wyjazd{background:color-mix(in srgb,var(--wyj) 9%,transparent);
  box-shadow:inset 0 3px 0 -0.5px var(--wyj)}
.mcell.wyjazd.today{box-shadow:inset 0 3px 0 -0.5px var(--wyj),inset 0 0 0 2px var(--pink)}

<div id="shell">
  <nav id="side">
    <h1>Planer</h1>

<script>
"use strict";
/* ---------- stałe z planera ---------- */
const AREAS = {
  G:{n:"gabinet",    c:"var(--g)", nr:"63"},
  S:{n:"studia",     c:"var(--s)", nr:"68"},
  T:{n:"twórczość",  c:"var(--t)", nr:"73"},
  D:{n:"dom",        c:"var(--d)", nr:"16"},
  J:{n:"Julia",      c:"var(--j)", nr:"38"},
  K:{n:"Klaudia",    c:"var(--z)", nr:"77"},
  O:{n:"odpoczynek", c:"var(--o)", nr:"57"}
};
/* Typ dnia odpowiada na jedno pytanie: ile dziś wchodzi mojego czasu.
   Norma liczy bloki twórcze i naukowe — to one wypadają pierwsze. */
const BLOKI_WLASNE = ["T","S"];
const DAYTYPES = {
  pelny:      {n:"Pełny",         o:"Dzień do mojej dyspozycji.",                         min:2, max:3},
  praca:      {n:"Praca",         o:"Gabinet albo twórczość naukowa.",                    min:0, max:1},
  nauka:      {n:"Nauka",         o:"Studia, zjazd, szkolenie.",                          min:1, max:2},
  zajety:     {n:"Zajęty",        o:"Cudze sprawy: wizyty, dowożenie, wyjazd.",           min:0, max:0},
  niska:      {n:"Niska energia", o:"Pierwsza rzecz z listy albo nic.",                   min:0, max:1},
  odpoczynek: {n:"Odpoczynek",    o:"Świadomie wolne, bez wyrzutów.",                     min:0, max:0}
};
const nazwaTypu = k => (DAYTYPES[k] || {}).n || k;
const normaTekst = k => { const d=DAYTYPES[k]; if(!d) return "";
  if(d.min===0 && d.max===0) return "bez bloków własnych";
  if(d.min===0 && d.max===1) return "najwyżej 1 blok";
  if(d.min===d.max) return d.max+" blok"+(d.max>=5?"ów":(d.max>1?"i":""));
  return d.min+"–"+d.max+" blok"+(d.max>=5?"ów":"i"); };
const ST = ["todo","part","done","canc","moved","later","event","note"];
const STMARK = {todo:"•",part:"◩",done:"✓",canc:"×",moved:">",later:"<",event:"○",note:"–"};
const STNAME = {todo:"zadanie",part:"zaczęte / minimum",done:"zrobione",canc:"anulowane",
  moved:"przeniesione",later:"kiedyś / może",event:"wydarzenie",note:"notatka"};
const STCYC = {todo:1,part:1,done:1,canc:1,moved:1,later:1,event:0,note:0};
const FABR = {areas:null, ST:null, STMARK:null, STNAME:null, STCYC:null};
function cfgZapamietajFabryczne(){
  FABR.areas = JSON.parse(JSON.stringify(AREAS));
  FABR.ST = [...ST]; FABR.STMARK = {...STMARK};
  FABR.STNAME = {...STNAME}; FABR.STCYC = {...STCYC};
  FABR.HABITS = HABITS.map(h=>[...h]);
  FABR.KOTWICE = KOTWICE.map(k=>({...k, dni:[...k.dni]}));
  FABR.HOME = HOME.map(h=>[...h]);
  FABR.TERMINY = TERMINY.map(x=>({...x}));
  FABR.PODROZE = PODROZE.map(x=>({...x}));
  FABR.SZABLONY = [];
}
function cfgZastosuj(c){
  const a = (c && c.areas && Object.keys(c.areas).length) ? c.areas : FABR.areas;
  Object.keys(AREAS).forEach(k=>delete AREAS[k]);
  Object.keys(a).forEach(k=>AREAS[k] = {...a[k]});
  const m = (c && c.marks) || {};
  const lista = (m.ST && m.ST.length) ? m.ST : FABR.ST;
  ST.length = 0; lista.forEach(x=>ST.push(x));
  Object.keys(STMARK).forEach(k=>delete STMARK[k]);
  Object.assign(STMARK, m.STMARK || FABR.STMARK);
  Object.keys(STNAME).forEach(k=>delete STNAME[k]);
  Object.assign(STNAME, m.STNAME || FABR.STNAME);
  Object.keys(STCYC).forEach(k=>delete STCYC[k]);
  Object.assign(STCYC, m.STCYC || FABR.STCYC);
  const h = (c && c.habits && c.habits.length) ? c.habits : FABR.HABITS;
  HABITS.length = 0; h.forEach(x=>HABITS.push([x[0], x[1]]));
  const kt = (c && c.kotwice) ? c.kotwice : FABR.KOTWICE;
  KOTWICE.length = 0; kt.forEach(x=>KOTWICE.push({...x, dni:[...(x.dni||[])]}));
  const tm = (c && c.terminy) ? c.terminy : FABR.TERMINY;
  TERMINY.length = 0; tm.forEach(x=>TERMINY.push({...x}));
  const pd = (c && c.podroze) ? c.podroze : FABR.PODROZE;
  PODROZE.length = 0; pd.forEach(x=>PODROZE.push({...x}));
  const sz = (c && c.szablony) ? c.szablony : FABR.SZABLONY;
  SZABLONY.length = 0; sz.forEach(x=>SZABLONY.push(JSON.parse(JSON.stringify(x))));
  const dm = (c && c.home && c.home.length) ? c.home : FABR.HOME;
  HOME.length = 0; dm.forEach(x=>HOME.push([x[0], x[1], x[2] || "Dom"]));
}
function cfgZapisz(){
  save("cfg/ui", {areas:JSON.parse(JSON.stringify(AREAS)),
    marks:{ST:[...ST], STMARK:{...STMARK}, STNAME:{...STNAME}, STCYC:{...STCYC}},
    habits:HABITS.map(h=>[...h]),
    kotwice:KOTWICE.map(k=>({...k, dni:[...k.dni]})),
    terminy:TERMINY.map(x=>({...x})),
    podroze:PODROZE.map(x=>({...x})),
    szablony:JSON.parse(JSON.stringify(SZABLONY)),
    home:HOME.map(h=>[...h])});
}
function cyklZnakow(){ const c = ST.filter(s=>STCYC[s]); return c.length ? c : ST; }
const HABITS = [["Sz","Szydełko"],["Dz","Dziennik"],["In","Inktober"],
  ["Wc","Wcierka"],["Al","Nakładki"]];
const HMARK = {1:"■",2:"◩",0:"□",3:"/"};
const TERMINY = [];            // {d:"2026-10-15", txt:"Test chusty"}
const PODROZE = [];            // {id, od:"2026-11-10", do:"2026-11-13", txt:"Wyjazd", area:"K"}
const SZABLONY = [];           // {nazwa, typ, tasks:[...], blocks:[...]}
const KOTWICE = [                       // zadania, które pojawiają się same
  {dni:[1,2,3,4,5,6,7], txt:"Leki",                 area:"K"},
  {dni:[1],             txt:"Lek tygodniowy",       area:"K"},
  {dni:[6],             txt:"Suplementy na tydzień",area:"K"}
];
const HOME = [
  ["prk","Pranie kolorowe","Dom"], ["prc","Pranie czarne","Dom"],
  ["prb","Pranie białe","Dom"],    ["zmyw","Zmywarka","Dom"],
  ["odk","Odkurzanie","Dom"],      ["kurz","Kurze","Dom"],
  ["glowa","Mycie głowy","Pielęgnacja"], ["pielr","Poranna rutyna","Pielęgnacja"],
  ["pielw","Wieczorna rutyna","Pielęgnacja"],
  ["woda","Woda","Zdrowie"],
  ["lekm","Lek raz w tygodniu — M","Zdrowie"],
  ["lekcal","Lek raz w tygodniu — Calfos","Zdrowie"],
  ["spiro","Spironol","Zdrowie"],  ["seron","Seronil","Zdrowie"],
  ["surano","Rano","Zdrowie"],     ["supol","Południe","Zdrowie"],
  ["supop","Popołudnie","Zdrowie"],["suwiecz","Wieczór","Zdrowie"]];
const SCALES = {
  F:{t:"fizyczne",  v:{5:"pełnia sił",4:"dobrze",3:"przeciętnie",2:"wyraźne zmęczenie",1:"bardzo źle"}},
  P:{t:"psychiczne",v:{5:"spokój, jasna głowa",4:"dobrze",3:"neutralnie",2:"przygnębienie, niepokój",1:"bardzo trudny dzień"}},
  E:{t:"efektywność",v:{5:"plan zrobiony, starczyło sił",4:"większość planu",3:"połowa",2:"pierwsza rzecz z listy",1:"nic — dzień N"}},
  C:{t:"cykl",      v:{1:"ok / plamienie",2:"normalny okres",3:"do wytrzymania",4:"ibuprofen",5:"lek na receptę"}}
};
const SCOL = {5:"var(--sc5)",4:"var(--sc4)",3:"var(--sc3)",2:"var(--sc2)",1:"var(--sc1)"};
const CCOL = {1:"var(--sc5)",2:"var(--sc4)",3:"var(--sc3)",4:"var(--sc2)",5:"var(--sc1)"};
/* dwa wyzwania na październik, oba prowadzone równolegle */
const INKTOBER = [
  {h:"#INKTOBERnoteka", dni:["Kawa","Pióro wieczne","Dynia","Liście","Książka","Ołówek","Lisek","Ogień",
    "Wiewiórka","Znaczek pocztowy","Atrament","Marzenie","Herbata","Zaklęcie","Deszcz","Jeż","Wiatr",
    "Szarlotka","Spacer","Grzyby","Aparat","Kocyk","Minimum","Kruk","Herbatnik","Klucz","Zagadka",
    "Wspomnienie","Strach na wróble","Nietoperz","Duch"]},
  {h:"#inkseatober", dni:["Dom","Oko","Drzewo","Tulipan","Książka","Droga","Ogień","Okno","Pudełko","Koło",
    "Ryba","Światło","Cień","Ptak","Krzesło","Pismo","Radość","Kubek","Pies","Kot","Słoń","Miłość","Woda",
    "Drzwi","Wazon","Liść","Muszla","Spacer","Owoc","Morze","Człowiek"]}
];
const inkNaDzien = (dstr)=>{
  const dt=parse(dstr);
  if(dt.getMonth()!==9) return [];
  const i=dt.getDate()-1;
  return INKTOBER.map(w=>({h:w.h, slowo:w.dni[i]})).filter(x=>x.slowo);
};
const REVIEW = ["Co się udało?","Co nie wyszło i dlaczego?","Czy bliżej celów kwartału?",
  "TOP 3 na przyszły tydzień","Energia: ile dni N, co pomagało?"];
const DOW = ["pon","wt","śr","czw","pt","sob","nd"];
const MONTHS = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia",
  "września","października","listopada","grudnia"];
const MONTHN = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień",
  "Wrzesień","Październik","Listopad","Grudzień"];
const VIEWS = [["dzis","Dziś"],["tydzien","Tydzień"],["miesiac","Miesiąc"],
  ["trackery","Trackery"],["cele","Cele"],["listy","Listy"],["legenda","Legenda"],
  ["ustawienia","Ustawienia"]];
cfgZapamietajFabryczne();     // dopiero gdy wszystkie stałe fabryczne są zadeklarowane

/* ---------- daty ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => {const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD = (s,n) => {const d=parse(s);d.setDate(d.getDate()+n);return key(d)};
const dowIdx = s => (parse(s).getDay()+6)%7;
const monday = s => addD(s,-dowIdx(s));
function isoWeek(s){
  const d=parse(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const y=d.getFullYear(), j4=new Date(y,0,4);
  const w=1+Math.round(((d-j4)/864e5-3+((j4.getDay()+6)%7))/7);
  return y+"-W"+pad(w);
}

const COFKA = [], PONOWKA = [], GLEBIA = 25;
let cofkaWToku = false;
function stanDo(path){
  const [col,id] = path.split("/");
  if(col==="days")   return S.day[id] || (S.mdays||{})[id] || null;
  if(col==="weeks")  return (S.week||{})[id] || null;
  if(col==="habits") return (S.habits||{})[id] || null;
  if(col==="health") return (S.health||{})[id] || null;
  if(col==="goals")  return (S.goals||[]).find(x=>x.id===id) || null;
  if(col==="lists")  return (S.lists||[]).find(x=>x.id===id) || null;
  return null;
}
function opisSciezki(path){
  const [col,id] = path.split("/");
  if(col==="days"){ const dt=parse(id); return dt.getDate()+" "+MONTHS[dt.getMonth()]; }
  if(col==="weeks")  return "tydzień "+String(id).split("-W")[1];
  if(col==="habits") return "nawyki";
  if(col==="health") return "samopoczucie";
  if(col==="goals")  return "cel";
  if(col==="lists")  return "lista";
  return col;
}
function migawka(path){
  const st = stanDo(path);
  return {path, opis:opisSciezki(path), kiedy:Date.now(),
    stan: st ? JSON.parse(JSON.stringify(st)) : null};
}
function zapamietajCofke(path, stary){
  if(cofkaWToku || path.startsWith("cfg/")) return;
  PONOWKA.length = 0;                       // nowa zmiana przerywa łańcuch przywracania
  const ost = COFKA[COFKA.length-1];
  if(ost && ost.path===path && Date.now()-ost.kiedy < 2500){ ost.kiedy = Date.now(); return; }
  const st = (arguments.length > 1) ? stary : stanDo(path);
  COFKA.push({path, opis:opisSciezki(path), kiedy:Date.now(),
    stan: st ? JSON.parse(JSON.stringify(st)) : null});
  if(COFKA.length > GLEBIA) COFKA.shift();
}
function przywrocStan(w){
  const [col,id] = w.path.split("/");
  if(w.stan === null){
    if(col==="days")   delete S.day[id];
    if(col==="weeks")  delete S.week[id];
    if(col==="habits") delete S.habits[id];
    if(col==="health") delete S.health[id];
    try{ S.db.doc(w.path).delete(); }catch(e){}
  }else{
    if(col==="days")   S.day[id]    = w.stan;
    if(col==="weeks")  S.week[id]   = w.stan;
    if(col==="habits") S.habits[id] = w.stan;
    if(col==="health") S.health[id] = w.stan;
    save(w.path, w.stan);
  }
}
function cofnij(){
  const w = COFKA.pop();
  if(!w || !S.db) return;
  cofkaWToku = true;
  PONOWKA.push(migawka(w.path));
  if(PONOWKA.length > GLEBIA) PONOWKA.shift();
  przywrocStan(w);
  cofkaWToku = false;
  S.blokEdyt = null; render();
}
function ponow(){

}

function save(path, patch){
  if(!S.db) return;
  zapamietajCofke(path);
  const prev = QUEUE.get(path) || {};
  QUEUE.set(path, {...prev, ...patch});
  clearTimeout(QUEUE.get(path+"#t"));
  const t = setTimeout(async()=>{
    const body = QUEUE.get(path); QUEUE.delete(path); QUEUE.delete(path+"#t");
    try{ await S.db.doc(path).set(body); }
    catch(e){ if(e&&e.code==="invalid_argument"&&S.canWrite!==false){S.canWrite=false;render();} }
  },350);
  QUEUE.set(path+"#t", t);
}

/* godzina wpisana z ręki: 9, 930, 9:30, 9.30, 0930 — zawsze wychodzi HH:MM */
const DOJAZD = 15;                  // minut na drogę przed i po wydarzeniu poza domem
const ONLINE = /(online|on-?line|zdaln|wideo|video|telefon|tel\.|meet|zoom|teams|skype|whatsapp|https?:\/\/)/i;
const naGodzine = (txt, zapas) => {
  const s = String(txt==null?"":txt).trim().replace(/[.,;\-]/g,":").replace(/\s+/g,"");
  if(!s) return zapas;
  let g=null, m=0, x;
  if(x = s.match(/^(\d{1,2}):(\d{1,2})$/)){ g=+x[1]; m=+x[2]; }
  else if(/^\d{1,2}$/.test(s)){ g=+s; m=0; }
  else if(/^\d{3}$/.test(s)){ g=+s.slice(0,1); m=+s.slice(1); }
  else if(/^\d{4}$/.test(s)){ g=+s.slice(0,2); m=+s.slice(2); }
  else return zapas;
  if(g===24 && m===0){ g=0; }
  if(g<0 || g>23 || m<0 || m>59) return zapas;
  return pad(g)+":"+pad(m);
};
/* koniec nie może wypaść przed początkiem: ruszony start przesuwa cały blok */
const paraPor = (b, s, e, ruszony) => {
  let ms = naMin(s), me = naMin(e);
  const dl = Math.max(15, naMin(b.e) - naMin(b.s));
  if(me <= ms){
    me = Math.min(1439, ms + (ruszony==="start" ? dl : 15));
    if(me <= ms) ms = Math.max(0, me - 15);
  }
  return {s:naCzas(ms), e:naCzas(me)};
};

const duza = s => {                 // wielka pierwsza LITERA, nawet gdy wpis zaczyna się od godziny
  const v = (s||"").trim();
  if(!v) return v;
  const i = v.search(/[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/);
  if(i < 0) return v;
  return v.slice(0,i) + v[i].toLocaleUpperCase("pl") + v.slice(i+1);
};

/* ---------- szybki wpis: jedno pole, rozbierane na części ---------- */
const DNISKROT = {pon:1, wt:2, "śr":3, sr:3, czw:4, pt:5, sob:6, nd:7, niedz:7};
function parsujWpis(wejscie){
  let s = " " + (wejscie||"") + " ";
  const dzisiaj = key(new Date());
  let data = S.date, od = null, doo = null, obszar = null;

  s = s.replace(/#(\S+)/g, (m, g)=>{
    const szuk = g.toLowerCase();
    const klucz = Object.keys(AREAS).find(k => k.toLowerCase() === szuk
      || (AREAS[k].n||"").toLowerCase().startsWith(szuk));
    if(klucz) obszar = klucz;
    return " ";
  });
  // litera obszaru na początku, jak w planerze papierowym: „G coś", „G - coś", „G: coś".
  // Gdy treść ma się zaczynać od tej samej litery, piszesz ją dwa razy: K K mamą.
  if(!obszar){
    s = s.replace(/^\s+([A-ZĄĆĘŁŃÓŚŹŻ])\s*[-–—:.]?\s+/, (m, lit)=>{
      if(!AREAS[lit]) return m;
      obszar = lit;
      return " ";
    });
  }
  s = s.replace(/(^|\s)(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2})(?::(\d{2}))?(?=\s)/,
    (m, p, h1, m1, h2, m2)=>{ od = pad(+h1)+":"+m1; doo = pad(+h2)+":"+(m2||"00"); return " "; });
  if(!od) s = s.replace(/(^|\s)(\d{1,2})\s*[-–]\s*(\d{1,2})(?=\s)/,
    (m, p, h1, h2)=>{ if(+h1>23||+h2>23) return m;
      od = pad(+h1)+":00"; doo = pad(+h2)+":00"; return " "; });
  if(!od) s = s.replace(/(^|\s)(\d{1,2}):(\d{2})(?=\s)/,
    (m, p, h, mi)=>{ if(+h>23||+mi>59) return m; od = pad(+h)+":"+mi; return " "; });
  s = s.replace(/(^|\s)(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?(?=\s)/,
    (m, p, dd, mm, rr)=>{ if(+mm<1||+mm>12||+dd<1||+dd>31) return m;
      data = (rr ? +rr : parse(dzisiaj).getFullYear())+"-"+pad(+mm)+"-"+pad(+dd); return " "; });
  s = s.replace(/(^|\s)(dziś|dzis|jutro|pojutrze)(?=\s)/i, (m, p, w)=>{
    const ile = {"dziś":0, dzis:0, jutro:1, pojutrze:2}[w.toLowerCase()];
    data = addD(dzisiaj, ile); return " "; });
  s = s.replace(/(^|\s)(pon|wt|śr|sr|czw|pt|sob|niedz|nd)(?=\s)/i, (m, p, w)=>{
    const cel = DNISKROT[w.toLowerCase()];
    const d = parse(dzisiaj);
    for(let i=0;i<8;i++){ if(((d.getDay()+6)%7)+1 === cel) break; d.setDate(d.getDate()+1); }
    data = key(d); return " "; });

  const czysty = s.replace(/\s+/g," ").trim();
  const czesci = czysty.split(";").map(x=>duza(x)).filter(Boolean);
  const rozbij = (x)=>{
    const m = x.match(/^(.+?)\s*[·:]\s*(.+)$/);
    return m ? {txt:duza(m[1]), proj:duza(m[2])} : {txt:x, proj:""};
  };
  const pary = czesci.map(rozbij);
  return {data, od, doo, obszar, txt:(pary[0]||{}).txt || "", czesci, pary};
}

}

/* ---------- co działa: wnioski z własnych danych ---------- */
const PORY = [["Rano","do 12:00",0,12],["Popołudnie","12:00–17:00",12,17],["Wieczór","po 17:00",17,24]];
function coDziala(daty){
  const pory = PORY.map(()=>({plan:0, zrob:0}));
  const typy = {};
  const dlugosci = [];
  daty.forEach(ds=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    const bl = (D.blocks||[]);
    if(D.type){ const w = typy[D.type] = typy[D.type] || {plan:0, zrob:0};
      w.plan += bl.length; w.zrob += bl.filter(b=>b.done).length; }
    bl.forEach(b=>{
      const h = +String(b.s).slice(0,2);
      const i = PORY.findIndex(([,,od,doo])=>h>=od && h<doo);
      if(i>=0){ pory[i].plan++; if(b.done) pory[i].zrob++; }
      if(b.done){
        const min = naMin(b.e) - naMin(b.s);
        if(min>0 && min<=600) dlugosci.push(min);
      }
    });
  });
  dlugosci.sort((a,b)=>a-b);
  const mediana = dlugosci.length ? dlugosci[Math.floor(dlugosci.length/2)] : null;
  return {pory, typy, zrobionych:dlugosci.length, mediana};
}
function sekcjaCoDziala(daty, naglowek){
  const w = coDziala(daty);
  const s = sec(naglowek || "Co u Ciebie działa");
  if(w.zrobionych < 5){
    s.append(el("p",{class:"note"},
      "Za mało danych na wnioski — domkniętych bloków: "+w.zrobionych+". "
      +"Zaznaczaj bloki jako zrobione; po kilkunastu wzór zacznie być widoczny."));
  }
  PORY.forEach(([nazwa,kiedy],i)=>{
    const p = w.pory[i];
    const proc = p.plan ? Math.round(p.zrob/p.plan*100) : null;
    s.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:8px"},
      el("span",{class:"note",style:"flex:1 1 auto;min-width:0"},nazwa+" · "+kiedy),
      el("b",{style:"font-weight:600;flex:0 0 auto"}, p.zrob+" z "+p.plan),
      el("span",{class:"note",style:"flex:0 0 46px;text-align:right"},
        proc===null ? "—" : (proc+"%"))));
  });
  if(w.mediana) s.append(el("p",{class:"note"},
    "Typowy domknięty blok trwa "+w.mediana+" minut."));
  const kluczeTypow = Object.keys(DAYTYPES).filter(k=>w.typy[k]);
  if(kluczeTypow.length){
    s.append(el("div",{class:"note",style:"margin-top:4px"},"Wykonanie według typu dnia"));
    kluczeTypow.forEach(k=>{
      const x = w.typy[k];
      s.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:8px"},
        el("span",{class:"note",style:"flex:1 1 auto;min-width:0"},nazwaTypu(k)),
        el("b",{style:"font-weight:600;flex:0 0 auto"}, x.zrob+" z "+x.plan)));
    });
  }
  if(w.zrobionych >= 5){
    const naj = w.pory
      .map((p,i)=>({i, proc: p.plan ? p.zrob/p.plan : 0, zrob:p.zrob}))
      .filter(x=>x.zrob>0).sort((a,b)=>b.proc-a.proc)[0];
    if(naj) s.append(el("p",{class:"note"},
      "Najwięcej domykasz w porze: "+PORY[naj.i][0].toLowerCase()
      +". To obserwacja z Twoich danych, nie zalecenie — jeśli się utrzyma przez kilka tygodni, "
      +"warto właśnie tam stawiać blok twórczy."));
  }
  return s;
}

/* ---------- liczby do przeglądu ---------- */
function podsumowanie(daty){
  let blok=0, blokD=0, zad=0, zrob=0, dniN=0, dniZ=0;
  const oceny={F:[],P:[],E:[]};
  daty.forEach(ds=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    const bl = D.blocks||[], ta = D.tasks||[];
    blok += bl.length; blokD += bl.filter(b=>b.done).length;
    zad += ta.length; zrob += ta.filter(t=>t.st==="done").length;
    if(D.type==="niska") dniN++;
    if(D.type) dniZ++;
    const h = (S.health[ds.slice(0,7)]||{})[+ds.slice(8)] || {};
    ["F","P","E"].forEach(k=>{ if(h[k]) oceny[k].push(h[k]); });
  });
  const sr = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length).toFixed(1).replace(".",",") : "—";
  return {blok, blokD, zad, zrob, dniN, dniZ, F:sr(oceny.F), P:sr(oceny.P), E:sr(oceny.E)};
}

function resub(){
  if(S.db) ensureMonth(S.month);
  S.subs.forEach(u=>{try{u()}catch(e){}}); S.subs=[];
  calLoad();
  if(!S.db) return;

  const hi=[m+"-31", addD(monday(d),6)].sort()[1];
  const on=(ref,fn)=>S.subs.push(ref.onSnapshot(fn, ()=>{}));
  on(S.db.doc("cfg/ui"), s=>{ cfgZastosuj(s.exists?s.data():null); render(); });
  on(S.db.doc("days/"+d),    s=>{S.day[d]=s.exists?s.data():null; dodajKotwice(d); render()});
  on(S.db.doc("weeks/"+w),   s=>{S.week[w]=s.exists?s.data():null; render()});
  on(S.db.doc("habits/"+m),  s=>{S.habits[m]=s.exists?s.data():{}; render()});
  on(S.db.doc("health/"+m),  s=>{S.health[m]=s.exists?s.data():{}; render()});
  on(S.db.collection("goals").orderBy("ord"), s=>{S.goals=s.docs.map(x=>({id:x.id,...x.data()})); render()});
  on(S.db.collection("lists").orderBy("ord"), s=>{S.lists=s.docs.map(x=>({id:x.id,...x.data()})); render()});
  on(S.db.collection("days").where("date",">=",lo).where("date","<=",hi),
     s=>{S.mdays={}; s.docs.forEach(x=>S.mdays[x.id]=x.data()); render()});
}

let calRange = "";
/* ---------- kalendarz Google: logowanie w przeglądarce, odczyt i zapis ---------- */
const GSCOPE = "https://www.googleapis.com/auth/calendar.events";
const GAPI   = "https://www.googleapis.com/calendar/v3";
const GTZ    = "Europe/Warsaw";
const GOK_KEY = "planer.gok";
let gTok = null, gExp = 0, gBusy = false, gLast = 0, calAt = 0, calEdit = null;
let gEverOk = false;
try{ gEverOk = localStorage.getItem(GOK_KEY)==="1"; }catch(e){}
function gMark(ok){
  gEverOk = ok;
  try{ ok ? localStorage.setItem(GOK_KEY,"1") : localStorage.removeItem(GOK_KEY); }catch(e){}
}

function gisLoad(){
  return new Promise((ok,no)=>{
    if(window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ()=>ok(); s.onerror = ()=>no({code:"offline"});
    document.head.append(s);
  });
}
function gValid(){ return !!gTok && Date.now() < gExp - 60000; }
async function gStore(){               // zgoda przeżywa zamknięcie aplikacji — szyfrowana tym samym PIN-em
  if(!AESKEY || !gTok) return;
  try{ localStorage.setItem(TOK_KEY, JSON.stringify(await seal(JSON.stringify({t:gTok, e:gExp})))); }
  catch(e){}
}
async function gRestore(){
  if(!AESKEY) return;
  try{
    const v = JSON.parse(localStorage.getItem(TOK_KEY)||"null"); if(!v) return;
    const o = JSON.parse(await unseal(v));
    if(o && o.e - 120000 > Date.now()){ gTok = o.t; gExp = o.e; }
  }catch(e){}
}
function gRequest(interactive){
  if(!GH.gcal) return Promise.reject({code:"no_client"});
  return gisLoad().then(()=>new Promise((ok,no)=>{
    let done = false;
    const cl = google.accounts.oauth2.initTokenClient({
      client_id: GH.gcal, scope: GSCOPE,
      callback: r=>{ done = true;
        if(r && r.access_token){
          gTok = r.access_token; gExp = Date.now() + ((r.expires_in||3600)*1000);
          gMark(true); gStore(); ok(gTok);
        } else no({code:"denied"}); },
      error_callback: e=>{ done = true;
        no({code:(e && e.type==="popup_closed") ? "denied" : "connect"}); }
    });
    try{ cl.requestAccessToken({prompt: interactive ? "" : "none"}); }
    catch(e){ no({code:"connect"}); }
    setTimeout(()=>{ if(!done) no({code:"connect"}); }, interactive ? 120000 : 10000);
  }));
}
async function gToken(interactive){
  if(gValid()) return gTok;
  return gRequest(interactive);
}
// Google otwiera okienko także przy cichym odnawianiu, a przeglądarka wpuszcza je
// tylko tuż po kliknięciu — więc odnawiamy przy okazji dowolnego kliknięcia w planerze.
document.addEventListener("pointerdown", ()=>{
  if(!GH.gcal || gBusy || gValid() || !gEverOk) return;
  if(Date.now() - gLast < 600000) return;
  gLast = Date.now(); gBusy = true;
  gRequest(false).then(()=>{ gBusy=false; calLoad(false,true); })
                 .catch(()=>{ gBusy=false; gMark(false);
                   S.cal.on=false; S.cal.err="connect"; render(); });
}, {capture:true, passive:true});

async function calApi(path, opts){
  let tok;
  try{ tok = await gToken(false); }catch(e){ tok = await gToken(true); }
  const h = Object.assign({Authorization:"Bearer "+tok, "Content-Type":"application/json"},
                          (opts && opts.headers) || {});
  const r = await fetch(GAPI+path, Object.assign({}, opts, {headers:h}));
  if(r.status===401 || r.status===403){ gTok=null; throw {code:"connect"}; }
  if(!r.ok){
    let m=""; try{ m=(await r.json()).error.message; }catch(e){}
    throw {code:"api", message: m || ("Błąd "+r.status)};
  }
  return r.status===204 ? null : r.json();
}
async function calLoad(interactive, force){
  const a = S.month+"-01", d = parse(a); d.setMonth(d.getMonth()+1); d.setDate(7);
  const from = addD(a,-7), to = key(d), rng = from+to;
  if(!force && !interactive && rng===calRange && Date.now()-calAt < 300000) return;
  calRange = rng;
  let tok = null;
  if(interactive){
    try{ tok = await gToken(true); }
    catch(e){ S.cal.on=false; S.cal.err=(e&&e.code)||"connect"; render(); return; }
  }else{
    if(!gValid()){                    // bez kliknięcia nie wywołujemy okienka Google
      S.cal.on=false; S.cal.err = GH.gcal ? "connect" : "no_client"; render(); return;
    }
    tok = gTok;
  }
  const q = "?timeMin="+from+"T00%3A00%3A00Z&timeMax="+to+"T00%3A00%3A00Z"
          + "&singleEvents=true&orderBy=startTime&maxResults=250&timeZone="+encodeURIComponent(GTZ);
  try{
    const r = await fetch(GAPI+"/calendars/primary/events"+q, {headers:{Authorization:"Bearer "+tok}});
    if(r.status===401 || r.status===403){ gTok=null; S.cal.err="connect"; S.cal.on=false; render(); return; }
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    S.cal.ev = j.items || []; S.cal.err = null; S.cal.on = true; calAt = Date.now();
  }catch(e){ S.cal.err = S.cal.ev.length ? null : "offline"; }
  render();
}
function calFields(e){                 // wpis Google -> pola formularza
  const allDay = !!(e.start && e.start.date);
  const sd = allDay ? e.start.date : ((e.start&&e.start.dateTime)||"").slice(0,10);
  let ed = allDay ? addD((e.end&&e.end.date)||sd,-1)
                  : ((e.end&&e.end.dateTime)||"").slice(0,10);
  if(!ed) ed = sd;
  return {id:e.id, allDay, title:e.summary||"", loc:e.location||"", desc:e.description||"",
    sd, ed,
    st:(e.start&&e.start.dateTime)?e.start.dateTime.slice(11,16):"09:00",
    et:(e.end&&e.end.dateTime)?e.end.dateTime.slice(11,16):"10:00",
    guests:(e.attendees||[]).filter(a=>!a.self).map(a=>a.email).join(", "),
    notify:true};
}
function evBody(f){
  const b = {summary: f.title || "(bez nazwy)"};
  b.location = f.loc || "";
  b.description = f.desc || "";
  if(f.allDay){
    b.start = {date:f.sd};
    b.end   = {date:addD((f.ed && f.ed>=f.sd) ? f.ed : f.sd, 1)};
  }else{
    let ed = (f.ed && f.ed>=f.sd) ? f.ed : f.sd;
    if(ed===f.sd && f.et<=f.st) ed = addD(f.sd,1);
    b.start = {dateTime:f.sd+"T"+f.st+":00", timeZone:GTZ};
    b.end   = {dateTime:ed+"T"+f.et+":00", timeZone:GTZ};
  }
  b.attendees = (f.guests||"").split(/[,;\s]+/)
    .filter(x=>x.indexOf("@")>0).map(email=>({email}));
  return b;
}
async function calEnsure(){            // wołane z kliknięcia, więc okienko Google jest dozwolone
  if(gValid()) return true;
  try{ await gToken(true); return true; }
  catch(e){ S.cal.on=false; S.cal.err=(e&&e.code)||"connect"; render(); return false; }
}
async function calSave(f){
  if(!f.title){ S.cal.msg="Wpisz nazwę wydarzenia."; render(); return; }
  if(!gValid() && !(await calEnsure())) return;
  S.cal.msg = "Zapisuję…"; render();
  const guests = (f.guests||"").indexOf("@")>0;
  const q = "?sendUpdates=" + (guests && f.notify ? "all" : "none");
  try{
    const b = JSON.stringify(evBody(f));
    if(f.id) await calApi("/calendars/primary/events/"+encodeURIComponent(f.id)+q,
                          {method:"PATCH", body:b});
    else     await calApi("/calendars/primary/events"+q, {method:"POST", body:b});
    calEdit = null; S.cal.msg = null; await calLoad(false,true);
  }catch(e){ S.cal.msg = e.message || CALERR[e.code] || "Nie udało się zapisać."; render(); }
}
async function calDel(id){
  if(!gValid() && !(await calEnsure())) return;
  S.cal.msg = "Usuwam…"; render();
  try{
    await calApi("/calendars/primary/events/"+encodeURIComponent(id)+"?sendUpdates=none",
                 {method:"DELETE"});
    calEdit = null; S.cal.msg = null; await calLoad(false,true);
  }catch(e){ S.cal.msg = e.message || CALERR[e.code] || "Nie udało się usunąć."; render(); }
}

function calFor(dateStr){
  return S.cal.ev.filter(e=>{
    const s=(e.start&&(e.start.date||e.start.dateTime))||"";
    const en=(e.end&&(e.end.date||e.end.dateTime))||"";
    if(!s) return false;
    const sd=s.slice(0,10);
    if(e.start&&e.start.date) return dateStr>=sd && dateStr<en.slice(0,10);
    return sd===dateStr;
  }).map(e=>({id:e.id, t:(e.start&&e.start.dateTime)?e.start.dateTime.slice(11,16):"",
      s:e.summary||"(bez nazwy)", allDay:!!(e.start&&e.start.date),
      st:(e.start&&e.start.dateTime)||"", en:(e.end&&e.end.dateTime)||"", raw:e}))
   .sort((a,b)=>a.t.localeCompare(b.t));

/* ---------- przytrzymanie palcem ---------- */
let ostatnieDlugie = 0;
function przytrzymanie(elem, fn, ms){
  let licznik=null, x0=0, y0=0;
  const stop=()=>{ if(licznik){ clearTimeout(licznik); licznik=null; } };
  elem.addEventListener("pointerdown",(ev)=>{
    stop(); x0=ev.clientX; y0=ev.clientY;
    licznik=setTimeout(()=>{ licznik=null; ostatnieDlugie=Date.now();
      if(navigator.vibrate) navigator.vibrate(8); fn(); }, ms||420);
  });
  elem.addEventListener("pointermove",(ev)=>{
    if(Math.abs(ev.clientY-y0)>10 || Math.abs(ev.clientX-x0)>10) stop();
  });
  elem.addEventListener("pointerup",stop);
  elem.addEventListener("pointercancel",stop);
  // iPhone sam pokazuje menu zaznaczania przy długim dotknięciu — blokujemy je
  elem.addEventListener("contextmenu",(ev)=>ev.preventDefault());
}

/* ---------- mały kalendarz miesiąca ---------- */
function miniKalendarz(dstr){
  const d=parse(dstr), y=d.getFullYear(), m=d.getMonth();
  const przesun=(new Date(y,m,1).getDay()+6)%7;
  const ile=new Date(y,m+1,0).getDate();
  const tyg=isoWeek(dstr), dzisiaj=key(new Date());
  const g=el("div",{class:"mini"});
  DOW.forEach(n=>g.append(el("span",{class:"mdow"},n)));
  for(let i=0;i<przesun;i++) g.append(el("span",{}));
  for(let i=1;i<=ile;i++){
    const ds=y+"-"+pad(m+1)+"-"+pad(i);
    const kl=["mday"];
    if(isoWeek(ds)===tyg) kl.push("wtyg");
    if(ds===dstr) kl.push("wybrany");
    if(ds===dzisiaj) kl.push("dzisiaj");
    g.append(el("button",{class:kl.join(" "),title:ds,
      onclick:()=>{S.date=ds; S.month=ds.slice(0,7); resub(); render();}}, String(i)));
  }
  const s=sec(MONTHN[m]+" "+y, g);
  s.append(el("p",{class:"note"},"Podświetlony pas to tydzień, nad którym pracujesz."));
  return s;
}
