<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd7f90">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bd7f90'/%3E%3Crect x='9' y='8' width='14' height='17' rx='2' fill='%23fffdfb'/%3E%3Cpath d='M12 13h8M12 17h8M12 21h5' stroke='%23bd7f90' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Planer Klaudii</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
<style>
/* Układ: pasek boczny z działami, treść w kartach na papierze. Papier w kratkę tylko jako tło biurka,
   nigdy pod tekstem. Kolory: okładka FairyFloss, papier Tomoe River, atramenty Sabimidori i Budounezu. */
:root{
  --desk:#ece3e0; --paper:#fffdfb; --paper-2:#faf5f2; --side:#f4ecea;
  --grid:rgba(140,100,90,.09); --grid-5:rgba(140,100,90,.16);
  --fg:#2e2a29; --fg-2:#6b615d; --fg-3:#9c918c;
  --line:#e6dbd6; --line-2:#efe6e2;
  --pink:#bd7f90; --pink-2:#a86a7c; --pink-soft:#f7e9ec;
  --ink:#4a6a5b; --dziennik:#6b5a6e;
  --s:#8e5bb5; --g:#4a7fa8; --t:#c85f20; --z:#8a6248; --o:#68742a; --r:#b8283a;
  --sc5:#148a72; --sc4:#68742a; --sc3:#cf9420; --sc2:#c85f20; --sc1:#b8283a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --disp:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#191617; --paper:#262223; --paper-2:#2c2728; --side:#201c1d;
  --grid:rgba(255,230,220,.045); --grid-5:rgba(255,230,220,.08);
  --fg:#efe9e7; --fg-2:#a89e9a; --fg-3:#7d7470;
  --line:#3a3335; --line-2:#322c2e;
  --pink:#d395a5; --pink-2:#e3adba; --pink-soft:#3a2b30;
  --ink:#9ec0ac; --dziennik:#c9b0cc;
  --s:#b388d6; --g:#78aad4; --t:#ec8c4e; --z:#b08a6c; --o:#9aa84a; --r:#e2616f;
  --sc5:#2bb394; --sc4:#9aa84a; --sc3:#e0b44a; --sc2:#ec8c4e; --sc1:#e2616f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#191617; --paper:#262223; --paper-2:#2c2728; --side:#201c1d;
  --grid:rgba(255,230,220,.045); --grid-5:rgba(255,230,220,.08);
  --fg:#efe9e7; --fg-2:#a89e9a; --fg-3:#7d7470;
  --line:#3a3335; --line-2:#322c2e;
  --pink:#d395a5; --pink-2:#e3adba; --pink-soft:#3a2b30;
  --ink:#9ec0ac; --dziennik:#c9b0cc;
  --s:#b388d6; --g:#78aad4; --t:#ec8c4e; --z:#b08a6c; --o:#9aa84a; --r:#e2616f;
  --sc5:#2bb394; --sc4:#9aa84a; --sc3:#e0b44a; --sc2:#ec8c4e; --sc1:#e2616f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--ui);font-size:14.5px;
  line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:1px;border-radius:5px}

#shell{display:flex;height:100%;min-height:0}
#side{width:190px;flex:0 0 190px;background:var(--side);border-right:1px solid var(--line);
  padding:16px 11px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
#side h1{font-family:var(--disp);font-size:17px;font-weight:500;letter-spacing:.02em;
  margin:2px 0 14px 9px;color:var(--pink-2)}
.nav{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;background:transparent;
  border-radius:7px;width:100%;text-align:left;color:var(--fg);font-family:var(--disp);font-size:15px}
.nav:hover{background:var(--pink-soft)}
.nav[aria-current="page"]{background:var(--pink);color:#fff}
#side .foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--fg-3);line-height:1.55}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:color-mix(in srgb,var(--desk) 90%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header.bar h2{margin:0;font-family:var(--disp);font-size:20px;font-weight:500;letter-spacing:-.005em}
header.bar .sub{color:var(--fg-2);font-size:12.5px}
.spacer{flex:1}
.scroll{flex:1;overflow-y:auto;padding:20px 22px 44px;
  background-image:linear-gradient(var(--grid-5) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-5) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:60px 60px,60px 60px,12px 12px,12px 12px}
.wrap{max-width:900px;display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,290px);gap:16px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.colbox{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:820px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}

/* karta = kartka papieru */
.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px 17px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;
  box-shadow:0 1px 2px rgba(90,60,55,.05)}
.sec>h3{margin:0;font-family:var(--disp);font-size:13px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pink-2);border-bottom:1px solid var(--line-2);padding-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{flex-wrap:nowrap}
.row.tight input{flex:1 1 90px;min-width:0}
.note{color:var(--fg-2);font-size:12.5px;line-height:1.6}
.serif{font-family:var(--disp)}

.btn{border:1px solid var(--line);background:var(--paper-2);border-radius:6px;
  padding:3px 10px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--pink);color:var(--pink-2)}
.btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.icon{padding:2px 9px}
.ghost{border:0;background:transparent;color:var(--fg-3);padding:2px 5px;border-radius:4px;font-size:12px}
.ghost:hover{background:var(--pink-soft);color:var(--pink-2)}
input[type=text],input[type=time],textarea,select{background:transparent;border:0;
  border-bottom:1px solid var(--line);border-radius:0;padding:2px 2px;width:100%;color:var(--fg)}
input[type=text]:focus,textarea:focus,input[type=time]:focus{outline:0;border-bottom-color:var(--pink)}
textarea{resize:none;line-height:1.65;padding:3px 2px}
.grow{resize:vertical}
::placeholder{color:var(--fg-3)}
label.fld{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--fg-3);
  font-family:var(--disp);letter-spacing:.09em;text-transform:uppercase}

/* zadania */
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;align-items:flex-start;gap:8px;padding:2px 3px;border-radius:6px;min-height:26px;
  border:0;background:transparent;font:inherit;color:inherit;text-align:left;width:100%}
.task:hover{background:var(--pink-soft)}
.mark{border:0;background:transparent;width:18px;flex:0 0 18px;text-align:center;font-size:14px;
  line-height:1.65;padding:0}
.ttxt{flex:1;min-width:0;line-height:1.55;word-break:break-word;background:transparent;border:0;
  padding:0;text-align:left;color:var(--fg)}
.task.done .ttxt{color:var(--fg-2)}
.task.canc .ttxt{color:var(--fg-3);text-decoration:line-through}
.task.moved .ttxt,.task.later .ttxt{color:var(--fg-2)}
.tools{display:flex;gap:0;opacity:0;flex:0 0 auto}
.task:hover .tools,.task:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:.6}}
.divider{border-top:1px dashed var(--line);margin:6px 0 6px 26px;width:120px;height:0}

/* oś godzin */
.axis{display:grid;grid-template-columns:30px 1fr;border:1px solid var(--line-2);
  border-radius:7px;overflow:hidden;background:var(--paper-2)}
.hr{display:contents}
.hlab{font-size:10.5px;color:var(--fg-3);padding-right:5px;text-align:right;height:24px;
  display:flex;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;
  border-top:1px solid var(--line-2)}
.hcell{height:24px;position:relative;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.hr:first-child .hlab,.hr:first-child .hcell{border-top:0}
.blk{position:absolute;left:3px;right:3px;border-radius:4px;padding:0 6px;font-size:11.5px;
  overflow:hidden;white-space:nowrap;border:1.5px solid currentColor;line-height:20px}
.blk span{color:var(--fg)}

/* tabele */
.tb{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.tb .lft{width:38%}
.tb.hab .lft{width:26%}
.tb th{font-weight:400;color:var(--fg-3);font-size:10.5px;padding:0 1px 4px;text-align:center;
  font-family:var(--disp);letter-spacing:.06em}
.tb th.lft{text-align:left}
.tb td{border-top:1px solid var(--line-2);padding:0;text-align:center}
.tb td.lft{text-align:left;padding:0 3px;color:var(--fg-2);white-space:nowrap;line-height:26px}
.cell{width:100%;height:26px;border:0;background:transparent;border-left:1px solid var(--line-2);
  font-size:12.5px;padding:0;color:var(--fg)}
.cell:hover{background:var(--pink-soft)}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px}
.tb tr.wk td{background:var(--paper-2)}
.scrollx{overflow-x:auto}

/* miesiąc */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-2);
  border-left:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.mg .dow{font-size:10.5px;color:var(--fg-3);text-align:center;line-height:22px;font-family:var(--disp);
  letter-spacing:.06em;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.mcell{min-height:76px;background:transparent;border:0;border-right:1px solid var(--line-2);
  border-bottom:1px solid var(--line-2);padding:4px 5px;text-align:left;display:flex;
  flex-direction:column;gap:1px;overflow:hidden;font-size:11px;color:var(--fg);line-height:1.4}
.mcell:hover{background:var(--pink-soft)}
.mcell.out{opacity:.35}
.mcell.today{box-shadow:inset 0 0 0 2px var(--pink)}
.mcell .dn{font-size:11.5px;color:var(--fg-2);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}
.chip{font-size:10px;border-radius:9px;padding:0 6px;border:1px solid var(--line);color:var(--fg-2);
  font-family:var(--disp)}
.err{background:var(--pink-soft);border:1px solid var(--pink);border-radius:7px;
  padding:8px 11px;font-size:12.5px;line-height:1.55;color:var(--fg)}
.goalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (min-width:640px){.goalgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1040px){.goalgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.goalgrid textarea{min-height:46px}
.legend dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.legend dt{font-size:15px;text-align:center;color:var(--fg-2)}
.legend dd{margin:0}

#tabsbot{display:none}
@media (max-width:720px){
  #side{display:none}
  #shell{flex-direction:column}
  .scroll{padding:14px 14px 20px}
  header.bar{padding:10px 14px;align-items:center}
  header.bar>.spacer{flex-basis:100%;height:0;margin:0}
  #tabsbot{display:flex;position:sticky;bottom:0;background:var(--side);
    border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));
    gap:1px;z-index:6;overflow-x:auto;scrollbar-width:none}
  #tabsbot::-webkit-scrollbar{display:none}
  #tabsbot button{flex:1 1 auto;min-width:0;background:transparent;border:0;color:var(--fg-2);
    font-family:var(--disp);font-size:12.5px;padding:5px 4px;border-radius:7px;white-space:nowrap}
  #tabsbot button[aria-current="page"]{background:var(--pink);color:#fff}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="shell">
  <nav id="side">
    <h1>Planer</h1>
    <div id="navtop"></div>
    <div class="foot">B6 · X–XII 2026<br>Zapisuje się samo.</div>
  </nav>
  <main>
    <header class="bar" id="bar"></header>
    <div class="scroll"><div class="wrap" id="view"></div></div>
  </main>
</div>
<nav id="tabsbot"></nav>

<script>
"use strict";
/* ---------- stałe z planera ---------- */
const AREAS = {
  S:{n:"studia",     c:"var(--s)", nr:"68"},
  G:{n:"gabinet",    c:"var(--g)", nr:"63"},
  T:{n:"twórczość",  c:"var(--t)", nr:"73"},
  Z:{n:"życie",      c:"var(--z)", nr:"77"},
  O:{n:"odpoczynek", c:"var(--o)", nr:"57"},
  R:{n:"termin",     c:"var(--r)", nr:"29"}
};
const DAYTYPES = {
  Z:"zjazd — zajęcia 8:00–18:30, po nich odpoczynek",
  G:"gabinet — notatki zaraz po konsultacji",
  W:"wolny — 3 bloki w oknie przedszkolnym + 1 wieczorem",
  M:"mieszany — konsultacje i 1 blok twórczy",
  N:"niska energia — pierwsza rzecz z listy albo nic",
  R:"regeneracja — bez pracy, zaplanowane"
};
const ST = ["todo","part","done","canc","moved","later","event","note"];
const STMARK = {todo:"•",part:"◩",done:"✓",canc:"×",moved:">",later:"<",event:"○",note:"–"};
const STNAME = {todo:"zadanie",part:"zaczęte / minimum",done:"zrobione",canc:"anulowane",
  moved:"przeniesione",later:"kiedyś / może",event:"wydarzenie",note:"notatka"};
const HABITS = [["Sz","szydełko"],["Dz","dziennik"],["Wc","wcierka"],["Su","suplementy"],["Wo","woda"],["Al","nakładki"]];
const HMARK = {1:"■",2:"◩",0:"□",3:"/"};
const HOME = [["pranie","pranie"],["zmyw","zmywarka"],["glowa","mycie głowy"],
  ["pielr","pielęgnacja rano"],["pielw","pielęgnacja wieczór"],["leki","leki"],["lektyg","lek tygodniowy"]];
const SCALES = {
  F:{t:"fizyczne",  v:{5:"pełnia sił",4:"dobrze",3:"przeciętnie",2:"wyraźne zmęczenie",1:"bardzo źle"}},
  P:{t:"psychiczne",v:{5:"spokój, jasna głowa",4:"dobrze",3:"neutralnie",2:"przygnębienie, niepokój",1:"bardzo trudny dzień"}},
  E:{t:"efektywność",v:{5:"plan zrobiony, starczyło sił",4:"większość planu",3:"połowa",2:"pierwsza rzecz z listy",1:"nic — dzień N"}},
  C:{t:"cykl",      v:{1:"ok / plamienie",2:"normalny okres",3:"do wytrzymania",4:"ibuprofen",5:"lek na receptę"}}
};
const SCOL = {5:"var(--sc5)",4:"var(--sc4)",3:"var(--sc3)",2:"var(--sc2)",1:"var(--sc1)"};
const CCOL = {1:"var(--sc5)",2:"var(--sc4)",3:"var(--sc3)",4:"var(--sc2)",5:"var(--sc1)"};
const INKTOBER = ["Kawa","Pióro wieczne","Dynia","Liście","Książka","Ołówek","Lisek","Ogień","Wiewiórka",
  "Znaczek pocztowy","Atrament","Marzenie","Herbata","Zaklęcie","Deszcz","Jeż","Wiatr","Szarlotka","Spacer",
  "Grzyby","Aparat","Kocyk","Minimum","Kruk","Herbatnik","Klucz","Zagadka","Wspomnienie","Strach na wróble",
  "Nietoperz","Duch"];
const REVIEW = ["Co się udało?","Co nie wyszło i dlaczego?","Czy bliżej celów kwartału?",
  "TOP 3 na przyszły tydzień","Energia: ile dni N, co pomagało?"];
const DOW = ["pon","wt","śr","czw","pt","sob","nd"];
const MONTHS = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia",
  "września","października","listopada","grudnia"];
const MONTHN = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień",
  "Wrzesień","Październik","Listopad","Grudzień"];
const VIEWS = [["dzis","Dziś"],["tydzien","Tydzień"],["miesiac","Miesiąc"],
  ["trackery","Trackery"],["cele","Cele"],["listy","Listy"],["legenda","Legenda"]];

/* ---------- daty ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => {const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD = (s,n) => {const d=parse(s);d.setDate(d.getDate()+n);return key(d)};
const dowIdx = s => (parse(s).getDay()+6)%7;
const monday = s => addD(s,-dowIdx(s));
function isoWeek(s){
  const d=parse(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const y=d.getFullYear(), j4=new Date(y,0,4);
  const w=1+Math.round(((d-j4)/864e5-3+((j4.getDay()+6)%7))/7);
  return y+"-W"+pad(w);
}
const longDate = s => {const d=parse(s);return DOW[dowIdx(s)]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};

/* ---------- stan ---------- */
const S = {
  view:"dzis", date:key(new Date()), month:null, db:null, canWrite:null, mcp:null,
  day:{}, week:{}, habits:{}, health:{}, goals:[], lists:[], mdays:{},
  cal:{ev:[],err:null,on:false}, subs:[], ready:false
};
S.month = S.date.slice(0,7);
const el = (t,p={},...k)=>{const e=document.createElement(t);
  for(const[a,v] of Object.entries(p)){
    if(a==="class")e.className=v; else if(a==="html")e.innerHTML=v;
    else if(a.startsWith("on"))e.addEventListener(a.slice(2),v);
    else if(v===true)e.setAttribute(a,""); else if(v!==false&&v!=null)e.setAttribute(a,v);}
  for(const c of k.flat()) if(c!=null) e.append(c.nodeType?c:document.createTextNode(c));
  return e};
const sec = (title,...kids) => el("div",{class:"sec"}, title?el("h3",{},title):null, ...kids);

/* ---------- zapis ---------- */
const QUEUE = new Map();
function save(path, patch){
  if(!S.db) return;
  const prev = QUEUE.get(path) || {};
  QUEUE.set(path, {...prev, ...patch});
  clearTimeout(QUEUE.get(path+"#t"));
  const t = setTimeout(async()=>{
    const body = QUEUE.get(path); QUEUE.delete(path); QUEUE.delete(path+"#t");
    try{ await S.db.doc(path).set(body); }
    catch(e){ if(e&&e.code==="invalid_argument"&&S.canWrite!==false){S.canWrite=false;render();} }
  },350);
  QUEUE.set(path+"#t", t);
}
const dayDoc  = d => ({date:d, type:"", must:"", tasks:[], blocks:[], journal:"", ...(S.day[d]||{})});
const saveDay = (d,p)=>{ S.day[d]={...dayDoc(d),...p}; save("days/"+d, S.day[d]); render(); };
const weekDoc = w => ({top3:["","",""], quota:{}, home:{}, review:{}, ...(S.week[w]||{})});
const saveWeek= (w,p)=>{ S.week[w]={...weekDoc(w),...p}; save("weeks/"+w, S.week[w]); render(); };
const uid = ()=>Math.random().toString(36).slice(2,9);

/* ---------- subskrypcje ---------- */
function ensureMonth(m){
  const f = "data/days-"+m+".json";
  if(FILES[f] || !S.db) return;
  FILES[f] = {sha:null, data:{}};
  pull(f).then(fire).catch(()=>{});
}
function resub(){
  if(S.db) ensureMonth(S.month);
  S.subs.forEach(u=>{try{u()}catch(e){}}); S.subs=[];
  if(S.mcp) watchCal(S.mcp);
  if(!S.db) return;
  const d=S.date, w=isoWeek(d), m=S.month;
  const lo=[m+"-01", monday(d)].sort()[0];
  const hi=[m+"-31", addD(monday(d),6)].sort()[1];
  const on=(ref,fn)=>S.subs.push(ref.onSnapshot(fn, ()=>{}));
  on(S.db.doc("days/"+d),    s=>{S.day[d]=s.exists?s.data():null; render()});
  on(S.db.doc("weeks/"+w),   s=>{S.week[w]=s.exists?s.data():null; render()});
  on(S.db.doc("habits/"+m),  s=>{S.habits[m]=s.exists?s.data():{}; render()});
  on(S.db.doc("health/"+m),  s=>{S.health[m]=s.exists?s.data():{}; render()});
  on(S.db.collection("goals").orderBy("ord"), s=>{S.goals=s.docs.map(x=>({id:x.id,...x.data()})); render()});
  on(S.db.collection("lists").orderBy("ord"), s=>{S.lists=s.docs.map(x=>({id:x.id,...x.data()})); render()});
  on(S.db.collection("days").where("date",">=",lo).where("date","<=",hi),
     s=>{S.mdays={}; s.docs.forEach(x=>S.mdays[x.id]=x.data()); render()});
}

/* ---------- kalendarz Google ---------- */
let calUnsub=null, calRange="";
function watchCal(mcp){
  const a=S.month+"-01", d=parse(a); d.setMonth(d.getMonth()+1); d.setDate(7);
  const from=addD(a,-7), to=key(d), rng=from+to;
  if(rng===calRange) return; calRange=rng;
  if(calUnsub){try{calUnsub()}catch(e){}}
  calUnsub = mcp.watchTool("Google Calendar","list_events",
    {startTime:from+"T00:00:00+01:00", endTime:to+"T00:00:00+01:00",
     timeZone:"Europe/Warsaw", orderBy:"startTime", pageSize:250},
    ev=>{
      if(ev.type==="data"){
        const p=ev.result&&ev.result.payload;
        S.cal.ev=(p&&p.events)||[]; S.cal.err=null; S.cal.on=true;
      }else{
        const c=ev.error&&ev.error.code;
        if(["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy",
            "approval_required","consent_required","selection_required"].includes(c)){
          S.cal.ev=[]; S.cal.err=c;
        }else S.cal.err=S.cal.ev.length?null:c;
      }
      render();
    },{refetchInterval:300000});
}
function calFor(dateStr){
  return S.cal.ev.filter(e=>{
    const s=(e.start&&(e.start.date||e.start.dateTime))||"";
    const en=(e.end&&(e.end.date||e.end.dateTime))||"";
    if(!s) return false;
    const sd=s.slice(0,10);
    if(e.start&&e.start.date) return dateStr>=sd && dateStr<en.slice(0,10);
    return sd===dateStr;
  }).map(e=>({t:(e.start&&e.start.dateTime)?e.start.dateTime.slice(11,16):"",s:e.summary||"(bez nazwy)"}))
   .sort((a,b)=>a.t.localeCompare(b.t));
}
const CALERR = {
  needs_reauth:"Połącz ponownie Kalendarz Google w ustawieniach Claude → Połączenia.",
  server_not_connected:"Dodaj Kalendarz Google w ustawieniach Claude → Połączenia.",
  selection_required:"Masz kilka kalendarzy o tej nazwie — wybierz jeden w Claude.",
  not_in_manifest:"Kalendarz nie jest dopuszczony dla tej strony.",
  blocked_by_policy:"Kalendarz zablokowany regulaminem organizacji.",
  approval_required:"Kalendarz wymaga zgody administratora.",
  consent_required:"Zezwól tej stronie na Kalendarz Google i odśwież stronę."
};

/* ---------- Miesiąc ---------- */

    if(i>=35&&out) break;

    cols.forEach(([k,label])=>{
      const ta=el("textarea",{rows:2,placeholder:"—"}); ta.value=g[k]||"";
      ta.addEventListener("change",()=>save("goals/"+g.id,{...g,[k]:ta.value}));

      kiedys:"",rok:"",kwartal:"",miesiac:"",tydzien:"",dzien:""})}},"Dodaj cel"));
  return {W:out};
}

    const s=sec(null,el("div",{class:"row tight",style:"border-bottom:1px solid var(--line-2);padding-bottom:5px"},
      ttl,el("span",{class:"spacer"}),
      el("button",{class:"ghost",title:"Usuń listę",onclick:()=>{S.db&&S.db.doc("lists/"+L.id).delete()}},"✕")));
    const ul=el("div",{class:"tasks"});
    items.forEach(it=>{
      const i=el("input",{type:"text",value:it.txt});

      ul.append(el("div",{class:"task"+(it.done?" done":"")},
        el("button",{class:"mark",style:"color:var(--t)",onclick:()=>
          save("lists/"+L.id,{...L,items:items.map(x=>x.id===it.id?{...x,done:!x.done}:x)})},it.done?"✓":"•"),
        i,
        el("button",{class:"ghost",title:"Usuń",onclick:()=>
          save("lists/"+L.id,{...L,items:items.filter(x=>x.id!==it.id)})},"✕")));

    S.db&&S.db.collection("lists").add({title:"Nowa lista",ord:S.lists.length+1,items:[]})}},"Dodaj listę"));

}

function buildBar(){

  const B=(label,fn,title)=>el("button",{class:"btn icon",onclick:fn,title:title||label},label);

      el("span",{class:"spacer"}),

      el("button",{class:"btn",onclick:()=>{S.date=key(new Date());S.month=S.date.slice(0,7);resub();go();render()}},"Dziś"),
      B("›",()=>{S.date=addD(S.date,1);S.month=S.date.slice(0,7);resub();go();render()},"Następny dzień"));

    const mon=monday(S.date), sun=addD(mon,6);

      el("span",{class:"sub"},parse(mon).getDate()+"–"+parse(sun).getDate()+" "+MONTHS[parse(sun).getMonth()]),
      el("span",{class:"spacer"}),
      B("‹",()=>{S.date=addD(S.date,-7);S.month=S.date.slice(0,7);resub();go();render()},"Poprzedni tydzień"),
      B("›",()=>{S.date=addD(S.date,7);S.month=S.date.slice(0,7);resub();go();render()},"Następny tydzień"));
  }else if(S.view==="miesiac"||S.view==="trackery"){
    const [y,m]=S.month.split("-").map(Number);
    const shift=n=>{const d=new Date(y,m-1+n,1);S.month=d.getFullYear()+"-"+pad(d.getMonth()+1);resub();go();render()};
    bar.append(el("h2",{},S.view==="miesiac"?MONTHN[m-1]:("Trackery · "+MONTHN[m-1])),
      el("span",{class:"sub"},String(y)),el("span",{class:"spacer"}),
      B("‹",()=>shift(-1),"Poprzedni miesiąc"),B("›",()=>shift(1),"Następny miesiąc"));
  }else{
    bar.append(el("h2",{},{cele:"Cele",listy:"Listy",legenda:"Legenda"}[S.view]),
      el("span",{class:"spacer"}));
  }
  if(S.db){
    bar.append(el("button",{class:"btn icon",id:"sync",title:"Stan zapisu",
      onclick:()=>{ DIRTY.size ? flush() : pullAll(); }},"zapisane"),
      el("button",{class:"btn icon",title:"Ustawienia połączenia",
        onclick:()=>{ S.ready=true; setupScreen(); }},"⚙"));
    setTimeout(status,0);
  }
}

/* ---------- magazyn danych: prywatne repozytorium GitHub ---------- */
const CFG_KEY = "planer.cfg";
const GH = {owner:"KlaudiaDobrolinska", repo:"planer", token:"", branch:"main"};
const FILES = {};            // ścieżka pliku -> {sha, data}
const SUBS  = [];            // subskrypcje w pamięci
const DIRTY = new Set();     // pliki do zapisania
let   SAVING = false, SAVED_AT = 0, SAVE_ERR = null, PULLING = false;

function cfgLoad(){
  try{ Object.assign(GH, JSON.parse(localStorage.getItem(CFG_KEY)||"{}")); }catch(e){}
  return !!(GH.owner && GH.repo && GH.token);
}
function cfgSave(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(GH)); }catch(e){} }

const fileFor = path => {
  const [col, id] = path.split("/");
  return col === "days" ? "data/days-" + id.slice(0,7) + ".json" : "data/" + col + ".json";
};
const b64 = s => { const b = new TextEncoder().encode(s); let r="";
  for(const x of b) r += String.fromCharCode(x); return btoa(r); };
const unb64 = s => new TextDecoder().decode(
  Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));

async function api(path, opts){
  const r = await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+path,
    Object.assign({headers:{Authorization:"Bearer "+GH.token,
      Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}, opts||{}));
  if(r.status === 404) return null;
  if(!r.ok) throw Object.assign(new Error("GitHub "+r.status), {status:r.status});
  return r.json();
}
async function pull(file){
  const j = await api(file + "?ref=" + GH.branch);
  FILES[file] = j ? {sha:j.sha, data:JSON.parse(unb64(j.content))} : {sha:null, data:{}};
  return FILES[file];
}
async function push(file){
  const f = FILES[file]; if(!f) return;
  const body = {message:"planer "+new Date().toISOString().slice(0,16).replace("T"," "),
    content:b64(JSON.stringify(f.data, null, 1)), branch:GH.branch};
  if(f.sha) body.sha = f.sha;
  try{
    const j = await api(file, {method:"PUT", body:JSON.stringify(body)});
    f.sha = j.content.sha;
  }catch(e){
    if(e.status === 409 || e.status === 422){      // ktoś zapisał w międzyczasie
      const mine = f.data; await pull(file);
      FILES[file].data = Object.assign({}, FILES[file].data, mine);
      return push(file);
    }
    throw e;
  }
}
let saveTimer = null;
function schedule(file){
  DIRTY.add(file);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1500);
}
async function flush(){
  if(SAVING || !DIRTY.size) return;
  SAVING = true; SAVE_ERR = null; status();
  const todo = [...DIRTY]; DIRTY.clear();
  try{ for(const f of todo) await push(f); SAVED_AT = Date.now(); }
  catch(e){ SAVE_ERR = e.status === 401 || e.status === 403
      ? "Token nie ma prawa zapisu albo wygasł."
      : "Nie udało się zapisać. Sprawdź połączenie."; todo.forEach(f=>DIRTY.add(f)); }
  SAVING = false; status();
}
window.addEventListener("beforeunload", e => { if(DIRTY.size){ flush(); e.preventDefault(); e.returnValue=""; } });

const fire = () => SUBS.slice().forEach(f => { try{ f(); }catch(e){} });
const snap = (id, d) => ({id, exists:!!d, data:()=>d, metadata:{fromCache:false,hasPendingWrites:false}});

function docRef(path){
  const [col,id] = path.split("/"), file = fileFor(path);
  const bag = () => (FILES[file] || {data:{}}).data;
  return {
    id, path,
    get(){ return Promise.resolve(snap(id, bag()[id])); },
    set(d){ (FILES[file] = FILES[file] || {sha:null,data:{}}).data[id] = d; schedule(file); fire(); return Promise.resolve(); },
    update(d){ Object.assign(bag()[id] || (bag()[id]={}), d); schedule(file); fire(); return Promise.resolve(); },
    delete(){ delete bag()[id]; schedule(file); fire(); return Promise.resolve(); },
    onSnapshot(n){ const f=()=>n(snap(id,bag()[id])); SUBS.push(f); setTimeout(f,0);
      return ()=>{ const i=SUBS.indexOf(f); if(i>=0) SUBS.splice(i,1); }; },
    collection(c){ return colRef(path+"/"+c); }
  };
}
function colRef(col, filters, ord){
  filters = filters || [];
  const rows = () => {
    let out = [];
    if(col === "days"){
      Object.keys(FILES).filter(f=>f.startsWith("data/days-"))
        .forEach(f => out.push(...Object.entries(FILES[f].data)));
    } else {
      const f = FILES["data/"+col]; if(f) out = Object.entries(f.data);
    }
    filters.forEach(([fl,op,v]) => out = out.filter(([k,d]) => {
      const x = d[fl];
      return op===">=" ? x>=v : op==="<=" ? x<=v : op==="==" ? x===v : true; }));
    out.sort((a,b) => ord ? String(a[1][ord[0]]??"").localeCompare(String(b[1][ord[0]]??""))
                          : a[0].localeCompare(b[0]));
    return out;
  };
  const self = {
    path: col,
    where:(f,o,v)=>colRef(col, filters.concat([[f,o,v]]), ord),
    orderBy:(f,d)=>colRef(col, filters, [f,d||"asc"]),
    limit:()=>self,
    doc:(id)=>docRef(col+"/"+(id || ("n"+Math.random().toString(36).slice(2,8)))),
    add(d){ const id="n"+Math.random().toString(36).slice(2,8);
      return docRef(col+"/"+id).set(d).then(()=>docRef(col+"/"+id)); },
    run(){ const e=rows(); return {docs:e.map(([k,d])=>snap(k,d)), size:e.length, empty:!e.length,
      docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}}; },
    get(){ return Promise.resolve(self.run()); },
    onSnapshot(n){ const f=()=>n(self.run()); SUBS.push(f); setTimeout(f,0);
      return ()=>{ const i=SUBS.indexOf(f); if(i>=0) SUBS.splice(i,1); }; }
  };
  return self;
}

/* ---------- pasek stanu zapisu ---------- */
function status(){
  const b = document.getElementById("sync"); if(!b) return;
  b.className = "btn icon";
  if(SAVE_ERR){ b.textContent = "błąd zapisu"; b.title = SAVE_ERR; b.style.color = "var(--r)"; }
  else if(SAVING || DIRTY.size){ b.textContent = "zapisuję…"; b.title = ""; b.style.color = ""; }
  else if(PULLING){ b.textContent = "odświeżam…"; b.title=""; b.style.color=""; }
  else { b.textContent = "zapisane"; b.style.color = "var(--fg-3)";
    b.title = SAVED_AT ? "Ostatni zapis "+new Date(SAVED_AT).toLocaleTimeString("pl-PL") : ""; }
}

/* ---------- ekran ustawień ---------- */
function setupScreen(msg){
  const v = document.getElementById("view"); v.replaceChildren();
  const inTok = el("input",{type:"password",placeholder:"github_pat_…",value:GH.token||""});
  const inRepo = el("input",{type:"text",value:GH.owner+"/"+GH.repo});
  const adv = el("label",{class:"fld",hidden:true},"Repozytorium",inRepo);
  const out = el("p",{class:"note"});
  const connect = async()=>{
    const m=(inRepo.value||"").trim().split("/");
    if(m.length!==2||!m[0]||!m[1]){ out.textContent="Repozytorium w formacie uzytkownik/nazwa."; return; }
    GH.owner=m[0]; GH.repo=m[1]; GH.token=(inTok.value||"").trim();
    if(!GH.token){ out.textContent="Wklej token."; return; }
    out.textContent="Sprawdzam…";
    try{ await boot(true); }
    catch(e){ out.textContent = e.status===404
      ? "Token nie sięga tego repozytorium. Sprawdź, czy ma dostęp do „planer” i uprawnienie Contents: Read and write."
      : e.status===401 ? "Token odrzucony — sprawdź, czy skopiował się w całości."
      : "Nie udało się połączyć: "+e.message; }
  };
  inTok.addEventListener("keydown",e=>{ if(e.key==="Enter") connect(); });
  v.append(sec("Pierwsze uruchomienie",
    el("p",{class:"note"},"Planer trzyma dane w Twoim prywatnym repozytorium GitHub „planer”. "
      +"Wklej token dostępu — raz na tym urządzeniu."),
    msg ? el("p",{class:"err"},msg) : null,
    el("label",{class:"fld"},"Token GitHub",inTok),
    adv,
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:connect},"Połącz"),
      el("button",{class:"ghost",onclick:()=>{adv.hidden=!adv.hidden}},"zmień repozytorium"),
      out),
    el("p",{class:"note"},"Token zostaje tylko w tej przeglądarce. Nie wysyłaj go nikomu — także mnie w rozmowie.")));
}

/* ---------- start ---------- */
const DATA_FILES = ["data/goals.json","data/lists.json","data/weeks.json",
  "data/habits.json","data/health.json"];
async function boot(fromSetup){
  const month = S.month;
  const files = DATA_FILES.concat(["data/days-"+month+".json"]);
  for(const f of files) await pull(f);
  if(fromSetup) cfgSave();
  S.db = {doc:docRef, collection:(p)=>colRef(p)};
  S.ready = true; S.canWrite = null;
  resub(); render(); status();
}
async function pullAll(){
  if(PULLING || DIRTY.size || SAVING) return;
  PULLING = true; status();
  try{ for(const f of Object.keys(FILES)) await pull(f); fire(); }catch(e){}
  PULLING = false; status();
}
render();
(async()=>{
  if(!cfgLoad()){ S.ready = true; setupScreen(); return; }
  try{ await boot(false); }
  catch(e){ S.ready = true; setupScreen(e.status===401 ? "Token odrzucony — wpisz nowy."
    : e.status===404 ? "Nie widzę tego repozytorium." : "Brak połączenia z GitHubem."); }
})();
setInterval(pullAll, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pullAll(); });
</script>
