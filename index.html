    ta.addEventListener("change",()=>upd(t.id,{note:duza(ta.value)}));
    const paczka=el("div",{class:"taskwrap"}, r, ta);
    if(S.notatka===t.id) setTimeout(()=>ta.focus(),40);
    return paczka;
  }
  const list=el("div",{});
  const wypisz=(poz,box)=>{
    poz.filter(x=>!x.minor).forEach(x=>box.append(taskRow(x)));
    const m=poz.filter(x=>x.minor);
    if(m.length){ box.append(el("div",{class:"divider"})); m.forEach(x=>box.append(taskRow(x))); }
  };
  if(!D.tasks.length){
    list.append(el("p",{class:"note"},
      "Pusto. Najważniejsze zadanie wpisz pierwsze — kolejność jest priorytetem."));
  }else if(!GRUPY.get()){
    const box=el("div",{class:"tasks"}); wypisz(D.tasks,box); list.append(box);
  }else{
    const grupy=[];
    const wyd=D.tasks.filter(x=>x.st==="event");
    if(wyd.length) grupy.push(["Wizyty i spotkania", wyd, null]);
    Object.keys(AREAS).forEach(k=>{
      const g=D.tasks.filter(x=>x.st!=="event" && (x.area||"K")===k);
      if(g.length) grupy.push([duza((AREAS[k]||{}).n||k), g, k]);
    });
    const reszta=D.tasks.filter(x=>x.st!=="event" && !AREAS[x.area||"K"]);
    if(reszta.length) grupy.push(["Pozostałe", reszta, null]);
    grupy.forEach(([tytul,poz,k])=>{
      list.append(el("div",{class:"grupa"},
        k?areaDot(k):el("span",{class:"dot",style:"background:var(--fg-3)"}),
        el("span",{style:"flex:1 1 auto;min-width:0"},tytul),
        el("span",{class:"note"},String(poz.length))));
      const box=el("div",{class:"tasks"}); wypisz(poz,box); list.append(box);
    });
  }

  const inp=el("input",{type:"text",placeholder:"Nowe zadanie…",id:"nowezadanie"});
  let na="K";
  const addT=()=>{const v=duza(inp.value); if(!v)return;
    saveDay(d,{tasks:[...D.tasks,{id:uid(),txt:v,st:"todo",area:na,minor:false}]}); inp.value=""};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")addT()});
  const ab=el("div",{class:"row",style:"gap:3px"});
  Object.entries(AREAS).forEach(([k,v])=>ab.append(el("button",{class:"btn icon"+(na===k?" on":""),
    title:v.n+" · "+v.nr,onclick:()=>{na=k;[...ab.children].forEach(b=>b.classList.toggle("on",b.textContent===k))}},k)));
  const otwarte = D.tasks.filter(t=>!["done","canc","moved"].includes(t.st));
  const przenies = async()=>{
    if(!otwarte.length || !S.db) return;
    const jutro = addD(d,1);
    if(!confirm("Przenieść "+otwarte.length+" niezrobion"+(otwarte.length===1?"e zadanie":"ych zadań")
      +" na "+parse(jutro).getDate()+" "+MONTHS[parse(jutro).getMonth()]+"?")) return;
    let dane = {};
    try{ const s = await S.db.doc("days/"+jutro).get(); if(s.exists) dane = s.data()||{}; }catch(e){}
    const tj = Array.isArray(dane.tasks) ? dane.tasks : [];
    await S.db.doc("days/"+jutro).set({...dane,
      tasks:[...tj, ...otwarte.map(x=>({...x, id:uid(), st:"todo"}))]});
    saveDay(d,{tasks:D.tasks.map(x=>otwarte.some(o=>o.id===x.id) ? {...x, st:"moved"} : x)});
  };
  const secTasks=sec("Zadania",list,el("div",{class:"row",style:"margin-top:6px"},inp),
    el("div",{class:"row"},ab,el("span",{class:"spacer"}),el("button",{class:"btn",onclick:addT},"Dodaj")),
    el("div",{class:"row"},
      el("button",{class:"ghost",onclick:()=>{GRUPY.set(!GRUPY.get()); render();}},
        GRUPY.get() ? "pokaż jedną listą" : "podziel na sekcje"),
      otwarte.length ? el("button",{class:"ghost",onclick:przenies},
        "przenieś niezrobione na jutro (" + otwarte.length + ")") : null));

  /* oś godzin — wiersz na pół godziny, kliknięcie zakłada blok */
  const H0=0, H1=23, KW=11;            // wiersz na kwadrans
  const axis=el("div",{class:"axis"});
  const dodajOd=(hh,mm)=>{
    const kon=new Date(2000,0,1,hh,mm); kon.setMinutes(kon.getMinutes()+90);
    saveDay(d,{blocks:[...D.blocks,{id:uid(), s:pad(hh)+":"+pad(mm),
      e:pad(kon.getHours())+":"+pad(kon.getMinutes()), area:"T", txt:"", done:false}]});
  };
  /* bloki, które się zazębiają, dzielą szerokość między siebie */
  const ukladBlokow=(bl)=>{
    const naGodz=(x)=>+x.slice(0,2)+(+x.slice(3))/60;
    const poz=bl.map(b=>{
      const s=naGodz(b.s);
      return {id:b.id, s, e:Math.max(naGodz(b.e), s+0.25)};
    }).sort((a,b)=>a.s-b.s || a.e-b.e);
    const mapa={};
    let grupa=[], koniec=null;
    const zamknij=()=>{
      if(!grupa.length) return;
      const kol=[];
      grupa.forEach(x=>{
        let i=kol.findIndex(k=>k<=x.s+1e-9);
        if(i<0) i=kol.length;
        kol[i]=x.e; x.col=i;
      });
      grupa.forEach(x=>{ mapa[x.id]={col:x.col, n:kol.length}; });
      grupa=[]; koniec=null;
    };
    poz.forEach(x=>{
      if(koniec!==null && x.s >= koniec-1e-9) zamknij();
      grupa.push(x);
      koniec = (koniec===null) ? x.e : Math.max(koniec, x.e);
    });
    zamknij();
    return mapa;
  };
  /* wydarzenia z kalendarza wchodzą na oś; te poza domem zabierają też czas na drogę */
  const naOsi = [];
  calFor(d).forEach(e=>{
    if(e.allDay || !e.st || !e.en || e.st.slice(0,10)!==d) return;
    const s = naMin(e.st.slice(11,16));
    const k = e.en.slice(0,10)===d ? naMin(e.en.slice(11,16)) : 1439;
    if(k<=s) return;
    const online = ONLINE.test((e.s||"")+" "+((e.raw&&e.raw.location)||""));
    naOsi.push({id:"kal-"+e.id, s:naCzas(s), e:naCzas(k), txt:e.s, online, kal:true});
    if(online) return;
    if(s-DOJAZD >= 0)    naOsi.push({id:"dja-"+e.id, s:naCzas(s-DOJAZD), e:naCzas(s), txt:"Dojazd"});
    if(k+DOJAZD <= 1439) naOsi.push({id:"djb-"+e.id, s:naCzas(k), e:naCzas(k+DOJAZD), txt:"Powrót"});
  });
  const uklad = ukladBlokow([...D.blocks, ...naOsi]);

  /* puste godziny nocne zwijamy, ale nigdy nie chowamy bloku */
  let hOd=H0, hDo=H1;
  if(!S.osPelna){
    let od=6, doo=22;
    [...D.blocks, ...naOsi].forEach(b=>{
      const s=+b.s.slice(0,2);
      const e=+b.e.slice(0,2)+((+b.e.slice(3))>0?1:0);
      if(s<od) od=s;
      if(e>doo) doo=e;
    });
    hOd=Math.max(H0,Math.min(6,od));
    hDo=Math.min(H1,Math.max(22,doo));
  }
  const pasek=(a,b,gdzie)=>el("button",{class:"pasek",
    onclick:()=>{ S.osPelna=true; render(); }},
    pad(a)+":00–"+pad(b)+":45 · pusto, kliknij by rozwinąć");

  for(let h=hOd;h<=hDo;h++){
    for(let q=0; q<4; q++){
      const mm=q*15, pocz=h+q*0.25;
      const cell=el("div",{class:"hcell",
        title:"Kliknij, by zacząć blok o "+pad(h)+":"+pad(mm),
        onclick:()=>dodajOd(h,mm)});
      axis.append(el("div",{class:"hr"+(q===2?" pol":(q?" cwierc":""))},
        el("div",{class:"hlab"}, q ? "" : String(h)), cell));
      D.blocks.forEach(b=>{
        const s=+b.s.slice(0,2)+(+b.s.slice(3))/60, e=+b.e.slice(0,2)+(+b.e.slice(3))/60;
        if(s>=pocz && s<pocz+0.25){
          const opis=[duza(b.txt)||duza((AREAS[b.area]||AREAS.K).n), duza(b.proj)].filter(Boolean).join(" · ");
          const u = uklad[b.id] || {col:0, n:1};
          const szer = 100/u.n, lewo = u.col*szer;
          cell.append(el("div",{class:"blk"+(b.done?" done":"")+(u.n>1?" waski":""),
            title:(b.done?"Zrobione":"Kliknij, gdy zrobione")+" · "+b.s+"–"+b.e
              +(u.n>1?" · "+(u.col+1)+" z "+u.n+" równolegle":""),
            style:"top:"+((s-pocz)*4*KW)+"px;height:"
              +Math.max(16,(Math.max(.25,Math.min(e,H1+1)-s)*4*KW-2))+"px;"
              +"left:calc("+lewo+"% + 3px);width:calc("+szer+"% - 6px);right:auto;color:"
              +(AREAS[b.area]||AREAS.K).c,
            onclick:(ev)=>{ ev.stopPropagation(); }},
            el("span",{}, (b.done?"✓ ":"")+opis)));
          const kafel = cell.lastChild;
          const wybrany = (S.blokEdyt === b.id);
          if(wybrany) kafel.classList.add("wybrany");
          let chwyt = null, licznik = null;
          const koniecChwytu = ()=>{ clearTimeout(licznik); licznik=null;
            kafel.style.touchAction=""; kafel.classList.remove("ciagnie"); };
          kafel.addEventListener("contextmenu", ev=>ev.preventDefault());
          kafel.addEventListener("pointerdown",(ev)=>{
            ev.stopPropagation();
            const pole = kafel.getBoundingClientRect();
            const przyDole = (ev.clientY > pole.bottom - 10) && pole.height > 40;
            chwyt = {y0:ev.clientY, ruch:false, gotowy:false,
                     tryb: przyDole ? "koniec" : "caly",
                     s:naMin(b.s), e:naMin(b.e), id:ev.pointerId};
            if(wybrany){
              // otwarty blok przesuwa się od razu, bez przytrzymywania
              chwyt.gotowy = true;
              kafel.style.touchAction = "none";
              kafel.classList.add("ciagnie");
              try{ kafel.setPointerCapture(ev.pointerId); }catch(e){}
              return;
            }
            licznik = setTimeout(()=>{            // przytrzymanie otwiera edycję
              if(!chwyt || chwyt.ruch) return;
              licznik = null; chwyt = null; ostatnieDlugie = Date.now();
              if(navigator.vibrate) navigator.vibrate(8);
              S.blokEdyt = b.id; render();
            }, 380);
          });
          kafel.addEventListener("pointermove",(ev)=>{
            if(!chwyt) return;
            const dy = ev.clientY - chwyt.y0;
            if(!chwyt.gotowy){ if(Math.abs(dy)>5){ chwyt.ruch=true; koniecChwytu(); chwyt=null; } return; }
            ev.preventDefault();
            const krok = Math.round(dy/KW)*15;
            if(chwyt.tryb==="caly"){
              kafel.style.top = ((s-pocz)*4*KW + krok/15*KW) + "px";
            }else{
              const nowa = Math.max(16, (chwyt.e - chwyt.s + krok)/15*KW - 2);
              kafel.style.height = nowa + "px";
            }
          });
          const puszczenie=(ev)=>{
            if(!chwyt) return;
            const dy = ev.clientY - chwyt.y0;
            const bylGotowy = chwyt.gotowy;
            const krok = Math.round(dy/KW)*15;
            koniecChwytu();
            if(!bylGotowy){
              chwyt=null;
              if(Date.now()-ostatnieDlugie < 600) return;
              S.blokEdyt = (S.blokEdyt===b.id ? null : b.id); render();
              return;
            }
            const dl = chwyt.e - chwyt.s;
            let ns = chwyt.s, ne = chwyt.e;
            if(chwyt.tryb==="caly"){
              ns = Math.max(0, Math.min(1440-dl, chwyt.s + krok)); ne = ns + dl;
            }else{
              ne = Math.max(chwyt.s + 15, Math.min(1440, chwyt.e + krok));
            }
            chwyt = null;
            if(ns!==naMin(b.s) || ne!==naMin(b.e))
              saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,s:naCzas(ns),e:naCzas(ne)}:x)});
            else render();
          };
          kafel.addEventListener("pointerup",puszczenie);
          kafel.addEventListener("pointercancel",()=>{ koniecChwytu(); chwyt=null; render(); });
        }
      });
      naOsi.forEach(x=>{
        const s = naMin(x.s)/60, k = naMin(x.e)/60;
        if(!(s>=pocz && s<pocz+0.25)) return;
        const u = uklad[x.id] || {col:0, n:1};
        const szer = 100/u.n, lewo = u.col*szer;
        cell.append(el("div",{class:"blk "+(x.kal?"kal":"dojazd")+(u.n>1?" waski":""),
          title: x.kal
            ? ("Kalendarz Google · "+x.s+"–"+x.e+(x.online?" · online, bez dojazdu":" · plus "+DOJAZD+" min drogi w każdą stronę"))
            : (x.txt+" · "+x.s+"–"+x.e+" · "+DOJAZD+" minut na drogę"),
          style:"top:"+((s-pocz)*4*KW)+"px;height:"
            +Math.max(10,(Math.max(.25,Math.min(k,H1+1)-s)*4*KW-2))+"px;"
            +"left:calc("+lewo+"% + 3px);width:calc("+szer+"% - 6px);right:auto",
          onclick:(ev)=>{ ev.stopPropagation(); }},
          el("span",{}, x.kal ? duza(x.txt) : "⇢ "+x.txt)));
      });
    }
  }
  const bl=el("div",{class:"tasks",style:"margin-top:7px"});
  D.blocks.forEach(b=>{
    const t1=poleCzasu(b.s);
    const t2=poleCzasu(b.e);
    const tx=el("input",{type:"text",value:duza(b.txt||""),placeholder:"Nazwa bloku"});
    const pr=el("input",{type:"text",value:duza(b.proj||""),list:"projekty",placeholder:"projekt — np. Mollette",
      style:"width:auto;flex:1 1 150px;min-width:0"});
    const sv=()=>{
      const g = paraPor(b, t1.value, t2.value, t1.value!==b.s ? "start" : "koniec");
      t1.value=g.s; t2.value=g.e;
      saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id
        ?{...x,s:g.s,e:g.e,txt:duza(tx.value),proj:duza(pr.value)}:x)});
    };
    [t1,t2,tx,pr].forEach(i=>i.addEventListener("change",sv));
    bl.append(listaProjektow(), el("div",{class:"task blkrow"},
      el("button",{class:"mark",style:"color:"+(AREAS[b.area]||AREAS.K).c,title:"Obszar",
        onclick:()=>{const ks=Object.keys(AREAS);
          saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,area:ks[(ks.indexOf(b.area)+1)%ks.length]}:x)})}},"■"),
      t1,t2,tx,pr,
      el("button",{class:"ghost",title:b.done?"Zrobione":"Oznacz jako zrobione",
        onclick:()=>saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,done:!x.done}:x)})},
        b.done?"✓":"○"),
      el("button",{class:"ghost",title:"Usuń",onclick:()=>saveDay(d,{blocks:D.blocks.filter(x=>x.id!==b.id)})},"✕")));
  });
  const edytowany = D.blocks.find(x=>x.id===S.blokEdyt);
  const edytorBloku = ()=>{
    const b = edytowany;
    const nz=el("input",{type:"text",value:duza(b.txt||""),placeholder:"Nazwa bloku"});
    const pr=el("input",{type:"text",value:duza(b.proj||""),list:"projekty",placeholder:"Projekt"});
    const t1=poleCzasu(b.s);
    const t2=poleCzasu(b.e);
    const op=el("textarea",{rows:3,placeholder:"Opis — co dokładnie, na czym się skupić"});
    op.value=b.opis||"";
    const zap=()=>{
      const g = paraPor(b, t1.value, t2.value, t1.value!==b.s ? "start" : "koniec");
      t1.value=g.s; t2.value=g.e;
      saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id
        ?{...x, txt:duza(nz.value), proj:duza(pr.value), s:g.s, e:g.e, opis:duza(op.value)}:x)});
    };
    [nz,pr,t1,t2,op].forEach(i=>i.addEventListener("change",zap));
    const ob=el("div",{class:"row",style:"gap:3px"});
    Object.entries(AREAS).forEach(([k,v])=>ob.append(el("button",{class:"btn icon"+(b.area===k?" on":""),
      title:v.n,onclick:()=>saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,area:k}:x)})},k)));
    return el("div",{class:"sec blokedyt"},
      el("h3",{},"Blok · "+b.s+"–"+b.e),
      el("label",{class:"fld"},"Nazwa",nz),
      el("label",{class:"fld"},"Projekt",pr),
      el("div",{class:"row"},el("span",{class:"note",style:"min-width:36px"},"Czas"),t1,
        el("span",{class:"note"},"–"),t2,
        el("span",{class:"note",style:"flex:1 1 100%"},"Godzinę wpisujesz z ręki: 9, 930 albo 9:30.")),
      el("label",{class:"fld"},"Obszar",ob),
      el("label",{class:"fld"},"Opis",op),
      listaProjektow(),
      el("div",{class:"row"},
        el("button",{class:"btn"+(b.done?" on":""),onclick:()=>saveDay(d,
          {blocks:D.blocks.map(x=>x.id===b.id?{...x,done:!x.done}:x)})}, b.done?"✓ Zrobione":"Oznacz jako zrobione"),
        el("button",{class:"ghost",title:"Dopisz ten blok jako zadanie",onclick:()=>{
          saveDay(d,{tasks:[...D.tasks,{id:uid(), txt:duza(b.txt||(AREAS[b.area]||AREAS.K).n),
            st:"todo", area:b.area||"K", proj:b.proj||"", note:b.opis||"", minor:false}]});
          S.blokEdyt=null;
        }},"zrób zadanie"),
        el("button",{class:"ghost",onclick:()=>{S.blokEdyt=null;render()}},"zamknij"),
        el("button",{class:"ghost",onclick:()=>{
          if(!confirm("Usunąć blok „"+(b.txt||"")+"”?")) return;
          S.blokEdyt=null; saveDay(d,{blocks:D.blocks.filter(x=>x.id!==b.id)});
        }},"usuń")));
  };

  const osPelnaBox=el("div",{style:"display:flex;flex-direction:column"});
  if(hOd>H0) osPelnaBox.append(pasek(H0,hOd-1,"gora"));
  osPelnaBox.append(axis);
  if(hDo<H1) osPelnaBox.append(pasek(hDo+1,H1,"dol"));
  if(S.osPelna) osPelnaBox.append(el("div",{class:"row"},
    el("button",{class:"ghost",onclick:()=>{S.osPelna=false;render()}},"zwiń puste godziny")));

  const listaBlokow = el("div",{style:"display:flex;flex-direction:column;gap:6px"});
  if(D.blocks.length){
    const schowek = el("div",{hidden:true}); schowek.append(bl);
    const prz = el("button",{class:"ghost"},"▸ lista bloków");
    prz.addEventListener("click",()=>{ schowek.hidden=!schowek.hidden;
      prz.textContent = (schowek.hidden?"▸":"▾")+" lista bloków"; });
    listaBlokow.append(el("div",{class:"row"},prz), schowek);
  }
  const secBloki=sec("Bloki",osPelnaBox, edytowany ? edytorBloku() : null,
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:()=>saveDay(d,{blocks:[...D.blocks,
        {id:uid(),s:"09:00",e:"10:30",area:"T",txt:"",done:false}]})},"Dodaj blok"),
      el("button",{class:"btn",onclick:()=>saveDay(d,{blocks:[...D.blocks,
        {id:uid(),s:"20:00",e:"21:00",area:"O",txt:"Szydełko",proj:"",done:false}]})},"Szydełko")),
    listaBlokow,
    el("p",{class:"note"},"Kliknij w oś, by zacząć blok o tej godzinie. "
      +"Siatka ma podziałkę co 15 minut. Bloki, które się zazębiają, dzielą szerokość — "
      +"możesz położyć konsultację na długim bloku gabinetu. "
      +"Przycisk ▭ przy zadaniu robi z niego blok w pierwszej wolnej szparze — zadanie zostaje na liście, "
      +"więc skasowany blok nic nie zabiera. W edytorze bloku „zrób zadanie” działa w drugą stronę. "
      +"Wydarzenia z Kalendarza Google wchodzą na oś same. Jeśli w nazwie albo w miejscu "
      +"nie ma „online” (ani linku), dokładam przed i po pas "+DOJAZD+" minut na drogę. "
      +"Przytrzymaj blok, żeby go otworzyć do edycji. Otwarty blok przeciągniesz palcem: "
      +"w pionie przesuwasz, przy dolnej krawędzi zmieniasz długość. "
      +"Blok = 90–120 minut jednej rzeczy, najwyżej 2–3 dziennie."));

  /* prawa strona */
  const types=el("div",{class:"row"});
  Object.entries(DAYTYPES).forEach(([k,v])=>types.append(el("button",{class:"btn"+(D.type===k?" on":""),
    title:v.o+" Norma: "+normaTekst(k)+".",
    onclick:()=>saveDay(d,{type:D.type===k?"":k})}, v.n)));
  const secTyp=sec("Typ dnia",types);
  if(D.type && DAYTYPES[D.type]){
    const def=DAYTYPES[D.type];
    const wlasne=(D.blocks||[]).filter(b=>BLOKI_WLASNE.includes(b.area)).length;
    secTyp.append(el("p",{class:"note"},def.o+" Norma: "+normaTekst(D.type)+" twórczych lub naukowych."));
    secTyp.append(el("div",{class:"row"},
      el("span",{class:"note"},"Zaplanowane: "),
      el("b",{style:"font-weight:600"},String(wlasne))));
    if(wlasne > def.max) secTyp.append(el("p",{class:"err"},
      "Masz "+wlasne+" bloków przy dniu typu "+def.n+". Norma to "+normaTekst(D.type)
      +" — zobacz, co da się przenieść."));
  }else{
    secTyp.append(el("p",{class:"note"},"Wybierz, ile dziś wchodzi Twojego czasu. "
      +"Typ nie opisuje, co robisz — od tego są obszary i kalendarz."));
  }

  const secSzab=sec("Szablony dnia");
  if(!SZABLONY.length) secSzab.append(el("p",{class:"note"},
    "Brak szablonów. Ułóż typowy dzień i zapisz go — potem wstawisz jednym kliknięciem."));
  const rzSz=el("div",{class:"row"});
  SZABLONY.forEach((sz,i)=>rzSz.append(el("button",{class:"btn",
    title:"Wstaw do tego dnia: "+((sz.tasks||[]).length)+" zadań, "+((sz.blocks||[]).length)+" bloków",
    onclick:()=>{
      if(!confirm("Wstawić szablon „"+sz.nazwa+"” do tego dnia? Dotychczasowe wpisy zostaną.")) return;
      saveDay(d,{
        type: sz.typ || D.type,
        tasks:[...D.tasks, ...(sz.tasks||[]).map(x=>({id:uid(), txt:duza(x.txt), st:"todo",
          area:x.area||"K", minor:!!x.minor}))],
        blocks:[...D.blocks, ...(sz.blocks||[]).map(x=>({id:uid(), s:x.s, e:x.e,
          area:x.area||"T", txt:duza(x.txt||""), proj:"", done:false}))]});
    }}, sz.nazwa)));
  SZABLONY.forEach((sz,i)=>{
    const nm=el("input",{type:"text",value:sz.nazwa||"",
      style:"width:auto;flex:1 1 140px;min-width:0"});
    nm.addEventListener("change",()=>{SZABLONY[i].nazwa=duza(nm.value); cfgZapisz(); render();});
    secSzab.append(el("div",{class:"row"},nm,
      el("span",{class:"note"},((sz.tasks||[]).length)+" zad. · "+((sz.blocks||[]).length)+" bl."),
      el("button",{class:"ghost",title:"Usuń szablon",onclick:()=>{
        if(!confirm("Usunąć szablon „"+sz.nazwa+"”?")) return;
        SZABLONY.splice(i,1); cfgZapisz(); render();
      }},"✕")));
  });
  secSzab.append(rzSz, el("div",{class:"row"},
    el("button",{class:"ghost",onclick:()=>{
      const nazwa=prompt("Nazwa szablonu (np. Dzień gabinetowy, Dzień N):","");
      if(!nazwa) return;
      SZABLONY.push({nazwa:duza(nazwa), typ:D.type||"",
        tasks:D.tasks.filter(x=>!x.kotwica).map(x=>({txt:x.txt, area:x.area, minor:!!x.minor})),
        blocks:D.blocks.map(x=>({s:x.s, e:x.e, area:x.area, txt:x.txt||""}))});
      cfgZapisz(); render();
    }},"zapisz ten dzień jako szablon")));
  const secMust=sec("Musi się udać",
    textRow(duza(D.must),"Jedna rzecz, po której dzień jest udany",v=>saveDay(d,{must:duza(v)})));

  const ce=calFor(d), showCal=S.cal.on||S.cal.err, secCal=sec("Kalendarz Google");
  calNote(secCal);
  if(!S.cal.err){
    if(!ce.length) secCal.append(el("p",{class:"note"},S.cal.on?"Brak wpisów na ten dzień.":"Wczytywanie…"));
    else ce.forEach(e=>secCal.append(calRow(e,d)));
    if(S.cal.on){
      if(calEdit && calEdit.date===d) calForm(secCal,d);
      else secCal.append(el("div",{class:"row"},el("button",{class:"ghost",onclick:async()=>{
        if(!await calEnsure()) return;
        calEdit={date:d,sd:d,ed:d,st:"09:00",et:"10:00",notify:true};
        S.cal.msg=null; render(); }},"+ dodaj wydarzenie")));
    }
  }
  if(S.cal.msg) secCal.append(el("p",{class:"note"},S.cal.msg));

  const mo=parse(d), ink=inkNaDzien(d);
  const haslaKrotko = [...new Set(ink.map(x=>x.slowo))].join(" · ");
  const ta=el("textarea",{rows:9,class:"grow",style:"font-family:var(--disp);color:var(--dziennik);font-size:15px",
    placeholder: ink.length ? ("Inktober: "+haslaKrotko) : "Co z dziś zostaje?"});
  ta.value=D.journal||"";
  ta.addEventListener("change",()=>saveDay(d,{journal:duza(ta.value)}));
  const secDz=sec(ink.length ? ("Dziennik · "+mo.getDate()+" "+haslaKrotko) : "Dziennik", ta);
  if(ink.length) secDz.append(el("div",{class:"row",style:"gap:14px"},
    ...ink.map(x=>el("span",{class:"row",style:"gap:5px"},
      el("span",{class:"chip"},x.h), el("b",{style:"font-weight:600"},x.slowo)))));

  /* --- liczniki czasu --- */
  const liczniki = {...(D.liczniki||{})};
  if(!Object.keys(liczniki).length) liczniki["Szydełko"] = {od:null, suma:0};
  const secLicz = sec("Licznik");
  const biegnie = Object.values(liczniki).some(x=>x && x.od);
  Object.keys(liczniki).forEach(nazwa=>{
    const x = liczniki[nazwa] || {od:null, suma:0};
    const idzie = !!x.od;
    const przelacz = ()=>{
      const n = {...(D.liczniki||{})};
      if(idzie){ n[nazwa] = {od:null, suma:ileSekund(x)}; }
      else { Object.keys(n).forEach(k=>{ if(n[k] && n[k].od) n[k] = {od:null, suma:ileSekund(n[k])}; });
             n[nazwa] = {od:Date.now(), suma:(x.suma||0)}; }
      saveDay(d, {liczniki:n});
    };
    const czasEl = (S.licznikEdyt === nazwa)
      ? (()=>{ const i=el("input",{type:"number",min:"0",step:"5",
            value:String(Math.round(ileSekund(x)/60)),
            style:"width:76px;flex:0 0 76px;text-align:right"});
          const zapisz=()=>{
            const m = Math.max(0, parseInt(i.value,10) || 0);
            const n = {...(D.liczniki||{})};
            n[nazwa] = {od: idzie ? Date.now() : null, suma: m*60};
            S.licznikEdyt = null; saveDay(d,{liczniki:n});
          };
          i.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); zapisz(); } });
          i.addEventListener("blur", zapisz);
          setTimeout(()=>{ i.focus(); i.select(); },40);
          return i; })()
      : el("button",{class:"ghost",title:"Kliknij, by poprawić czas",
          style:"font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:13px",
          onclick:()=>{ S.licznikEdyt = nazwa; render(); }}, czasSlownie(ileSekund(x)));
    secLicz.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:8px"},
      el("span",{style:"flex:1 1 auto;min-width:0"+(idzie?";font-weight:600":"")}, nazwa),
      czasEl,
      el("button",{class:"btn"+(idzie?" on":""),onclick:przelacz}, idzie ? "Stop" : "Start"),
      el("button",{class:"ghost",title:"Usuń licznik",onclick:()=>{
        if(!confirm("Usunąć licznik „"+nazwa+"” z tego dnia?")) return;
        const n={...(D.liczniki||{})}; delete n[nazwa]; saveDay(d,{liczniki:n});
      }},"✕")));
  });
  const nowyL = el("input",{type:"text",placeholder:"Nowa czynność do mierzenia",
    list:"projekty",style:"width:auto;flex:1 1 150px;min-width:0"});
  const dodajL = ()=>{ const v=duza(nowyL.value); if(!v) return;
    saveDay(d,{liczniki:{...(D.liczniki||{}), [v]:{od:null, suma:0}}}); };
  nowyL.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); dodajL(); } });
  secLicz.append(el("div",{class:"row"}, nowyL,
    el("button",{class:"btn",onclick:dodajL},"Dodaj"), listaProjektow()));
  secLicz.append(el("p",{class:"note"},
    "Do rzeczy robionych przy okazji, nie blokiem. Start zatrzymuje inne liczniki tego dnia. "
    +"Czas liczy się też przy zamkniętym planerze. Kliknij w czas, żeby go poprawić — "
    +"wpisujesz minuty."));
  clearInterval(tykanie); tykanie = null;
  if(biegnie) tykanie = setInterval(()=>{ if(S.view==="dzis") render(); }, 30000);

  /* --- szybki wpis --- */
  const szPole=el("input",{type:"text",placeholder:"np. jutro 9:00-11:00 Gabinet #G"});
  const szPodg=el("p",{class:"note"});
  const odswiezPodg=()=>{
    const r=parsujWpis(szPole.value);
    if(!r.txt){ szPodg.textContent=
      "„Pranie ciemne” → zadanie · „12:30 Psychoterapia” → wydarzenie · "
      +"„jutro 9:00-11:00 Gabinet” → blok. Dzień: dziś / jutro / pon / 5.10 (kropka). "
      +"Godzina z dwukropkiem. Obszar: litera na początku, np. G - … albo #G. "
      +"Średnik rozdziela kilka zadań, kropka środkowa oddziela projekt: Szydełko · Mollette. "
      +"Jeśli treść zaczyna się od litery obszaru, napisz ją dwa razy: K K mamą."; return; }
    const kt=rodzajWpisu(r), dd=parse(r.data);
    const ile = (kt==="zadanie" && r.czesci.length>1) ? (" ×"+r.czesci.length) : "";
    szPodg.textContent = {zadanie:"Zadanie", blok:"Blok", wydarzenie:"Wydarzenie w kalendarzu"}[kt] + ile
      + " · " + dd.getDate() + " " + MONTHS[dd.getMonth()]
      + (r.od ? " · " + r.od + (r.doo ? "–"+r.doo : "") : "")
      + (r.obszar ? " · " + (AREAS[r.obszar]||AREAS.K).n : "")
      + " · " + r.pary.map(x=>x.txt + (x.proj ? " · "+x.proj : "")).join(" + ");
  };
  szPole.addEventListener("input",odswiezPodg);
  const szWyslij=async()=>{
    const r=parsujWpis(szPole.value); if(!r.txt) return;
    const kt=rodzajWpisu(r), ob=r.obszar||"K";
    if(kt==="zadanie"){
      const nowe = r.pary.map(x=>({id:uid(), txt:x.txt, proj:x.proj, st:"todo", area:ob, minor:false}));
      if(r.data===d) saveDay(d,{tasks:[...D.tasks, ...nowe]});
      else for(const z of nowe) await dopiszZadanie(r.data, z);
    }else if(kt==="blok"){
      const nowy={id:uid(),s:r.od,e:r.doo,area:ob,txt:r.txt,done:false};
      if(r.data===d) saveDay(d,{blocks:[...D.blocks,nowy]});
      else{
        let dane={}; try{ const sn=await S.db.doc("days/"+r.data).get(); if(sn.exists) dane=sn.data()||{}; }catch(e){}
        const bl=Array.isArray(dane.blocks)?dane.blocks:[];
        await S.db.doc("days/"+r.data).set({...dane,blocks:[...bl,nowy]});
      }
    }else{
      if(typeof calSave==="function"){
        const kon=new Date(2000,0,1,+r.od.slice(0,2),+r.od.slice(3)); kon.setMinutes(kon.getMinutes()+60);
        await calSave({date:r.data, title:r.txt, allDay:false, sd:r.data, ed:r.data,
          st:r.od, et:pad(kon.getHours())+":"+pad(kon.getMinutes()), guests:"", loc:"", desc:"", notify:false});
      }else{
        await dopiszZadanie(r.data,{id:uid(),txt:r.od+" "+r.txt,st:"event",area:ob,minor:false});
      }
    }
    szPole.value=""; odswiezPodg(); render();
  };
  szPole.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); szWyslij(); } });
  odswiezPodg();
  const secSzyb=sec("Szybki wpis", szPole,
    el("div",{class:"row"}, el("button",{class:"btn",onclick:szWyslij},"Dodaj"), szPodg));

  /* --- terminy --- */
  const dzisiaj=key(new Date());
  const term=(TERMINY||[]).filter(x=>x.d && x.d>=dzisiaj)
    .sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);
  const secTerm=sec("Terminy");
  if(!term.length) secTerm.append(el("p",{class:"note"},
    "Brak terminów. Dodasz je w Ustawieniach — testy, płatności, zjazdy."));
  term.forEach(x=>{
    const ile=Math.round((parse(x.d)-parse(dzisiaj))/86400000);
    const pilne=ile<=3;
    secTerm.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:7px"},
      el("span",{style:"flex:1 1 auto;min-width:0"},x.txt),
      el("b",{style:"flex:0 0 auto;font-weight:600;color:"+(pilne?"var(--r)":"var(--fg-2)")},
        ile===0?"dziś":(ile===1?"jutro":("za "+ile+" dni")))));
  });
  const termEdyt=el("div",{hidden:true,style:"display:flex;flex-direction:column;gap:8px"});
  edytorTerminow(termEdyt);
  secTerm.append(el("div",{class:"row"},
    el("button",{class:"ghost",onclick:()=>{termEdyt.hidden=!termEdyt.hidden}},"edytuj terminy")),
    termEdyt);

  /* --- podróże --- */
  const wyj = podrozNa(d);
  const secWyj = sec("Podróże");
  if(wyj) secWyj.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:7px"},
    el("span",{class:"mark",style:"color:"+((AREAS[wyj.p.area]||AREAS.K).c)},"■"),
    el("span",{style:"flex:1 1 auto;min-width:0;font-weight:600"}, duza(wyj.p.txt||"Podróż")),
    el("b",{style:"flex:0 0 auto;font-weight:600"}, "dzień "+wyj.nr+" z "+wyj.ile)));
  const naj = (PODROZE||[]).filter(x=>x.od && x.od>dzisiaj)
    .sort((a,b)=>a.od.localeCompare(b.od)).slice(0,3);
  naj.forEach(x=>{
    const ile = Math.round((parse(x.od)-parse(dzisiaj))/86400000);
    secWyj.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:7px"},
      el("span",{class:"mark",style:"color:"+((AREAS[x.area]||AREAS.K).c)},"■"),
      el("span",{style:"flex:1 1 auto;min-width:0"}, duza(x.txt||"Podróż")),
      el("b",{style:"flex:0 0 auto;font-weight:600;color:var(--fg-2)"},
        ile===1 ? "jutro" : ("za "+ile+" dni"))));
  });
  if(!wyj && !naj.length) secWyj.append(el("p",{class:"note"},
    "Brak zaplanowanych podróży. Zaznaczona podróż barwi dni w widoku miesiąca."));
  const wyjEdyt=el("div",{hidden:true,style:"display:flex;flex-direction:column;gap:8px"});
  edytorPodrozy(wyjEdyt);
  secWyj.append(el("div",{class:"row"},
    el("button",{class:"ghost",onclick:()=>{wyjEdyt.hidden=!wyjEdyt.hidden}},"edytuj podróże")),
    wyjEdyt);

  const secKotw=sec("Kotwice");
  secKotw.append(el("p",{class:"note"},
    "Zadania, które dopisują się same w wybrane dni tygodnia."));
  edytorKotwic(secKotw);

  const mk=miniKalendarz(d);
  const prawa = showCal ? [mk,secMust,secTyp,secSzab,secTerm,secWyj,secKotw,secCal]
                       : [mk,secMust,secTyp,secSzab,secTerm,secWyj,secKotw];
  return {L:[secSzyb,secTasks,secBloki,secLicz,secDz], R:prawa};
}

/* ---------- Tydzień ---------- */
function vTydzien(){
  const mon=monday(S.date), w=isoWeek(S.date), W=weekDoc(w);
  const days=[...Array(7)].map((_,i)=>addD(mon,i));

  const dl=sec("Dni");
  days.forEach(ds=>{
    const dd=S.mdays[ds]||S.day[ds]||{};
    const tasks=dd.tasks||[], done=tasks.filter(t=>t.st==="done").length;
    const ev=calFor(ds).slice(0,2).map(e=>(e.t?e.t+" ":"")+e.s).join(" · ");
    dl.append(el("button",{class:"task",style:"width:100%;text-align:left",
      onclick:()=>{S.date=ds;S.view="dzis";S.month=ds.slice(0,7);resub();render()}},
      el("span",{style:"width:56px;flex:0 0 56px;color:var(--ink-2)"},DOW[dowIdx(ds)]+" "+parse(ds).getDate()),
      dd.type?el("span",{class:"chip",style:"flex:0 0 auto"},dd.type):el("span",{style:"width:20px;flex:0 0 20px"}),
      el("span",{class:"ttxt",style:"color:var(--ink-2)"},duza(dd.must||ev||"—")),
      el("span",{style:"color:var(--ink-3);font-variant-numeric:tabular-nums"},tasks.length?done+"/"+tasks.length:"")));
  });

  /* --- lista zadań całego tygodnia, metoda Alastaira --- */
  const pula = Array.isArray(W.pula) ? W.pula : [];
  const wiersze = [];
  pula.forEach(z=>wiersze.push({t:z, gdzie:"pula"}));
  days.forEach(ds=>(dayAny(ds).tasks||[]).forEach(z=>wiersze.push({t:z, gdzie:ds})));

  const przypisz = (z, zrodlo, cel)=>{
    if(zrodlo === cel) return;
    const hist = [...(z.hist||[])];
    if(zrodlo !== "pula" && !hist.includes(zrodlo)) hist.push(zrodlo);
    const nowy = {...z, hist};
    if(zrodlo === "pula") saveWeek(w,{pula: (weekDoc(w).pula||[]).filter(x=>x.id!==z.id)});
    else saveDayAny(zrodlo, {tasks:(dayAny(zrodlo).tasks||[]).filter(x=>x.id!==z.id)});
    if(cel === "pula") saveWeek(w,{pula:[...(weekDoc(w).pula||[]).filter(x=>x.id!==z.id), nowy]});
    else saveDayAny(cel, {tasks:[...(dayAny(cel).tasks||[]), nowy]});
  };
  const zmien = (z, gdzie, p)=>{
    if(gdzie === "pula")
      saveWeek(w,{pula:(weekDoc(w).pula||[]).map(x=>x.id===z.id?{...x,...p}:x)});
    else saveDayAny(gdzie, {tasks:(dayAny(gdzie).tasks||[]).map(x=>x.id===z.id?{...x,...p}:x)});
  };
  const usun = (z, gdzie)=>{
    if(gdzie === "pula") saveWeek(w,{pula:(weekDoc(w).pula||[]).filter(x=>x.id!==z.id)});
    else saveDayAny(gdzie, {tasks:(dayAny(gdzie).tasks||[]).filter(x=>x.id!==z.id)});
  };

  const secAla = sec("Zadania tygodnia");
  const tbA = el("table",{class:"tb ala"});
  const hrA = el("tr",{},el("th",{class:"lft"},"zadanie"));
  days.forEach(ds=>{
    const ile = (dayAny(ds).tasks||[]).filter(x=>x.st!=="done").length;
    hrA.append(el("th",{title:DOW[dowIdx(ds)]+" "+parse(ds).getDate()+" — "+ile+" otwartych"},
      DOW[dowIdx(ds)], el("div",{class:"alad"}, String(parse(ds).getDate()))));
  });
  hrA.append(el("th",{style:"width:26px"},""), el("th",{style:"width:26px"},""));
  tbA.append(el("thead",{},hrA));
  const tbA2 = el("tbody");
  if(!wiersze.length) tbA2.append(el("tr",{},el("td",{class:"lft",colspan:"10"},
    el("span",{class:"note"},"Pusto. Dopisz zadanie — wyląduje w puli, bez dnia."))));
  wiersze.forEach(({t:z, gdzie})=>{
    const ob = AREAS[z.area] || AREAS.K;
    const lewa = el("td",{class:"lft"},
      el("button",{class:"mark",style:"color:"+ob.c,title:"Obszar: "+ob.n,
        onclick:()=>{ const ks=Object.keys(AREAS);
          zmien(z, gdzie, {area:ks[(ks.indexOf(z.area||"K")+1)%ks.length]}); }}, "■"),
      el("button",{class:"ttxt",style:"text-align:left"+(z.st==="done"?";opacity:.5;text-decoration:line-through":""),
        title:"Kliknij, by poprawić treść",
        onclick:(ev)=>{
          const sp=ev.currentTarget;
          const i=el("input",{type:"text",value:duza(z.txt)});
          i.addEventListener("blur",()=>zmien(z,gdzie,{txt:duza(i.value)||z.txt}));
          i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();i.blur()}});
          sp.replaceWith(i); i.focus(); i.select();
        }}, duza(z.txt)+(z.proj?" · "+duza(z.proj):"")));
    const tr = el("tr",{}, lewa);
    days.forEach(ds=>{
      const tu = (gdzie === ds);
      const bylo = (z.hist||[]).includes(ds);
      const znak = tu ? (STMARK[z.st]||"•") : (bylo ? ">" : "·");
      const kom = el("button",{class:"ala"+(tu?" jest":"")+(bylo&&!tu?" byl":""),
        style: tu ? "color:"+ob.c : "",
        title: tu ? (duza(z.txt)+" — "+(STNAME[z.st]||"zadanie")+", kliknij: zrobione; przytrzymaj: do puli")
                  : (bylo ? "Było zaplanowane na ten dzień — przeniesione" : "Przypisz na ten dzień"),
        onclick:()=>{
          if(Date.now()-ostatnieDlugie < 600) return;
          if(tu) zmien(z, gdzie, {st: z.st==="done" ? "todo" : "done"});
          else przypisz(z, gdzie, ds);
        }}, znak);
      if(tu) przytrzymanie(kom, ()=>przypisz(z, gdzie, "pula"));
      tr.append(el("td",{},kom));
    });
    const maNote = (weekDoc(w).notatki||[]).some(n=>n.zad===z.id);
    tr.append(el("td",{},el("button",{class:"ala"+(maNote?" jest":""),
      title: maNote ? "Ma rozpisaną notatkę — otwórz niżej" : "Rozpisz to zadanie w notatkach",
      onclick:()=>{
        const lista = weekDoc(w).notatki||[];
        const jest = lista.find(n=>n.zad===z.id);
        if(jest){ S.nota = jest.id; render(); return; }
        const nowa = {id:uid(), zad:z.id, tytul:duza(z.txt), tresc:"", area:z.area||"K"};
        S.nota = nowa.id;
        saveWeek(w,{notatki:[...lista, nowa]});
      }}, maNote ? "≡" : "+≡")));
    tr.append(el("td",{},el("button",{class:"ala",title:"Usuń zadanie",
      onclick:()=>{ if(confirm("Usunąć „"+duza(z.txt)+"”?")) usun(z, gdzie); }},"✕")));
    tbA2.append(tr);
  });
  tbA.append(tbA2);
  secAla.append(el("div",{class:"scrollx"}, tbA));
  const noweA = el("input",{type:"text",placeholder:"Nowe zadanie tygodnia…"});
  let obA = "K";
  const dodajA = ()=>{
    const v = duza(noweA.value); if(!v) return;

    tre.addEventListener("change",()=>zap({tresc:tre.value}));

  secNot.append(el("div",{class:"row"},
    el("button",{class:"btn",onclick:()=>{
      saveWeek(w,{notatki:[...(weekDoc(w).notatki||[]), {id:uid(), tytul:"Nowa notatka", tresc:"", area:"K"}]});
    }},"Dodaj notatkę")));
  secNot.append(el("p",{class:"note"},
    "Notatki zostają przy tygodniu, więc w niedzielę widać je razem z przeglądem. "
    +"Zadanie, które ma notatkę, pokazuje ≡ w liście wyżej."));

  const grupyDomu = [];
  HOME.forEach(h=>{ const g=h[2]||"Dom"; if(!grupyDomu.includes(g)) grupyDomu.push(g); });
  const sekcjeDomu = grupyDomu.map(grupa=>{
  const hw=sec(grupa);
  const tb=el("table",{class:"tb dom"});
  const hr=el("tr",{},el("th",{class:"lft"},""));
  days.forEach(ds=>hr.append(el("th",{},DOW[dowIdx(ds)])));
  tb.append(el("thead",{},hr));
  const tbody=el("tbody");
  HOME.filter(h=>(h[2]||"Dom")===grupa).forEach(([k,label])=>{
    const tr=el("tr",{},el("td",{class:"lft"},duza(label)));
    days.forEach(ds=>{
      const cur=(W.home[ds]||{})[k];

                 : (cur===1 ? "zrobione" : "wersja skrócona");
      tr.append(el("td",{},el("button",{class:klasa,
        title:label+" · "+DOW[dowIdx(ds)]+" — "+opis,
        onclick:()=>{
        const nx = (cur===1?2:(cur===2?null:1));
        const h={...W.home,[ds]:{...(W.home[ds]||{})}};

  days.forEach(ds=>{ const D2=S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};

  REVIEW.forEach((qn,i)=>{

  const q=sec("Kratki bloków");

      boxes));
  });
  q.append(el("p",{class:"note"},"Górna granica, nie norma. Bez zjazdu: e-book 3 · szkolenie 2 · studia 1 · drobnice 2."));

  /* --- do przepisania do B6 --- */
  const pp=sec("Do przepisania");
  const tekstDnia=(ds)=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    const ta=(D.tasks||[]), bl=(D.blocks||[]);
    if(!ta.length && !bl.length && !D.must && !D.journal) return null;
    const dd=parse(ds);
    const linie=[DOW[dowIdx(ds)]+" "+dd.getDate()+"."+pad(dd.getMonth()+1)
      + (D.type ? " · "+D.type : "")];

    ta.forEach(x=>linie.push((STMARK[x.st]||"•")+" "+duza(x.txt)
      + (x.note ? "  ("+x.note.replace(/\s+/g," ")+")" : "")));
    bl.forEach(x=>linie.push("□ "+x.s+"–"+x.e+" "+duza(x.txt||"")
      + (x.proj?" · "+x.proj:"") + (x.done?" ✓":"")));
    if(D.journal) linie.push("~ "+D.journal.replace(/\s+/g," "));
    return linie.join("\n");
  };
  const doPrzep = days.filter(ds=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    return !D.przepisane && tekstDnia(ds);
  });
  if(!doPrzep.length) pp.append(el("p",{class:"note"},
    "Wszystko z tego tygodnia jest przepisane. Nowe wpisy pojawią się tutaj same."));
  doPrzep.forEach(ds=>{

        }},"kopiuj"),

          let dane={}; try{ const s=await S.db.doc("days/"+ds).get(); if(s.exists) dane=s.data()||{}; }catch(e){}
          await S.db.doc("days/"+ds).set({...dane, przepisane:true});
        }},"przepisane ✓"))));
  });
  if(doPrzep.length) pp.append(el("div",{class:"row"},
    el("button",{class:"btn",onclick:async()=>{
      const caly=doPrzep.map(tekstDnia).join("\n\n");
      try{ await navigator.clipboard.writeText(caly); }catch(e){}
    }},"Kopiuj cały tydzień")));
  pp.append(el("p",{class:"note"},
    "Dzień znika z listy, gdy oznaczysz go jako przepisany. Zmiana w dniówce go nie przywraca."));

  return {L:[dl,secAla,secNot,...sekcjeDomu,pp,rv], R:[miniKalendarz(S.date),eks,sekcjaCoDziala(days,"Co działało w tym tygodniu"),t3,q]};
}

/* ---------- Miesiąc ---------- */
function vMiesiac(){
  const [y,m]=S.month.split("-").map(Number);
  const first=new Date(y,m-1,1), start=addD(key(first),-((first.getDay()+6)%7));
  const g=el("div",{class:"mg"});
  DOW.forEach(d=>g.append(el("div",{class:"dow"},d)));
  const today=key(new Date());
  for(let i=0;i<42;i++){
    const ds=addD(start,i), dt=parse(ds), out=dt.getMonth()!==m-1;
    if(i>=35&&out) break;
    const dd=S.mdays[ds]||{};
    const wyj=podrozNa(ds);
    const c=el("button",{class:"mcell"+(out?" out":"")+(ds===today?" today":"")+(wyj?" wyjazd":""),
      style: wyj ? "--wyj:"+((AREAS[wyj.p.area]||AREAS.K).c) : "",
      title: wyj ? (duza(wyj.p.txt||"Podróż")+" — dzień "+wyj.nr+" z "+wyj.ile) : "",
      onclick:()=>{S.date=ds;S.view="dzis";S.month=ds.slice(0,7);resub();render()}});
    c.append(el("div",{class:"dn"},String(dt.getDate()),dd.type?el("span",{class:"chip"},dd.type):null));
    if(wyj && (wyj.nr===1 || dowIdx(ds)===0 || dt.getDate()===1))
      c.append(el("div",{class:"ev wyjnap",style:"color:"+((AREAS[wyj.p.area]||AREAS.K).c)},
        "✈ "+duza(wyj.p.txt||"Podróż")));
    calFor(ds).slice(0,3).forEach(e=>c.append(el("div",{class:"ev",style:"color:var(--ink-2)"},
      (e.t?e.t+" ":"")+e.s)));
    if(dd.must) c.append(el("div",{class:"ev",style:"color:var(--t)"},duza(dd.must)));
    g.append(c);
  }
  const s=sec(MONTHN[m-1]+" "+y,g);
  calNote(s);
  s.append(el("p",{class:"note"},"Terminy pochodzą z Kalendarza Google. Typ dnia i „musi się udać” — z dniówek."));

  const sp = sec("Podróże");
  const wMies = (PODROZE||[]).filter(x=>x.od && x.do
    && x.od.slice(0,7) <= S.month && x.do.slice(0,7) >= S.month)
    .sort((a,b)=>a.od.localeCompare(b.od));
  if(!wMies.length) sp.append(el("p",{class:"note"},
    "W tym miesiącu nic. Dni podróży barwią się paskiem w kolorze obszaru."));
  wMies.forEach(x=>{
    const ile = Math.round((parse(x.do)-parse(x.od))/86400000)+1;
    const od = parse(x.od), doo = parse(x.do);
    const mn = i => (MONTHN[i]||"").toLowerCase();
    const zakres = od.getDate()+(od.getMonth()===doo.getMonth()
      ? "–"+doo.getDate()+" "+mn(doo.getMonth())
      : " "+mn(od.getMonth())+" – "+doo.getDate()+" "+mn(doo.getMonth()));
    sp.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:7px"},
      el("span",{class:"mark",style:"color:"+((AREAS[x.area]||AREAS.K).c)},"■"),
      el("span",{style:"flex:1 1 auto;min-width:0"}, duza(x.txt||"Podróż")),
      el("span",{class:"note",style:"flex:0 0 auto"}, zakres),
      el("b",{style:"flex:0 0 auto;font-weight:600"}, ile+" dni")));
  });
  edytorPodrozy(sp);
  return {W:[s,sp]};
}

/* pierwsza wolna szpara w dniu, domyślnie 90 minut; omija istniejące bloki */
function wolnySlot(blocks, dlug){
  const dl = dlug || 90;
  const zajete = (blocks||[]).map(b=>[naMin(b.s), naMin(b.e)]).sort((a,b)=>a[0]-b[0]);
  const teraz = new Date();
  const dzisiaj = key(teraz);
  let start = 8*60;
  if(S.date === dzisiaj){                       // dziś zaczynamy od najbliższego kwadransa
    const m = teraz.getHours()*60 + teraz.getMinutes();
    start = Math.max(start, Math.ceil(m/15)*15);
  }
  for(let p = start; p + dl <= 22*60; p += 15){
    const kolizja = zajete.some(([a,b]) => p < b && a < p+dl);
    if(!kolizja) return {s:naCzas(p), e:naCzas(p+dl)};
  }
  return {s:naCzas(20*60), e:naCzas(20*60+dl)};
}
/* podróż obejmująca dany dzień: {p, nr, ile} albo null */
function podrozNa(ds){
  const p = (PODROZE||[]).find(x=>x.od && x.do && ds>=x.od && ds<=x.do);
  if(!p) return null;
  const ile = Math.round((parse(p.do)-parse(p.od))/86400000) + 1;
  const nr  = Math.round((parse(ds)-parse(p.od))/86400000) + 1;
  return {p, nr, ile};
}

function kiedys(ts){
  if(!ts) return null;
  const m = Math.round((Date.now()-ts)/60000);
  const g = new Date(ts).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
  const opis = m < 1 ? "przed chwilą" : m < 60 ? (m+" min temu")
             : m < 1440 ? (Math.round(m/60)+" godz. temu") : (Math.round(m/1440)+" dni temu");
  const dzien = new Date(ts).toDateString() === new Date().toDateString()
    ? "" : (new Date(ts).toLocaleDateString("pl-PL",{day:"numeric",month:"long"})+", ");
  return dzien + g + " · " + opis;
}

/* ---------- przeniesienie na drugie urzadzenie ---------- */
const b64u  = a => toB(a).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
const odB64u = s => { s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "="; return frB(s); };
async function kluczZKodu(kod, salt){
  const km = await crypto.subtle.importKey("raw", ENC.encode(kod), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function transferUtworz(){
  const kod  = String(Math.floor(100000 + Math.random()*900000));
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const dane = JSON.stringify({t:GH.token, o:GH.owner, r:GH.repo, g:GH.gcal,
                               wazne:Date.now() + 15*60000});
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv},
               await kluczZKodu(kod, salt), ENC.encode(dane));
  const pak = [b64u(salt), b64u(iv), b64u(ct)].join(".");
  return {kod, url: location.origin + location.pathname + "#p=" + pak};
}
async function transferOtworz(pak, kod){
  const [s,i,c] = pak.split(".");
  if(!s || !i || !c) throw new Error("zly kod");
  const jawne = DEC.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:odB64u(i)},
    await kluczZKodu(kod, odB64u(s)), odB64u(c)));
  const o = JSON.parse(jawne);
  if(!o.t || !o.wazne || o.wazne < Date.now()) throw new Error("przeterminowane");
  return o;
}
function qrRysuj(box, tekst){
  const rysuj = ()=>{
    try{
      const q = qrcode(0, "L"); q.addData(tekst); q.make();
      box.innerHTML = q.createSvgTag({cellSize:6, margin:3, scalable:true});
      const svg = box.querySelector("svg");
      if(svg){ svg.setAttribute("width","260"); svg.setAttribute("height","260");
               svg.style.width="260px"; svg.style.height="260px"; }
    }catch(e){ box.textContent = "Nie udało się narysować kodu."; }
  };
  if(window.qrcode) return rysuj();
  const s = document.createElement("script");
  s.src = "qrcode.js";
  s.onload = rysuj;
  s.onerror = ()=>{ box.textContent = "Nie udało się wczytać rysownika kodów."; };
  document.head.append(s);
}

function jsqrWczytaj(){
  return new Promise((ok,no)=>{
    if(window.jsQR) return ok();
    const s = document.createElement("script");
    s.src = "jsqr.js";
    s.onload = ()=>ok(); s.onerror = ()=>no(new Error("brak biblioteki"));

function skanujScreen(){
  const v = document.getElementById("view"); v.replaceChildren();
  const info = el("p",{class:"note",style:"text-align:center"},
    "Skieruj aparat na kod pokazany na komputerze.");
  const video = el("video",{playsinline:"",muted:"",autoplay:"",
    style:"width:100%;max-width:330px;border-radius:12px;background:#000;display:block;margin:0 auto"});
  video.muted = true; video.playsInline = true;
  const plotno = document.createElement("canvas");
  let strumien = null, dziala = true;
  const stop = ()=>{ dziala = false;
    if(strumien){ try{ strumien.getTracks().forEach(t=>t.stop()); }catch(e){} strumien = null; } };
  const klatka = ()=>{
    if(!dziala) return;
    try{
      if(video.readyState >= 2 && video.videoWidth && window.jsQR){
        plotno.width = video.videoWidth; plotno.height = video.videoHeight;
        const ctx = plotno.getContext("2d", {willReadFrequently:true});
        ctx.drawImage(video, 0, 0, plotno.width, plotno.height);
        const obraz = ctx.getImageData(0, 0, plotno.width, plotno.height);
        const znalezione = jsQR(obraz.data, obraz.width, obraz.height);
        if(znalezione && znalezione.data && znalezione.data.indexOf("#p=") > 0){
          stop();
          transferScreen(znalezione.data.split("#p=")[1]);
          return;
        }
      }
    }catch(e){}
    setTimeout(klatka, 130);
  };
  const s = sec("Skanowanie kodu", info, video,
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"ghost",onclick:()=>{ stop(); setupScreen(); }},"wróć")));
  s.className = "sec lock"; v.append(s);

  (async()=>{
    try{
      await jsqrWczytaj();
      strumien = await navigator.mediaDevices.getUserMedia(
        {video:{facingMode:{ideal:"environment"}}, audio:false});
      video.srcObject = strumien;
      await video.play().catch(()=>{});
      klatka();
    }catch(e){
      const czemu = (e && (e.name==="NotAllowedError" || e.name==="SecurityError"))
        ? "Nie dostałam dostępu do aparatu. Zezwól na kamerę i spróbuj jeszcze raz."
        : (e && e.name==="NotFoundError") ? "Nie widzę aparatu w tym urządzeniu."
        : "Nie udało się włączyć aparatu.";
      info.className = "err"; info.textContent = czemu;
    }
  })();
}

/* ---------- ekran przejmowania ustawien z komputera ---------- */
function transferScreen(pak, msg){
  const v = document.getElementById("view"); v.replaceChildren();
  const out = el("p",{class:"note",style:"text-align:center;min-height:19px"},
    msg || "Wpisz sześć cyfr pokazanych na komputerze.");
  let zajety = false;
  const pad = pinPad(async kod=>{
    if(zajety) return; zajety = true;
    out.textContent = "Sprawdzam…";
    let o = null;
    try{ o = await transferOtworz(pak, kod); }
    catch(e){
      zajety = false; pad.shake(); pad.wipe();
      out.textContent = (e && e.message === "przeterminowane")
        ? "Kod wygasł — pokaż nowy na komputerze." : "Zły kod.";
      return;
    }
    GH.token = o.t; GH.owner = o.o || GH.owner; GH.repo = o.r || GH.repo;
    if(o.g) GH.gcal = o.g;
    history.replaceState(null, "", location.pathname);
    pinNowy();
  });
  const s = sec("Przenoszenie z komputera", out, pad);
  s.className = "sec lock"; v.append(s);
  setTimeout(()=>pad.ring(), 60);
}
function pinNowy(){
  const v = document.getElementById("view"); v.replaceChildren();
  const out = el("p",{class:"note",style:"text-align:center;min-height:19px"},
    "Ustaw PIN na tym urządzeniu — sześć cyfr.");
  let zajety = false;
  const pad = pinPad(async pin=>{
    if(zajety) return; zajety = true;
    out.textContent = "Łączę…";
    try{
      await deriveKey(pin, toB(crypto.getRandomValues(new Uint8Array(16))));
      await boot(true);
    }catch(e){
      zajety = false; pad.wipe();
      out.textContent = (e && e.status === 401) ? "Token odrzucony." : "Nie udało się połączyć.";
    }
  });
  const s = sec("Nowe urządzenie", out, pad);
  s.className = "sec lock"; v.append(s);
  setTimeout(()=>pad.ring(), 60);
}

  const v = getComputedStyle(document.documentElement)
    .getPropertyValue(w.slice(4,-1).trim()).trim();

}

/* ---------- magazyn danych: prywatne repozytorium GitHub ---------- */
const CFG_KEY = "planer.cfg";
const GH = {owner:"KlaudiaDobrolinska", repo:"planer", token:"", branch:"main", gcal:"411634246290-g7h76aahc5cv48n46f7kd0nero6ntdri.apps.googleusercontent.com"};
const FILES = {};            // ścieżka pliku -> {sha, data}
const SUBS  = [];            // subskrypcje w pamięci
const DIRTY = new Set();     // pliki do zapisania
let   SAVING = false, SAVED_AT = 0, SAVE_ERR = null, PULLING = false, PULLED_AT = 0;

const TOK_KEY = "planer.gtok";
const SNAP_KEY = "planer.snap";
let snapTimer = null;
async function snapSave(){                 // kopia lokalna, zaszyfrowana tym samym PIN-em
  if(!AESKEY) return;
  try{
    const dane = JSON.stringify({files:FILES, dirty:[...DIRTY], at:Date.now()});
    localStorage.setItem(SNAP_KEY, JSON.stringify(await seal(dane)));
  }catch(e){}                              // np. przepełniona pamięć — trudno, to tylko kopia
}
function snapLater(){ clearTimeout(snapTimer); snapTimer = setTimeout(snapSave, 1200); }
async function snapLoad(){
  if(!AESKEY) return false;
  try{
    const v = JSON.parse(localStorage.getItem(SNAP_KEY)||"null"); if(!v) return false;
    const o = JSON.parse(await unseal(v));
    if(!o || !o.files) return false;
    Object.keys(o.files).forEach(k=>{ FILES[k] = o.files[k]; });
    (o.dirty||[]).forEach(f=>DIRTY.add(f));
    return true;
  }catch(e){ return false; }
}
const VER = "20261006-163102";
async function checkVer(){            // GitHub cachuje stronę 10 min — sama pilnuję aktualności
  try{
    const r = await fetch("wersja.txt?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const v = (await r.text()).trim();
    if(v && v !== VER && !S.newver){ S.newver = true; render(); }
  }catch(e){}
}
setInterval(checkVer, 600000);
setTimeout(checkVer, 4000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkVer(); });
let VAULT = null, AESKEY = null, SALT = null;
const ENC = new TextEncoder(), DEC = new TextDecoder();
const toB = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const frB = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, saltB64){        // liczone raz na sesję, potem szyfrowanie jest natychmiastowe
  const km = await crypto.subtle.importKey("raw", ENC.encode(pin), "PBKDF2", false, ["deriveKey"]);
  AESKEY = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:frB(saltB64), iterations:600000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  SALT = saltB64;
}
async function seal(txt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, AESKEY, ENC.encode(txt));
  return {iv:toB(iv), ct:toB(ct)};
}
async function unseal(v){
  return DEC.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:frB(v.iv)}, AESKEY, frB(v.ct)));
}
function cfgLoad(){
  let m = {}; try{ m = JSON.parse(localStorage.getItem(CFG_KEY)||"{}"); }catch(e){}
  if(m.owner) GH.owner = m.owner;
  if(m.repo)  GH.repo  = m.repo;
  if(m.branch)GH.branch= m.branch;
  if(m.gcal)  GH.gcal  = m.gcal;
  SALT  = m.salt || null;
  VAULT = (m.ct && m.iv && m.salt) ? {ct:m.ct, iv:m.iv} : null;
  return !!VAULT;
}
async function cfgSave(){
  if(!AESKEY || !GH.token) return;
  const v = await seal(GH.token);
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(
    {owner:GH.owner, repo:GH.repo, branch:GH.branch, gcal:GH.gcal, salt:SALT, ...v})); }catch(e){}
  VAULT = v;
}

const fileFor = path => {
  const [col, id] = path.split("/");
  return col === "days" ? "data/days-" + id.slice(0,7) + ".json" : "data/" + col + ".json";
};
const b64 = s => { const b = new TextEncoder().encode(s); let r="";
  for(const x of b) r += String.fromCharCode(x); return btoa(r); };
const unb64 = s => new TextDecoder().decode(
  Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));

async function api(path, opts){
  const r = await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+path,
    Object.assign({headers:{Authorization:"Bearer "+GH.token,
      Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}, opts||{}));
  if(r.status === 404) return null;
  if(!r.ok) throw Object.assign(new Error("GitHub "+r.status), {status:r.status});
  return r.json();
}
async function pull(file){
  const j = await api(file + "?ref=" + GH.branch);
  FILES[file] = j ? {sha:j.sha, data:JSON.parse(unb64(j.content))} : {sha:null, data:{}};
  return FILES[file];
}
async function push(file){
  const f = FILES[file]; if(!f) return;
  const body = {message:"planer "+new Date().toISOString().slice(0,16).replace("T"," "),
    content:b64(JSON.stringify(f.data, null, 1)), branch:GH.branch};
  if(f.sha) body.sha = f.sha;
  try{
    const j = await api(file, {method:"PUT", body:JSON.stringify(body)});
    f.sha = j.content.sha;
  }catch(e){
    if(e.status === 409 || e.status === 422){      // ktoś zapisał w międzyczasie
      const mine = f.data; await pull(file);
      FILES[file].data = Object.assign({}, FILES[file].data, mine);
      return push(file);
    }
    throw e;
  }
}
let saveTimer = null;
function schedule(file){
  DIRTY.add(file);
  snapLater();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1500);
}
async function flush(){
  if(SAVING || !DIRTY.size) return;
  if(!navigator.onLine){ status(); return; }
  SAVING = true; SAVE_ERR = null; status();
  const todo = [...DIRTY]; DIRTY.clear();
  try{ for(const f of todo) await push(f); SAVED_AT = Date.now(); }
  catch(e){ SAVE_ERR = e.status === 401 || e.status === 403
      ? "Token nie ma prawa zapisu albo wygasł."
      : "Nie udało się zapisać. Sprawdź połączenie."; todo.forEach(f=>DIRTY.add(f)); }
  SAVING = false; status();
}
window.addEventListener("beforeunload", e => { if(DIRTY.size){ flush(); e.preventDefault(); e.returnValue=""; } });

const fire = () => SUBS.slice().forEach(f => { try{ f(); }catch(e){} });
const snap = (id, d) => ({id, exists:!!d, data:()=>d, metadata:{fromCache:false,hasPendingWrites:false}});

function docRef(path){
  const [col,id] = path.split("/"), file = fileFor(path);
  const bag = () => (FILES[file] || {data:{}}).data;
  return {
    id, path,
    get(){ return Promise.resolve(snap(id, bag()[id])); },
    set(d){ (FILES[file] = FILES[file] || {sha:null,data:{}}).data[id] = d; schedule(file); fire(); return Promise.resolve(); },
    update(d){ Object.assign(bag()[id] || (bag()[id]={}), d); schedule(file); fire(); return Promise.resolve(); },
    delete(){ delete bag()[id]; schedule(file); fire(); return Promise.resolve(); },
    onSnapshot(n){ const f=()=>n(snap(id,bag()[id])); SUBS.push(f); setTimeout(f,0);
      return ()=>{ const i=SUBS.indexOf(f); if(i>=0) SUBS.splice(i,1); }; },
    collection(c){ return colRef(path+"/"+c); }
  };
}
function colRef(col, filters, ord){
  filters = filters || [];
  const rows = () => {
    let out = [];
    if(col === "days"){
      Object.keys(FILES).filter(f=>f.startsWith("data/days-"))
        .forEach(f => out.push(...Object.entries(FILES[f].data)));
    } else {
      const f = FILES["data/"+col+".json"]; if(f) out = Object.entries(f.data);
    }
    filters.forEach(([fl,op,v]) => out = out.filter(([k,d]) => {
      const x = d[fl];
      return op===">=" ? x>=v : op==="<=" ? x<=v : op==="==" ? x===v : true; }));
    out.sort((a,b) => ord ? String(a[1][ord[0]]??"").localeCompare(String(b[1][ord[0]]??""))
                          : a[0].localeCompare(b[0]));
    return out;
  };
  const self = {
    path: col,
    where:(f,o,v)=>colRef(col, filters.concat([[f,o,v]]), ord),
    orderBy:(f,d)=>colRef(col, filters, [f,d||"asc"]),
    limit:()=>self,
    doc:(id)=>docRef(col+"/"+(id || ("n"+Math.random().toString(36).slice(2,8)))),
    add(d){ const id="n"+Math.random().toString(36).slice(2,8);
      return docRef(col+"/"+id).set(d).then(()=>docRef(col+"/"+id)); },
    run(){ const e=rows(); return {docs:e.map(([k,d])=>snap(k,d)), size:e.length, empty:!e.length,
      docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}}; },
    get(){ return Promise.resolve(self.run()); },
    onSnapshot(n){ const f=()=>n(self.run()); SUBS.push(f); setTimeout(f,0);
      return ()=>{ const i=SUBS.indexOf(f); if(i>=0) SUBS.splice(i,1); }; }
  };
  return self;
}

/* ---------- pasek stanu zapisu ---------- */
function status(){
  const b = document.getElementById("sync"); if(!b) return;
  b.className = "btn icon";
  if(!navigator.onLine){ b.textContent = "bez sieci"; b.style.color = "var(--t)";
    b.title = DIRTY.size ? "Zapiszę, gdy wróci internet." : "Pracujesz na kopii lokalnej."; return; }
  if(SAVE_ERR){ b.textContent = "błąd zapisu"; b.title = SAVE_ERR; b.style.color = "var(--r)"; }
  else if(SAVING || DIRTY.size){ b.textContent = "zapisuję…"; b.title = ""; b.style.color = ""; }
  else if(PULLING){ b.textContent = "odświeżam…"; b.title=""; b.style.color=""; }
  else { b.textContent = "zapisane"; b.style.color = "var(--fg-3)";
    b.title = SAVED_AT ? "Ostatni zapis "+new Date(SAVED_AT).toLocaleTimeString("pl-PL") : ""; }
}

/* ---------- pole PIN: sześć cyfr, jak blokada telefonu ---------- */
function pinPad(onDone){
  const wrap = el("div",{class:"pin"});
  const dots = el("div",{class:"pindots"});
  const inp  = el("input",{type:"tel",inputmode:"numeric",autocomplete:"off",
    maxlength:"6",class:"pininput","aria-label":"PIN",
    name:"pin"+Math.random().toString(36).slice(2,9)});  // zmienna nazwa: przegladarka nie przywroci wpisu
  const boxes = [];
  for(let i=0;i<6;i++){ const b = el("span",{class:"pinbox"}); boxes.push(b); dots.append(b); }
  const paint = ()=>{ const n = inp.value.length;
    boxes.forEach((b,i)=>{ b.className = "pinbox" + (i<n ? " on" : (i===n ? " cur" : "")); }); };
  const powstalo = Date.now();   // pierwsze chwile: przegladarka moze sama wstawic stary wpis
  inp.addEventListener("input",()=>{
    inp.value = inp.value.replace(/[^0-9]/g,"").slice(0,6);
    if(Date.now() - powstalo < 250){ inp.value = ""; paint(); return; }
    paint();
    if(inp.value.length===6) onDone(inp.value);
  });
  setTimeout(()=>{ inp.value = ""; paint(); }, 0);
  inp.addEventListener("focus",paint);
  wrap.append(dots,inp);
  wrap.pin   = ()=>inp.value;
  wrap.ring  = ()=>inp.focus();
  wrap.wipe  = ()=>{ inp.value=""; paint(); inp.focus(); };
  wrap.shake = ()=>{ wrap.classList.add("bad"); setTimeout(()=>wrap.classList.remove("bad"),430); };
  paint();
  return wrap;
}

/* ---------- ekran ustawień ---------- */
function setupScreen(msg){
  const v = document.getElementById("view"); v.replaceChildren();
  const inTok = el("input",{type:"password",placeholder:"github_pat_…",value:GH.token||"",
    autocomplete:"off",spellcheck:"false"});
  const padSet = pinPad(()=>connect());
  const inRepo = el("input",{type:"text",value:GH.owner+"/"+GH.repo});
  const inCal = el("input",{type:"text",value:GH.gcal||"",placeholder:"…apps.googleusercontent.com",
    autocomplete:"off",spellcheck:"false"});
  const adv = el("label",{class:"fld",hidden:true},"Repozytorium",inRepo);
  const out = el("p",{class:"note"});
  const connect = async()=>{
    const m=(inRepo.value||"").trim().split("/");
    if(m.length!==2||!m[0]||!m[1]){ out.textContent="Repozytorium w formacie uzytkownik/nazwa."; return; }
    GH.owner=m[0]; GH.repo=m[1]; GH.token=(inTok.value||"").trim();
    if(!GH.token){ out.textContent="Wklej token."; return; }
    GH.gcal=(inCal.value||"").trim();
    const pin=padSet.pin();
    if(pin.length!==6){ out.textContent="Ustaw PIN — sześć cyfr."; padSet.ring(); return; }
    out.textContent="Szyfruję…";
    await deriveKey(pin, toB(crypto.getRandomValues(new Uint8Array(16))));
    out.textContent="Sprawdzam…";
    try{ await boot(true); }
    catch(e){ out.textContent = e.status===404
      ? "Token nie sięga tego repozytorium. Sprawdź, czy ma dostęp do „planer” i uprawnienie Contents: Read and write."
      : e.status===401 ? "Token odrzucony — sprawdź, czy skopiował się w całości."
      : "Nie udało się połączyć: "+e.message; }
  };
  [inTok,inCal,inRepo].forEach(x=>
    x.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); connect(); } }));
  const reczne = el("div",{hidden:true,style:"display:flex;flex-direction:column;gap:10px"},
    el("label",{class:"fld"},"Token GitHub",inTok),
    el("label",{class:"fld"},"PIN do planera — sześć cyfr",padSet),
    el("label",{class:"fld"},"Identyfikator Google (kalendarz) — już wpisany",inCal),
    adv,
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:connect},"Połącz"),
      el("button",{class:"ghost",onclick:()=>{adv.hidden=!adv.hidden}},"zmień repozytorium"),
      out),
    el("p",{class:"note"},"Token zostaje tylko w tej przeglądarce i jest zaszyfrowany PIN-em — "
      +"bez PIN-u nie da się go odczytać nawet z pamięci przeglądarki. "
      +"Nie wysyłaj tokenu nikomu — także mnie w rozmowie."));
  const box = sec("Pierwsze uruchomienie",
    msg ? el("p",{class:"err"},msg) : null,
    el("p",{class:"note"},"Masz już planer na komputerze? Otwórz tam "
      +"Ustawienia → Przeniesienie na telefon → Pokaż kod i zeskanuj go stąd."),
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"btn on",style:"padding:10px 20px;font-size:15px",
        onclick:()=>skanujScreen()},"Skanuj kod QR")),
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"ghost",onclick:()=>{ reczne.hidden = !reczne.hidden; }},
        "albo wpisz token ręcznie")),
    reczne);
  box.append(el("p",{class:"note",style:"text-align:right;opacity:.75"},
    "wersja " + (typeof VER==="string" ? VER : "?")));
  box.className = "sec setup"; v.append(box);
  setTimeout(()=>inTok.focus(),50);
}

/* ---------- ekran blokady ---------- */
function unlockScreen(msg){
  const v = document.getElementById("view"); v.replaceChildren();
  const out = el("p",{class:"note",style:"text-align:center;min-height:19px"},
    msg || "Wpisz PIN, żeby otworzyć planer.");
  let busy = false;
  const pad = pinPad(async pin=>{
    if(busy) return; busy = true;
    out.textContent = "Otwieram…";
    let tok = null;
    try{ await deriveKey(pin, SALT); tok = await unseal(VAULT); }
    catch(e){
      AESKEY = null; busy = false;
      pad.shake(); pad.wipe(); out.textContent = "Zły PIN.";
      return;
    }
    GH.token = tok;
    try{ await boot(false); }
    catch(e){
      busy = false; S.ready = true;
      setupScreen(e.status===401 ? "Token odrzucony — wpisz nowy." : "Brak połączenia z GitHubem.");
    }
  });
  const s = sec("Planer zamknięty", out, pad,
    el("div",{class:"row",style:"justify-content:center;margin-top:4px"},
      el("button",{class:"ghost",onclick:()=>{
        VAULT = null; GH.token = ""; AESKEY = null;
        try{ localStorage.removeItem(TOK_KEY); }catch(e){}
        setupScreen("Wpisz token jeszcze raz i ustaw nowy PIN."); }},"nie pamiętam PIN-u")));
  s.className = "sec lock";
  v.append(s);
  setTimeout(()=>pad.ring(),60);
}

/* ---------- start ---------- */
const DATA_FILES = ["data/goals.json","data/lists.json","data/weeks.json",
  "data/habits.json","data/health.json","data/cfg.json"];
async function boot(fromSetup){
  const month = S.month;
  const files = DATA_FILES.concat(["data/days-"+month+".json"]);
  const zKopii = await snapLoad();
  let bezSieci = false;
  for(const f of files){
    try{ await pull(f); }
    catch(e){
      if(e && e.status) throw e;           // zły token albo repozytorium — pokaż ustawienia
      bezSieci = true;                     // brak internetu
      if(!zKopii) throw e;
    }
  }
  S.offline = bezSieci;
  if(!bezSieci){ PULLED_AT = Date.now(); snapLater(); }
  if(fromSetup) await cfgSave();
  await gRestore();
  S.db = {doc:docRef, collection:(p)=>colRef(p)};
  S.ready = true; S.canWrite = null;
  resub(); render(); status();
}
async function pullAll(){
  if(PULLING || DIRTY.size || SAVING) return;
  PULLING = true; status();
  try{ for(const f of Object.keys(FILES)) await pull(f); PULLED_AT = Date.now();
       fire(); snapLater(); }catch(e){}
  PULLING = false; status();
}
render();
(async()=>{
  S.ready = true;
  const pak = (location.hash || "").startsWith("#p=") ? location.hash.slice(3) : null;
  if(pak){ cfgLoad(); transferScreen(pak); return; }
  if(cfgLoad()){ unlockScreen(); return; }
  setupScreen(GH.token ? "Token jest teraz szyfrowany — ustaw PIN do planera." : "");
})();
window.addEventListener("online", ()=>{ S.offline=false; status(); flush().then(pullAll); });
window.addEventListener("offline", ()=>{ S.offline=true; status(); });
if("serviceWorker" in navigator)
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setInterval(pullAll, 60000);
setInterval(()=>{ if(S.db) calLoad(); }, 300000);
let HID = 0;                       // po 15 min w tle planer zamyka się sam
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ HID = Date.now(); return; }
  if(VAULT && HID && Date.now()-HID > 900000){ location.reload(); return; }
  pullAll();
});
