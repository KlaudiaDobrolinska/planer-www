<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bd7f90">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikona-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bd7f90'/%3E%3Crect x='9' y='8' width='14' height='17' rx='2' fill='%23fffdfb'/%3E%3Cpath d='M12 13h8M12 17h8M12 21h5' stroke='%23bd7f90' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Planer Klaudii</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
<style>
/* Układ: pasek boczny z działami, treść w kartach na papierze. Papier w kratkę tylko jako tło biurka,
   nigdy pod tekstem. Kolory: okładka FairyFloss, papier Tomoe River, atramenty Sabimidori i Budounezu. */
:root{
  --desk:#ece3e0; --paper:#fffdfb; --paper-2:#faf5f2; --side:#f4ecea;
  --grid:rgba(140,100,90,.09); --grid-5:rgba(140,100,90,.16);
  --fg:#2e2a29; --fg-2:#6b615d; --fg-3:#9c918c;
  --line:#e6dbd6; --line-2:#efe6e2;
  --pink:#bd7f90; --pink-2:#a86a7c; --pink-soft:#f7e9ec;
  --ink:#4a6a5b; --dziennik:#6b5a6e;
  /* Staedtler Triplus — odczytane z wzornika Klaudii */
  --s:#81559c; --g:#5c94b7; --t:#c53501; --z:#44251b; --o:#5a6016; --r:#9f2b37;
  --nawyk:#985e7d;                 /* 26 Antique Pink */
  --sc5:#148a72; --sc4:#68742a; --sc3:#cf9420; --sc2:#c85f20; --sc1:#b8283a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --disp:"Newsreader","Iowan Old Style",Palatino,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#191617; --paper:#262223; --paper-2:#2c2728; --side:#201c1d;
  --grid:rgba(255,230,220,.045); --grid-5:rgba(255,230,220,.08);
  --fg:#efe9e7; --fg-2:#a89e9a; --fg-3:#7d7470;
  --line:#3a3335; --line-2:#322c2e;
  --pink:#d395a5; --pink-2:#e3adba; --pink-soft:#3a2b30;
  --ink:#9ec0ac; --dziennik:#c9b0cc;
  --s:#b196c2; --g:#9abdd2; --t:#db8262; --z:#8b7872; --o:#999c6f; --r:#c37c83;
  --nawyk:#bf9bae;
  --sc5:#2bb394; --sc4:#9aa84a; --sc3:#e0b44a; --sc2:#ec8c4e; --sc1:#e2616f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#191617; --paper:#262223; --paper-2:#2c2728; --side:#201c1d;
  --grid:rgba(255,230,220,.045); --grid-5:rgba(255,230,220,.08);
  --fg:#efe9e7; --fg-2:#a89e9a; --fg-3:#7d7470;
  --line:#3a3335; --line-2:#322c2e;
  --pink:#d395a5; --pink-2:#e3adba; --pink-soft:#3a2b30;
  --ink:#9ec0ac; --dziennik:#c9b0cc;
  --s:#b196c2; --g:#9abdd2; --t:#db8262; --z:#8b7872; --o:#999c6f; --r:#c37c83;
  --nawyk:#bf9bae;
  --sc5:#2bb394; --sc4:#9aa84a; --sc3:#e0b44a; --sc2:#ec8c4e; --sc1:#e2616f;
  color-scheme:dark;
}
/* skórka „System” — wygląd aplikacji macOS; włączana w Legendzie, nie nadpisuje papieru */
:root[data-skin="mac"]{
  --desk:#f2f2f6; --paper:#ffffff; --paper-2:#f7f7f9; --side:#eaeaef;
  --grid:transparent; --grid-5:transparent;
  --fg:#1d1d1f; --fg-2:#5f5f64; --fg-3:#8c8c91;
  --line:#d9d9de; --line-2:#ebebef;
  --pink:#0a6cff; --pink-2:#0a58d0; --pink-soft:#e9f0ff;
  --ink:#30506a; --dziennik:#3a3a3f;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-skin="mac"]:not([data-theme="light"]){
  --desk:#1c1c1e; --paper:#2a2a2d; --paper-2:#313135; --side:#232326;
  --fg:#f2f2f7; --fg-2:#a3a3a8; --fg-3:#7c7c82;
  --line:#3b3b3f; --line-2:#333337;
  --pink:#0a84ff; --pink-2:#64aaff; --pink-soft:#1b2c45;
  --ink:#9ec4e8; --dziennik:#d8d8dd;
  color-scheme:dark;
}}
:root[data-skin="mac"][data-theme="dark"]{
  --desk:#1c1c1e; --paper:#2a2a2d; --paper-2:#313135; --side:#232326;
  --fg:#f2f2f7; --fg-2:#a3a3a8; --fg-3:#7c7c82;
  --line:#3b3b3f; --line-2:#333337;
  --pink:#0a84ff; --pink-2:#64aaff; --pink-soft:#1b2c45;
  --ink:#9ec4e8; --dziennik:#d8d8dd;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--ui);font-size:14.5px;
  line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:1px;border-radius:5px}

#shell{display:flex;height:100%;min-height:0}
#side{width:190px;flex:0 0 190px;background:var(--side);border-right:1px solid var(--line);
  padding:16px 11px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
#side h1{font-family:var(--disp);font-size:17px;font-weight:500;letter-spacing:.02em;
  margin:2px 0 14px 9px;color:var(--pink-2)}
.nav{display:flex;align-items:center;gap:9px;padding:6px 10px;border:0;background:transparent;
  border-radius:7px;width:100%;text-align:left;color:var(--fg);font-family:var(--disp);font-size:15px}
.nav:hover{background:var(--pink-soft)}
.nav[aria-current="page"]{background:var(--pink);color:#fff}
#side .foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--fg-3);line-height:1.55}

main{flex:1;min-width:0;display:flex;flex-direction:column}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:color-mix(in srgb,var(--desk) 90%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
header.bar h2{margin:0;font-family:var(--disp);font-size:20px;font-weight:500;letter-spacing:-.005em}
header.bar .sub{color:var(--fg-2);font-size:12.5px}
.spacer{flex:1}
.scroll{flex:1;overflow-y:auto;padding:20px 22px 44px;
  background-image:linear-gradient(var(--grid-5) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-5) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:60px 60px,60px 60px,12px 12px,12px 12px}
.wrap{max-width:900px;display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,290px);gap:16px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.colbox{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:820px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}

/* karta = kartka papieru */
.sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:14px 17px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;
  box-shadow:0 1px 2px rgba(90,60,55,.05)}
.sec>h3{margin:0;font-family:var(--disp);font-size:13px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--pink-2);border-bottom:1px solid var(--line-2);padding-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.tight{flex-wrap:nowrap}
.row.tight input{flex:1 1 90px;min-width:0}
.note{color:var(--fg-2);font-size:12.5px;line-height:1.6}
.serif{font-family:var(--disp)}

.btn{border:1px solid var(--line);background:var(--paper-2);border-radius:6px;
  padding:3px 10px;font-size:13px;color:var(--fg)}
.btn:hover{border-color:var(--pink);color:var(--pink-2)}
.btn.on{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.icon{padding:2px 9px}
.ghost{border:0;background:transparent;color:var(--fg-3);padding:2px 5px;border-radius:4px;font-size:12px}
.ghost:hover{background:var(--pink-soft);color:var(--pink-2)}
input[type=text],input[type=time],textarea,select{background:transparent;border:0;
  border-bottom:1px solid var(--line);border-radius:0;padding:2px 2px;width:100%;color:var(--fg)}
input[type=text]:focus,textarea:focus,input[type=time]:focus{outline:0;border-bottom-color:var(--pink)}
textarea{resize:none;line-height:1.65;padding:3px 2px}
.grow{resize:vertical}
::placeholder{color:var(--fg-3)}
label.fld{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--fg-3);
  font-family:var(--disp);letter-spacing:.09em;text-transform:uppercase}

/* zadania */
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;align-items:flex-start;gap:8px;padding:2px 3px;border-radius:6px;min-height:26px;
  border:0;background:transparent;font:inherit;color:inherit;text-align:left;width:100%}
.task:hover{background:var(--pink-soft)}
.mark{border:0;background:transparent;width:18px;flex:0 0 18px;text-align:center;font-size:14px;
  line-height:1.65;padding:0}
.ttxt{flex:1;min-width:0;line-height:1.55;word-break:break-word;background:transparent;border:0;
  padding:0;text-align:left;color:var(--fg)}
.task.done .ttxt{color:var(--fg-2)}
.task.canc .ttxt{color:var(--fg-3);text-decoration:line-through}
.task.moved .ttxt,.task.later .ttxt{color:var(--fg-2)}
.tools{display:flex;gap:0;opacity:0;flex:0 0 auto}
.task:hover .tools,.task:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:.6}}
.divider{border-top:1px dashed var(--line);margin:6px 0 6px 26px;width:120px;height:0}

/* oś godzin */
.axis{display:grid;grid-template-columns:30px 1fr;border:1px solid var(--line-2);
  border-radius:7px;overflow:hidden;background:var(--paper-2)}
.hr{display:contents}
.hlab{font-size:10.5px;color:var(--fg-3);padding-right:5px;text-align:right;height:16px;
  display:flex;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;
  border-top:1px solid var(--line-2)}
.hcell{height:16px;position:relative;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);
  cursor:pointer}
.hcell:hover{background:var(--pink-soft)}
.hr.pol .hcell,.hr.pol .hlab{border-top-style:dotted}
.hr:first-child .hlab,.hr:first-child .hcell{border-top:0}
.blk{position:absolute;left:3px;right:3px;border-radius:4px;padding:0 6px;font-size:11.5px;
  overflow:hidden;white-space:nowrap;border:1.5px solid currentColor;
  display:flex;align-items:center;line-height:1.25;z-index:1;cursor:pointer}
.blk.done{background:color-mix(in srgb,currentColor 24%,transparent)}
.blk.done span{font-weight:600}
.blk span{color:var(--fg)}

/* tabele */
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini .mdow{font-size:9.5px;color:var(--fg-3);line-height:18px}
.mini .mday{border:0;background:transparent;color:var(--fg);font-size:12px;padding:4px 0;
  border-radius:5px;font-variant-numeric:tabular-nums}
.mini .mday:hover{background:var(--line-2)}
.mini .mday.wtyg{background:var(--pink-soft)}
.mini .mday.dzisiaj{box-shadow:inset 0 0 0 1px var(--pink)}
.mini .mday.wybrany{background:var(--pink);color:#fff;font-weight:600}
.przep{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px;line-height:1.55;background:var(--paper-2);border:1px solid var(--line-2);
  border-radius:7px;padding:8px 10px;margin:0;overflow-x:auto}
.kroklicz{font-size:10px;color:#fff;background:var(--ink);border-radius:9px;padding:1px 6px;
  letter-spacing:0;text-transform:none;flex:0 0 auto}
.tin{width:78px;flex:0 0 auto}
.tnote{margin:0 4px 6px 28px;width:calc(100% - 34px);font-size:13px;color:var(--fg-2);
  border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--paper-2)}
.blkrow{flex-wrap:wrap}
.blkrow .ttxt,.blkrow input[type=text]{flex:1 1 110px;min-width:0}
.tb{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;table-layout:fixed}
.tb .lft{width:38%}
.tb.hab .lft{width:26%}
.tb th{font-weight:400;color:var(--fg-3);font-size:10.5px;padding:0 1px 4px;text-align:center;
  font-family:var(--disp);letter-spacing:.06em}
.tb th.lft{text-align:left}
.tb td{border-top:1px solid var(--line-2);padding:0;text-align:center}
.tb td.lft{text-align:left;padding:0 3px;color:var(--fg-2);white-space:nowrap;line-height:26px}
.tb.siatka{table-layout:fixed;width:100%}
.tb.siatka .lft{width:112px;white-space:nowrap;padding-right:8px;overflow:hidden;
  text-overflow:ellipsis;font-size:11.5px}
.tb.siatka th{padding:0 0 3px;font-size:9px}
.tb.siatka td{border-top:0;padding:1px}
.tb.siatka th.wk,.tb.siatka td.wk{background:var(--paper-2)}
.cell.kw{width:100%;min-width:0;height:auto;aspect-ratio:1;border:1px solid var(--line);border-radius:3px;
  background:transparent;display:block;padding:0;border-left:1px solid var(--line)}
.legkw{width:17px;height:17px;min-height:17px;flex:0 0 17px;aspect-ratio:auto;border-radius:4px}
.tb.dom td{padding:2px;text-align:center;border-top:0}
.tb.dom td.lft{text-align:left;padding-left:2px}
.tb.dom .cell.kw{width:24px;height:24px;min-width:24px;aspect-ratio:auto;margin:0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;
  font-variant-numeric:tabular-nums}
@media (max-width:900px){ .tb.siatka th:not(.co5){color:transparent} }
@media (max-width:720px){
  .tb.siatka{table-layout:auto;width:auto}          /* na telefonie przesuwamy w bok */
  .tb.siatka .lft{width:auto;font-size:11px;position:sticky;left:0;background:var(--paper);
    z-index:1;padding-right:8px}
  .tb.siatka th{font-size:9px;min-width:24px}
  .tb.siatka th:not(.co5){color:var(--fg-3)}
  .cell.kw{width:24px;min-width:24px;height:24px;aspect-ratio:auto}
}
.cell.kw.s1{background:var(--nawyk);border-color:transparent}
.cell.kw.s2{background:linear-gradient(135deg,var(--nawyk) 0 50%,transparent 50% 100%)}
.cell.kw.s0{background:var(--line-2);border-color:var(--line)}
.cell.kw.s0::after{content:"";position:absolute;inset:0;margin:auto;width:9px;height:1.5px;
  background:var(--fg-3);border-radius:1px}
.cell.kw{position:relative}
.cell.kw.s3{background:repeating-linear-gradient(135deg,var(--line) 0 1.5px,transparent 1.5px 5px)}
.cell{width:100%;height:26px;border:0;background:transparent;border-left:1px solid var(--line-2);
  font-size:12.5px;padding:0;color:var(--fg)}
.cell:hover{background:var(--pink-soft)}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px}
.tb tr.wk td{background:var(--paper-2)}
.scrollx{overflow-x:auto}
:root[data-widok="trackery"] .wrap{max-width:1180px}

/* miesiąc */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-2);
  border-left:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.mg .dow{font-size:10px;color:var(--fg-3);text-align:center;line-height:19px;font-family:var(--disp);
  letter-spacing:.06em;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.mcell{min-height:58px;background:transparent;border:0;border-right:1px solid var(--line-2);
  border-bottom:1px solid var(--line-2);padding:3px 4px;text-align:left;display:flex;
  flex-direction:column;gap:0;overflow:hidden;font-size:10.5px;color:var(--fg);line-height:1.35}
.mcell:hover{background:var(--pink-soft)}
.mcell.out{opacity:.35}
.mcell.today{box-shadow:inset 0 0 0 2px var(--pink)}
.mcell .dn{font-size:11px;color:var(--fg-2);font-variant-numeric:tabular-nums;display:flex;gap:3px;align-items:center}
.ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}
.chip{font-size:9.5px;border-radius:8px;padding:0 4px;border:1px solid var(--line);color:var(--fg-2);
  font-family:var(--disp)}
.err{background:var(--pink-soft);border:1px solid var(--pink);border-radius:7px;
  padding:8px 11px;font-size:12.5px;line-height:1.55;color:var(--fg)}
.goalgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (min-width:640px){.goalgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1040px){.goalgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.goalgrid textarea{min-height:46px}
.legend dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.legend dt{font-size:15px;text-align:center;color:var(--fg-2)}
.legend dd{margin:0}

#tabsbot{display:none}
@media (max-width:720px){
  #side{display:none}
  #shell{flex-direction:column}
  .scroll{padding:14px 14px 92px}          /* miejsce na przycisk dodawania */
  .task{min-height:38px}                    /* wygodniejsze trafianie palcem */
  .mark{width:26px;flex:0 0 26px;font-size:15px}
  .cell{min-width:30px;height:30px}
  .tb{font-size:13px}
  #tabsbot button{padding:7px 5px;font-size:12px}
  header.bar{padding:10px 14px;align-items:center}
  header.bar>.spacer{flex:0 0 100%;height:0;margin:0}
  #tabsbot{display:flex;position:sticky;bottom:0;background:var(--side);
    border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));
    gap:1px;z-index:6;overflow-x:auto;scrollbar-width:none}
  #tabsbot::-webkit-scrollbar{display:none}
  #tabsbot button{flex:1 1 auto;min-width:0;background:transparent;border:0;color:var(--fg-2);
    font-family:var(--disp);font-size:12.5px;padding:5px 4px;border-radius:7px;white-space:nowrap}
  #tabsbot button[aria-current="page"]{background:var(--pink);color:#fff}
}
/* skórka „System”: płaskie karty, bez kratki, krój systemowy */
:root[data-skin="mac"] .scroll{background-image:none;padding:18px 20px 40px}
:root[data-skin="mac"] .wrap{max-width:740px;gap:20px;margin:0 auto}
:root[data-skin="mac"] .cols,:root[data-skin="mac"] .cols.even{
  grid-template-columns:minmax(0,1fr);gap:20px}
:root[data-skin="mac"] .colbox{gap:20px}

/* grupa jak w Ustawieniach systemu: nagłówek na szarym pasku, wiersze oddzielone włosową linią */
:root[data-skin="mac"] .sec{padding:0;gap:0;border-radius:10px;overflow:hidden}
:root[data-skin="mac"] .sec>*{padding:9px 14px}
:root[data-skin="mac"] .sec>*+*{border-top:1px solid var(--line-2)}
:root[data-skin="mac"] .sec>h3{background:var(--paper-2);padding:7px 14px;border-bottom:0}
:root[data-skin="mac"] .sec>p.note:last-child{color:var(--fg-3);font-size:12px}

/* listy zadań pełną szerokością, wiersz jak w aplikacji systemowej */
:root[data-skin="mac"] .sec>.tasks{padding:0;gap:0}

<body>


<div id="shell">
  <nav id="side">
    <h1>Planer</h1>
    <div id="navtop"></div>
    <div class="foot">B6 · X–XII 2026<br>Zapisuje się samo.</div>
  </nav>
  <main>
    <header class="bar" id="bar"></header>
    <div class="scroll"><div class="wrap" id="view"></div></div>
  </main>
</div>
<button id="fab" hidden></button>
<nav id="tabsbot"></nav>

<script>
"use strict";
/* ---------- stałe z planera ---------- */
const AREAS = {
  S:{n:"studia",     c:"var(--s)", nr:"68"},
  G:{n:"gabinet",    c:"var(--g)", nr:"63"},
  T:{n:"twórczość",  c:"var(--t)", nr:"73"},
  Z:{n:"życie",      c:"var(--z)", nr:"77"},
  O:{n:"odpoczynek", c:"var(--o)", nr:"57"},
  R:{n:"termin",     c:"var(--r)", nr:"29"}
};
const DAYTYPES = {
  Z:"zjazd — zajęcia 8:00–18:30, po nich odpoczynek",
  G:"gabinet — notatki zaraz po konsultacji",
  W:"wolny — 3 bloki w oknie przedszkolnym + 1 wieczorem",
  M:"mieszany — konsultacje i 1 blok twórczy",
  N:"niska energia — pierwsza rzecz z listy albo nic",
  R:"regeneracja — bez pracy, zaplanowane"
};
const ST = ["todo","part","done","canc","moved","later","event","note"];
const STMARK = {todo:"•",part:"◩",done:"✓",canc:"×",moved:">",later:"<",event:"○",note:"–"};
const STNAME = {todo:"zadanie",part:"zaczęte / minimum",done:"zrobione",canc:"anulowane",
  moved:"przeniesione",later:"kiedyś / może",event:"wydarzenie",note:"notatka"};
const STCYC = {todo:1,part:1,done:1,canc:1,moved:1,later:1,event:0,note:0};
const FABR = {areas:null, ST:null, STMARK:null, STNAME:null, STCYC:null};
function cfgZapamietajFabryczne(){
  FABR.areas = JSON.parse(JSON.stringify(AREAS));
  FABR.ST = [...ST]; FABR.STMARK = {...STMARK};
  FABR.STNAME = {...STNAME}; FABR.STCYC = {...STCYC};
  FABR.HABITS = HABITS.map(h=>[...h]);
  FABR.KOTWICE = KOTWICE.map(k=>({...k, dni:[...k.dni]}));
  FABR.HOME = HOME.map(h=>[...h]);
  FABR.TERMINY = TERMINY.map(x=>({...x}));
  FABR.SZABLONY = [];
}
function cfgZastosuj(c){
  const a = (c && c.areas && Object.keys(c.areas).length) ? c.areas : FABR.areas;
  Object.keys(AREAS).forEach(k=>delete AREAS[k]);
  Object.keys(a).forEach(k=>AREAS[k] = {...a[k]});
  const m = (c && c.marks) || {};
  const lista = (m.ST && m.ST.length) ? m.ST : FABR.ST;
  ST.length = 0; lista.forEach(x=>ST.push(x));
  Object.keys(STMARK).forEach(k=>delete STMARK[k]);
  Object.assign(STMARK, m.STMARK || FABR.STMARK);
  Object.keys(STNAME).forEach(k=>delete STNAME[k]);
  Object.assign(STNAME, m.STNAME || FABR.STNAME);
  Object.keys(STCYC).forEach(k=>delete STCYC[k]);
  Object.assign(STCYC, m.STCYC || FABR.STCYC);
  const h = (c && c.habits && c.habits.length) ? c.habits : FABR.HABITS;
  HABITS.length = 0; h.forEach(x=>HABITS.push([x[0], x[1]]));
  const kt = (c && c.kotwice) ? c.kotwice : FABR.KOTWICE;
  KOTWICE.length = 0; kt.forEach(x=>KOTWICE.push({...x, dni:[...(x.dni||[])]}));
  const tm = (c && c.terminy) ? c.terminy : FABR.TERMINY;
  TERMINY.length = 0; tm.forEach(x=>TERMINY.push({...x}));
  const sz = (c && c.szablony) ? c.szablony : FABR.SZABLONY;
  SZABLONY.length = 0; sz.forEach(x=>SZABLONY.push(JSON.parse(JSON.stringify(x))));
  const dm = (c && c.home && c.home.length) ? c.home : FABR.HOME;
  HOME.length = 0; dm.forEach(x=>HOME.push([x[0], x[1]]));
}
function cfgZapisz(){
  save("cfg/ui", {areas:JSON.parse(JSON.stringify(AREAS)),
    marks:{ST:[...ST], STMARK:{...STMARK}, STNAME:{...STNAME}, STCYC:{...STCYC}},
    habits:HABITS.map(h=>[...h]),
    kotwice:KOTWICE.map(k=>({...k, dni:[...k.dni]})),
    terminy:TERMINY.map(x=>({...x})),
    szablony:JSON.parse(JSON.stringify(SZABLONY)),
    home:HOME.map(h=>[...h])});
}
function cyklZnakow(){ const c = ST.filter(s=>STCYC[s]); return c.length ? c : ST; }
const HABITS = [["Sz","Szydełko"],["Dz","Dziennik"],["Wc","Wcierka"],["Su","Suplementy"],["Wo","Woda"],["Al","Nakładki"]];
const HMARK = {1:"■",2:"◩",0:"□",3:"/"};
const TERMINY = [];            // {d:"2026-10-15", txt:"Test chusty"}
const SZABLONY = [];           // {nazwa, typ, tasks:[...], blocks:[...]}
const KOTWICE = [                       // zadania, które pojawiają się same
  {dni:[1,2,3,4,5,6,7], txt:"Leki",                 area:"Z"},
  {dni:[1],             txt:"Lek tygodniowy",       area:"Z"},
  {dni:[6],             txt:"Suplementy na tydzień",area:"Z"}
];
const HOME = [["pranie","Pranie"],["zmyw","Zmywarka"],["glowa","Mycie głowy"],
  ["pielr","Pielęgnacja rano"],["pielw","Pielęgnacja wieczór"],["leki","Leki"],
  ["lektyg","Lek tygodniowy"]];
const SCALES = {
  F:{t:"fizyczne",  v:{5:"pełnia sił",4:"dobrze",3:"przeciętnie",2:"wyraźne zmęczenie",1:"bardzo źle"}},
  P:{t:"psychiczne",v:{5:"spokój, jasna głowa",4:"dobrze",3:"neutralnie",2:"przygnębienie, niepokój",1:"bardzo trudny dzień"}},
  E:{t:"efektywność",v:{5:"plan zrobiony, starczyło sił",4:"większość planu",3:"połowa",2:"pierwsza rzecz z listy",1:"nic — dzień N"}},
  C:{t:"cykl",      v:{1:"ok / plamienie",2:"normalny okres",3:"do wytrzymania",4:"ibuprofen",5:"lek na receptę"}}
};
const SCOL = {5:"var(--sc5)",4:"var(--sc4)",3:"var(--sc3)",2:"var(--sc2)",1:"var(--sc1)"};
const CCOL = {1:"var(--sc5)",2:"var(--sc4)",3:"var(--sc3)",4:"var(--sc2)",5:"var(--sc1)"};
const INKTOBER = ["Kawa","Pióro wieczne","Dynia","Liście","Książka","Ołówek","Lisek","Ogień","Wiewiórka",
  "Znaczek pocztowy","Atrament","Marzenie","Herbata","Zaklęcie","Deszcz","Jeż","Wiatr","Szarlotka","Spacer",
  "Grzyby","Aparat","Kocyk","Minimum","Kruk","Herbatnik","Klucz","Zagadka","Wspomnienie","Strach na wróble",
  "Nietoperz","Duch"];
const REVIEW = ["Co się udało?","Co nie wyszło i dlaczego?","Czy bliżej celów kwartału?",
  "TOP 3 na przyszły tydzień","Energia: ile dni N, co pomagało?"];
const DOW = ["pon","wt","śr","czw","pt","sob","nd"];
const MONTHS = ["stycznia","lutego","marca","kwietnia","maja","czerwca","lipca","sierpnia",
  "września","października","listopada","grudnia"];
const MONTHN = ["Styczeń","Luty","Marzec","Kwiecień","Maj","Czerwiec","Lipiec","Sierpień",
  "Wrzesień","Październik","Listopad","Grudzień"];
const VIEWS = [["dzis","Dziś"],["tydzien","Tydzień"],["miesiac","Miesiąc"],
  ["trackery","Trackery"],["cele","Cele"],["listy","Listy"],["legenda","Legenda"],
  ["ustawienia","Ustawienia"]];
cfgZapamietajFabryczne();     // dopiero gdy wszystkie stałe fabryczne są zadeklarowane

/* ---------- daty ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => {const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addD = (s,n) => {const d=parse(s);d.setDate(d.getDate()+n);return key(d)};
const dowIdx = s => (parse(s).getDay()+6)%7;
const monday = s => addD(s,-dowIdx(s));
function isoWeek(s){
  const d=parse(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const y=d.getFullYear(), j4=new Date(y,0,4);
  const w=1+Math.round(((d-j4)/864e5-3+((j4.getDay()+6)%7))/7);
  return y+"-W"+pad(w);
}
const longDate = s => {const d=parse(s);return DOW[dowIdx(s)]+" "+d.getDate()+" "+MONTHS[d.getMonth()]};

/* ---------- stan ---------- */
const S = {
  view:"dzis", date:key(new Date()), month:null, db:null, canWrite:null, mcp:null,
  day:{}, week:{}, habits:{}, health:{}, goals:[], lists:[], mdays:{},
  cal:{ev:[],err:null,on:false}, subs:[], ready:false
};
S.month = S.date.slice(0,7);
const SKIN = {
  get(){ try{ return localStorage.getItem("planer.skin")==="papier" ? "papier" : "mac"; }
         catch(e){ return "mac"; } },
  set(v){ try{ localStorage.setItem("planer.skin",v); }catch(e){}
          document.documentElement.dataset.skin = v; }
};
SKIN.set(SKIN.get());
const THEME = {
  get(){ try{ const v=localStorage.getItem("planer.theme");
               return (v==="light"||v==="dark") ? v : "auto"; }catch(e){ return "auto"; } },
  set(v){ try{ localStorage.setItem("planer.theme",v); }catch(e){}
    if(v==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.dataset.theme = v; }
};
THEME.set(THEME.get());
const el = (t,p={},...k)=>{const e=document.createElement(t);
  for(const[a,v] of Object.entries(p)){
    if(a==="class")e.className=v; else if(a==="html")e.innerHTML=v;
    else if(a.startsWith("on"))e.addEventListener(a.slice(2),v);
    else if(v===true)e.setAttribute(a,""); else if(v!==false&&v!=null)e.setAttribute(a,v);}
  for(const c of k.flat()) if(c!=null) e.append(c.nodeType?c:document.createTextNode(c));
  return e};
const sec = (title,...kids) => el("div",{class:"sec"}, title?el("h3",{},title):null, ...kids);

/* ---------- zapis ---------- */
const QUEUE = new Map();
function save(path, patch){
  if(!S.db) return;
  const prev = QUEUE.get(path) || {};
  QUEUE.set(path, {...prev, ...patch});
  clearTimeout(QUEUE.get(path+"#t"));
  const t = setTimeout(async()=>{
    const body = QUEUE.get(path); QUEUE.delete(path); QUEUE.delete(path+"#t");
    try{ await S.db.doc(path).set(body); }
    catch(e){ if(e&&e.code==="invalid_argument"&&S.canWrite!==false){S.canWrite=false;render();} }
  },350);
  QUEUE.set(path+"#t", t);
}
const dayDoc  = d => ({date:d, type:"", must:"", tasks:[], blocks:[], journal:"", ...(S.day[d]||{})});
const saveDay = (d,p)=>{ S.day[d]={...dayDoc(d),...p}; save("days/"+d, S.day[d]); render(); };
const weekDoc = w => ({top3:["","",""], quota:{}, home:{}, review:{}, ...(S.week[w]||{})});
const saveWeek= (w,p)=>{ S.week[w]={...weekDoc(w),...p}; save("weeks/"+w, S.week[w]); render(); };
const uid = ()=>Math.random().toString(36).slice(2,9);
const duza = s => {                 // wielka pierwsza LITERA, nawet gdy wpis zaczyna się od godziny
  const v = (s||"").trim();
  if(!v) return v;
  const i = v.search(/[a-zA-ZąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/);
  if(i < 0) return v;
  return v.slice(0,i) + v[i].toLocaleUpperCase("pl") + v.slice(i+1);
};

/* ---------- szybki wpis: jedno pole, rozbierane na części ---------- */
const DNISKROT = {pon:1, wt:2, "śr":3, sr:3, czw:4, pt:5, sob:6, nd:7, niedz:7};
function parsujWpis(wejscie){
  let s = " " + (wejscie||"") + " ";
  const dzisiaj = key(new Date());
  let data = S.date, od = null, doo = null, obszar = null;

  s = s.replace(/#(\S+)/g, (m, g)=>{
    const szuk = g.toLowerCase();
    const klucz = Object.keys(AREAS).find(k => k.toLowerCase() === szuk
      || (AREAS[k].n||"").toLowerCase().startsWith(szuk));
    if(klucz) obszar = klucz;
    return " ";
  });
  s = s.replace(/(^|\s)(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2})(?::(\d{2}))?(?=\s)/,
    (m, p, h1, m1, h2, m2)=>{ od = pad(+h1)+":"+m1; doo = pad(+h2)+":"+(m2||"00"); return " "; });
  if(!od) s = s.replace(/(^|\s)(\d{1,2})\s*[-–]\s*(\d{1,2})(?=\s)/,
    (m, p, h1, h2)=>{ if(+h1>23||+h2>23) return m;
      od = pad(+h1)+":00"; doo = pad(+h2)+":00"; return " "; });
  if(!od) s = s.replace(/(^|\s)(\d{1,2}):(\d{2})(?=\s)/,
    (m, p, h, mi)=>{ if(+h>23||+mi>59) return m; od = pad(+h)+":"+mi; return " "; });
  s = s.replace(/(^|\s)(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?(?=\s)/,
    (m, p, dd, mm, rr)=>{ if(+mm<1||+mm>12||+dd<1||+dd>31) return m;
      data = (rr ? +rr : parse(dzisiaj).getFullYear())+"-"+pad(+mm)+"-"+pad(+dd); return " "; });
  s = s.replace(/(^|\s)(dziś|dzis|jutro|pojutrze)(?=\s)/i, (m, p, w)=>{
    const ile = {"dziś":0, dzis:0, jutro:1, pojutrze:2}[w.toLowerCase()];
    data = addD(dzisiaj, ile); return " "; });
  s = s.replace(/(^|\s)(pon|wt|śr|sr|czw|pt|sob|niedz|nd)(?=\s)/i, (m, p, w)=>{
    const cel = DNISKROT[w.toLowerCase()];
    const d = parse(dzisiaj);
    for(let i=0;i<8;i++){ if(((d.getDay()+6)%7)+1 === cel) break; d.setDate(d.getDate()+1); }
    data = key(d); return " "; });

  return {data, od, doo, obszar, txt: duza(s.replace(/\s+/g," ").trim())};
}
function rodzajWpisu(r){ return r.doo ? "blok" : (r.od ? "wydarzenie" : "zadanie"); }

/* ---------- dopisanie zadania do dowolnego dnia ---------- */
async function dopiszZadanie(ds, zadanie){
  if(!S.db) return false;
  let dane = {};
  try{ const s = await S.db.doc("days/"+ds).get(); if(s.exists) dane = s.data()||{}; }catch(e){ return false; }
  const lista = Array.isArray(dane.tasks) ? dane.tasks : [];
  await S.db.doc("days/"+ds).set({...dane, tasks:[...lista, zadanie]});
  return true;
}

/* ---------- kotwice: zadania, które pojawiają się same ---------- */
let kotwicaTrwa = null;
function dodajKotwice(ds){
  if(!S.db || !ds || kotwicaTrwa===ds) return;
  if(ds < key(new Date())) return;        // przeszłości nie dopisujemy
  const D = dayDoc(ds);
  if(D.kotwice) return;
  const dow = dowIdx(ds) + 1;             // 1 = poniedziałek
  const nowe = KOTWICE
    .filter(k => (k.dni||[]).includes(dow) && (k.txt||"").trim())
    .filter(k => !D.tasks.some(t => t.txt === k.txt))
    .map(k => ({id:uid(), txt:duza(k.txt), st:"todo", area:k.area||"Z",
                minor:true, kotwica:true}));
  kotwicaTrwa = ds;
  saveDay(ds, {tasks:[...D.tasks, ...nowe], kotwice:true});
  setTimeout(()=>{ kotwicaTrwa = null; }, 1500);
}

/* ---------- liczby do przeglądu ---------- */
function podsumowanie(daty){
  let blok=0, blokD=0, zad=0, zrob=0, dniN=0, dniZ=0;
  const oceny={F:[],P:[],E:[]};
  daty.forEach(ds=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    const bl = D.blocks||[], ta = D.tasks||[];
    blok += bl.length; blokD += bl.filter(b=>b.done).length;
    zad += ta.length; zrob += ta.filter(t=>t.st==="done").length;
    if(D.type==="N") dniN++;
    if(D.type) dniZ++;
    const h = (S.health[ds.slice(0,7)]||{})[+ds.slice(8)] || {};
    ["F","P","E"].forEach(k=>{ if(h[k]) oceny[k].push(h[k]); });
  });
  const sr = a => a.length ? (a.reduce((x,y)=>x+y,0)/a.length).toFixed(1).replace(".",",") : "—";
  return {blok, blokD, zad, zrob, dniN, dniZ, F:sr(oceny.F), P:sr(oceny.P), E:sr(oceny.E)};
}
function liczbyWiersz(etykieta, wartosc){
  return el("div",{class:"row"},
    el("span",{class:"note",style:"min-width:168px"},etykieta),
    el("b",{style:"font-weight:600;font-variant-numeric:tabular-nums"},String(wartosc)));
}

/* ---------- subskrypcje ---------- */

let calRange = "";
/* ---------- kalendarz Google: logowanie w przeglądarce, odczyt i zapis ---------- */
const GSCOPE = "https://www.googleapis.com/auth/calendar.events";
const GAPI   = "https://www.googleapis.com/calendar/v3";
const GTZ    = "Europe/Warsaw";
const GOK_KEY = "planer.gok";
let gTok = null, gExp = 0, gBusy = false, gLast = 0, calAt = 0, calEdit = null;
let gEverOk = false;
try{ gEverOk = localStorage.getItem(GOK_KEY)==="1"; }catch(e){}
function gMark(ok){
  gEverOk = ok;
  try{ ok ? localStorage.setItem(GOK_KEY,"1") : localStorage.removeItem(GOK_KEY); }catch(e){}
}

function gisLoad(){
  return new Promise((ok,no)=>{
    if(window.google && google.accounts && google.accounts.oauth2) return ok();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = ()=>ok(); s.onerror = ()=>no({code:"offline"});
    document.head.append(s);
  });
}
function gValid(){ return !!gTok && Date.now() < gExp - 60000; }
async function gStore(){               // zgoda przeżywa zamknięcie aplikacji — szyfrowana tym samym PIN-em
  if(!AESKEY || !gTok) return;
  try{ localStorage.setItem(TOK_KEY, JSON.stringify(await seal(JSON.stringify({t:gTok, e:gExp})))); }
  catch(e){}
}
async function gRestore(){
  if(!AESKEY) return;
  try{
    const v = JSON.parse(localStorage.getItem(TOK_KEY)||"null"); if(!v) return;
    const o = JSON.parse(await unseal(v));
    if(o && o.e - 120000 > Date.now()){ gTok = o.t; gExp = o.e; }
  }catch(e){}
}
function gRequest(interactive){
  if(!GH.gcal) return Promise.reject({code:"no_client"});
  return gisLoad().then(()=>new Promise((ok,no)=>{
    let done = false;
    const cl = google.accounts.oauth2.initTokenClient({
      client_id: GH.gcal, scope: GSCOPE,
      callback: r=>{ done = true;
        if(r && r.access_token){
          gTok = r.access_token; gExp = Date.now() + ((r.expires_in||3600)*1000);
          gMark(true); gStore(); ok(gTok);
        } else no({code:"denied"}); },
      error_callback: e=>{ done = true;
        no({code:(e && e.type==="popup_closed") ? "denied" : "connect"}); }
    });
    try{ cl.requestAccessToken({prompt: interactive ? "" : "none"}); }
    catch(e){ no({code:"connect"}); }
    setTimeout(()=>{ if(!done) no({code:"connect"}); }, interactive ? 120000 : 10000);
  }));
}
async function gToken(interactive){
  if(gValid()) return gTok;
  return gRequest(interactive);
}
// Google otwiera okienko także przy cichym odnawianiu, a przeglądarka wpuszcza je
// tylko tuż po kliknięciu — więc odnawiamy przy okazji dowolnego kliknięcia w planerze.
document.addEventListener("pointerdown", ()=>{
  if(!GH.gcal || gBusy || gValid() || !gEverOk) return;
  if(Date.now() - gLast < 600000) return;
  gLast = Date.now(); gBusy = true;
  gRequest(false).then(()=>{ gBusy=false; calLoad(false,true); })
                 .catch(()=>{ gBusy=false; gMark(false);
                   S.cal.on=false; S.cal.err="connect"; render(); });
}, {capture:true, passive:true});

async function calApi(path, opts){
  let tok;
  try{ tok = await gToken(false); }catch(e){ tok = await gToken(true); }
  const h = Object.assign({Authorization:"Bearer "+tok, "Content-Type":"application/json"},
                          (opts && opts.headers) || {});
  const r = await fetch(GAPI+path, Object.assign({}, opts, {headers:h}));
  if(r.status===401 || r.status===403){ gTok=null; throw {code:"connect"}; }
  if(!r.ok){
    let m=""; try{ m=(await r.json()).error.message; }catch(e){}
    throw {code:"api", message: m || ("Błąd "+r.status)};
  }
  return r.status===204 ? null : r.json();
}
async function calLoad(interactive, force){
  const a = S.month+"-01", d = parse(a); d.setMonth(d.getMonth()+1); d.setDate(7);
  const from = addD(a,-7), to = key(d), rng = from+to;
  if(!force && !interactive && rng===calRange && Date.now()-calAt < 300000) return;
  calRange = rng;
  let tok = null;
  if(interactive){
    try{ tok = await gToken(true); }
    catch(e){ S.cal.on=false; S.cal.err=(e&&e.code)||"connect"; render(); return; }
  }else{
    if(!gValid()){                    // bez kliknięcia nie wywołujemy okienka Google
      S.cal.on=false; S.cal.err = GH.gcal ? "connect" : "no_client"; render(); return;
    }
    tok = gTok;
  }
  const q = "?timeMin="+from+"T00%3A00%3A00Z&timeMax="+to+"T00%3A00%3A00Z"
          + "&singleEvents=true&orderBy=startTime&maxResults=250&timeZone="+encodeURIComponent(GTZ);
  try{
    const r = await fetch(GAPI+"/calendars/primary/events"+q, {headers:{Authorization:"Bearer "+tok}});
    if(r.status===401 || r.status===403){ gTok=null; S.cal.err="connect"; S.cal.on=false; render(); return; }
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    S.cal.ev = j.items || []; S.cal.err = null; S.cal.on = true; calAt = Date.now();
  }catch(e){ S.cal.err = S.cal.ev.length ? null : "offline"; }
  render();
}
function calFields(e){                 // wpis Google -> pola formularza
  const allDay = !!(e.start && e.start.date);
  const sd = allDay ? e.start.date : ((e.start&&e.start.dateTime)||"").slice(0,10);
  let ed = allDay ? addD((e.end&&e.end.date)||sd,-1)
                  : ((e.end&&e.end.dateTime)||"").slice(0,10);
  if(!ed) ed = sd;
  return {id:e.id, allDay, title:e.summary||"", loc:e.location||"", desc:e.description||"",
    sd, ed,
    st:(e.start&&e.start.dateTime)?e.start.dateTime.slice(11,16):"09:00",
    et:(e.end&&e.end.dateTime)?e.end.dateTime.slice(11,16):"10:00",
    guests:(e.attendees||[]).filter(a=>!a.self).map(a=>a.email).join(", "),
    notify:true};
}
function evBody(f){
  const b = {summary: f.title || "(bez nazwy)"};
  b.location = f.loc || "";
  b.description = f.desc || "";
  if(f.allDay){
    b.start = {date:f.sd};
    b.end   = {date:addD((f.ed && f.ed>=f.sd) ? f.ed : f.sd, 1)};
  }else{
    let ed = (f.ed && f.ed>=f.sd) ? f.ed : f.sd;
    if(ed===f.sd && f.et<=f.st) ed = addD(f.sd,1);
    b.start = {dateTime:f.sd+"T"+f.st+":00", timeZone:GTZ};
    b.end   = {dateTime:ed+"T"+f.et+":00", timeZone:GTZ};
  }
  b.attendees = (f.guests||"").split(/[,;\s]+/)
    .filter(x=>x.indexOf("@")>0).map(email=>({email}));
  return b;
}
async function calEnsure(){            // wołane z kliknięcia, więc okienko Google jest dozwolone
  if(gValid()) return true;
  try{ await gToken(true); return true; }
  catch(e){ S.cal.on=false; S.cal.err=(e&&e.code)||"connect"; render(); return false; }
}
async function calSave(f){
  if(!f.title){ S.cal.msg="Wpisz nazwę wydarzenia."; render(); return; }
  if(!gValid() && !(await calEnsure())) return;
  S.cal.msg = "Zapisuję…"; render();
  const guests = (f.guests||"").indexOf("@")>0;
  const q = "?sendUpdates=" + (guests && f.notify ? "all" : "none");
  try{
    const b = JSON.stringify(evBody(f));
    if(f.id) await calApi("/calendars/primary/events/"+encodeURIComponent(f.id)+q,
                          {method:"PATCH", body:b});
    else     await calApi("/calendars/primary/events"+q, {method:"POST", body:b});
    calEdit = null; S.cal.msg = null; await calLoad(false,true);
  }catch(e){ S.cal.msg = e.message || CALERR[e.code] || "Nie udało się zapisać."; render(); }
}
async function calDel(id){
  if(!gValid() && !(await calEnsure())) return;
  S.cal.msg = "Usuwam…"; render();
  try{
    await calApi("/calendars/primary/events/"+encodeURIComponent(id)+"?sendUpdates=none",
                 {method:"DELETE"});
    calEdit = null; S.cal.msg = null; await calLoad(false,true);
  }catch(e){ S.cal.msg = e.message || CALERR[e.code] || "Nie udało się usunąć."; render(); }
}

function calFor(dateStr){
  return S.cal.ev.filter(e=>{
    const s=(e.start&&(e.start.date||e.start.dateTime))||"";
    const en=(e.end&&(e.end.date||e.end.dateTime))||"";
    if(!s) return false;
    const sd=s.slice(0,10);
    if(e.start&&e.start.date) return dateStr>=sd && dateStr<en.slice(0,10);
    return sd===dateStr;
  }).map(e=>({id:e.id, t:(e.start&&e.start.dateTime)?e.start.dateTime.slice(11,16):"",
      s:e.summary||"(bez nazwy)", allDay:!!(e.start&&e.start.date),
      st:(e.start&&e.start.dateTime)||"", en:(e.end&&e.end.dateTime)||"", raw:e}))
   .sort((a,b)=>a.t.localeCompare(b.t));

function miniKalendarz(dstr){
  const d=parse(dstr), y=d.getFullYear(), m=d.getMonth();
  const przesun=(new Date(y,m,1).getDay()+6)%7;
  const ile=new Date(y,m+1,0).getDate();
  const tyg=isoWeek(dstr), dzisiaj=key(new Date());
  const g=el("div",{class:"mini"});
  DOW.forEach(n=>g.append(el("span",{class:"mdow"},n)));
  for(let i=0;i<przesun;i++) g.append(el("span",{}));
  for(let i=1;i<=ile;i++){
    const ds=y+"-"+pad(m+1)+"-"+pad(i);
    const kl=["mday"];
    if(isoWeek(ds)===tyg) kl.push("wtyg");
    if(ds===dstr) kl.push("wybrany");
    if(ds===dzisiaj) kl.push("dzisiaj");
    g.append(el("button",{class:kl.join(" "),title:ds,
      onclick:()=>{S.date=ds; S.month=ds.slice(0,7); resub(); render();}}, String(i)));
  }
  const s=sec(MONTHN[m]+" "+y, g);
  s.append(el("p",{class:"note"},"Podświetlony pas to tydzień, nad którym pracujesz."));
  return s;
}

    for(let pol=0; pol<2; pol++){
      const mm=pol*30, pocz=h+pol*0.5;
      const cell=el("div",{class:"hcell",title:"Kliknij, by zacząć tu blok",
        onclick:()=>dodajOd(h,mm)});
      axis.append(el("div",{class:"hr"+(pol?" pol":"")},
        el("div",{class:"hlab"}, pol ? "" : String(h)), cell));
      D.blocks.forEach(b=>{
        const s=+b.s.slice(0,2)+(+b.s.slice(3))/60, e=+b.e.slice(0,2)+(+b.e.slice(3))/60;
        if(s>=pocz && s<pocz+0.5){
          const opis=[duza(b.txt)||duza((AREAS[b.area]||AREAS.Z).n), duza(b.proj)].filter(Boolean).join(" · ");
          cell.append(el("div",{class:"blk"+(b.done?" done":""),
            title:(b.done?"Zrobione":"Kliknij, gdy zrobione")+" · "+b.s+"–"+b.e,
            style:"top:"+((s-pocz)*2*POL)+"px;height:"
              +Math.max(18,(Math.max(.25,Math.min(e,H1+1)-s)*2*POL-2))+"px;color:"
              +(AREAS[b.area]||AREAS.Z).c,
            onclick:(ev)=>{ ev.stopPropagation();
              saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,done:!x.done}:x)}); }},
            el("span",{}, (b.done?"✓ ":"")+opis)));
        }
      });
    }
  }
  const bl=el("div",{class:"tasks",style:"margin-top:7px"});
  D.blocks.forEach(b=>{
    const t1=el("input",{type:"time",value:b.s,class:"tin"});
    const t2=el("input",{type:"time",value:b.e,class:"tin"});
    const tx=el("input",{type:"text",value:duza(b.txt||""),placeholder:"Nazwa bloku"});
    const pr=el("input",{type:"text",value:duza(b.proj||""),placeholder:"szczegół — np. który projekt",
      style:"width:auto;flex:1 1 150px;min-width:0"});
    const sv=()=>saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id
      ?{...x,s:t1.value,e:t2.value,txt:duza(tx.value),proj:duza(pr.value)}:x)});
    [t1,t2,tx,pr].forEach(i=>i.addEventListener("change",sv));
    bl.append(el("div",{class:"task blkrow"},
      el("button",{class:"mark",style:"color:"+(AREAS[b.area]||AREAS.Z).c,title:"Obszar",
        onclick:()=>{const ks=Object.keys(AREAS);
          saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,area:ks[(ks.indexOf(b.area)+1)%ks.length]}:x)})}},"■"),
      t1,t2,tx,pr,
      el("button",{class:"ghost",title:b.done?"Zrobione":"Oznacz jako zrobione",
        onclick:()=>saveDay(d,{blocks:D.blocks.map(x=>x.id===b.id?{...x,done:!x.done}:x)})},
        b.done?"✓":"○"),
      el("button",{class:"ghost",title:"Usuń",onclick:()=>saveDay(d,{blocks:D.blocks.filter(x=>x.id!==b.id)})},"✕")));
  });
  const secBloki=sec("Bloki",axis,
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:()=>saveDay(d,{blocks:[...D.blocks,
        {id:uid(),s:"09:00",e:"10:30",area:"T",txt:"",done:false}]})},"Dodaj blok"),
      el("button",{class:"btn",onclick:()=>saveDay(d,{blocks:[...D.blocks,
        {id:uid(),s:"20:00",e:"21:00",area:"T",txt:"Szydełko",proj:"",done:false}]})},"Szydełko")),
    bl,
    el("p",{class:"note"},"Kliknij w oś, by zacząć blok o tej godzinie. "
      +"Kliknij w gotowy blok, gdy go zrobisz — wypełni się kolorem. "
      +"Blok = 90–120 minut jednej rzeczy, najwyżej 2–3 dziennie."));

  /* prawa strona */
  const types=el("div",{class:"row"});
  Object.entries(DAYTYPES).forEach(([k,desc])=>types.append(el("button",{class:"btn"+(D.type===k?" on":""),
    title:desc,onclick:()=>saveDay(d,{type:D.type===k?"":k})},k)));
  const secTyp=sec("Typ dnia",types,el("p",{class:"note"},D.type?DAYTYPES[D.type]:"Wybierz, jak wygląda ten dzień."));

  const secSzab=sec("Szablony dnia");
  if(!SZABLONY.length) secSzab.append(el("p",{class:"note"},
    "Brak szablonów. Ułóż typowy dzień i zapisz go — potem wstawisz jednym kliknięciem."));
  const rzSz=el("div",{class:"row"});
  SZABLONY.forEach((sz,i)=>rzSz.append(el("button",{class:"btn",
    title:"Wstaw do tego dnia: "+((sz.tasks||[]).length)+" zadań, "+((sz.blocks||[]).length)+" bloków",
    onclick:()=>{
      if(!confirm("Wstawić szablon „"+sz.nazwa+"” do tego dnia? Dotychczasowe wpisy zostaną.")) return;
      saveDay(d,{
        type: sz.typ || D.type,
        tasks:[...D.tasks, ...(sz.tasks||[]).map(x=>({id:uid(), txt:duza(x.txt), st:"todo",
          area:x.area||"Z", minor:!!x.minor}))],
        blocks:[...D.blocks, ...(sz.blocks||[]).map(x=>({id:uid(), s:x.s, e:x.e,
          area:x.area||"T", txt:duza(x.txt||""), proj:"", done:false}))]});
    }}, sz.nazwa)));
  SZABLONY.forEach((sz,i)=>{
    const nm=el("input",{type:"text",value:sz.nazwa||"",
      style:"width:auto;flex:1 1 140px;min-width:0"});
    nm.addEventListener("change",()=>{SZABLONY[i].nazwa=duza(nm.value); cfgZapisz(); render();});
    secSzab.append(el("div",{class:"row"},nm,
      el("span",{class:"note"},((sz.tasks||[]).length)+" zad. · "+((sz.blocks||[]).length)+" bl."),
      el("button",{class:"ghost",title:"Usuń szablon",onclick:()=>{
        if(!confirm("Usunąć szablon „"+sz.nazwa+"”?")) return;
        SZABLONY.splice(i,1); cfgZapisz(); render();
      }},"✕")));
  });
  secSzab.append(rzSz, el("div",{class:"row"},
    el("button",{class:"ghost",onclick:()=>{
      const nazwa=prompt("Nazwa szablonu (np. Dzień gabinetowy, Dzień N):","");
      if(!nazwa) return;
      SZABLONY.push({nazwa:duza(nazwa), typ:D.type||"",
        tasks:D.tasks.filter(x=>!x.kotwica).map(x=>({txt:x.txt, area:x.area, minor:!!x.minor})),
        blocks:D.blocks.map(x=>({s:x.s, e:x.e, area:x.area, txt:x.txt||""}))});
      cfgZapisz(); render();
    }},"zapisz ten dzień jako szablon")));
  const secMust=sec("Musi się udać",
    textRow(duza(D.must),"Jedna rzecz, po której dzień jest udany",v=>saveDay(d,{must:duza(v)})));

  const ce=calFor(d), showCal=S.cal.on||S.cal.err, secCal=sec("Kalendarz Google");
  calNote(secCal);
  if(!S.cal.err){
    if(!ce.length) secCal.append(el("p",{class:"note"},S.cal.on?"Brak wpisów na ten dzień.":"Wczytywanie…"));
    else ce.forEach(e=>secCal.append(calRow(e,d)));
    if(S.cal.on){
      if(calEdit && calEdit.date===d) calForm(secCal,d);
      else secCal.append(el("div",{class:"row"},el("button",{class:"ghost",onclick:async()=>{
        if(!await calEnsure()) return;
        calEdit={date:d,sd:d,ed:d,st:"09:00",et:"10:00",notify:true};
        S.cal.msg=null; render(); }},"+ dodaj wydarzenie")));
    }
  }
  if(S.cal.msg) secCal.append(el("p",{class:"note"},S.cal.msg));

  const mo=parse(d), ink=(mo.getMonth()===9)?INKTOBER[mo.getDate()-1]:null;
  const ta=el("textarea",{rows:9,class:"grow",style:"font-family:var(--disp);color:var(--dziennik);font-size:15px",
    placeholder:ink?"Inktober: "+ink:"Co z dziś zostaje?"});
  ta.value=D.journal||"";
  ta.addEventListener("change",()=>saveDay(d,{journal:duza(ta.value)}));
  const secDz=sec(ink?("Dziennik · "+mo.getDate()+" "+ink):"Dziennik",ta);

  /* --- szybki wpis --- */
  const szPole=el("input",{type:"text",placeholder:"np. jutro 9:00-11:00 Gabinet #G"});
  const szPodg=el("p",{class:"note"});
  const odswiezPodg=()=>{
    const r=parsujWpis(szPole.value);
    if(!r.txt){ szPodg.textContent=
      "„Pranie ciemne” → zadanie · „12:30 Psychoterapia” → wydarzenie · "
      +"„jutro 9:00-11:00 Gabinet” → blok. Dzień: dziś / jutro / pon / 5.10 (kropka). "
      +"Godzina z dwukropkiem. Obszar: #G."; return; }
    const kt=rodzajWpisu(r), dd=parse(r.data);
    szPodg.textContent = {zadanie:"Zadanie", blok:"Blok", wydarzenie:"Wydarzenie w kalendarzu"}[kt]
      + " · " + dd.getDate() + " " + MONTHS[dd.getMonth()]
      + (r.od ? " · " + r.od + (r.doo ? "–"+r.doo : "") : "")
      + (r.obszar ? " · " + (AREAS[r.obszar]||AREAS.Z).n : "")
      + " · " + r.txt;
  };
  szPole.addEventListener("input",odswiezPodg);
  const szWyslij=async()=>{
    const r=parsujWpis(szPole.value); if(!r.txt) return;
    const kt=rodzajWpisu(r), ob=r.obszar||"Z";
    if(kt==="zadanie"){
      if(r.data===d) saveDay(d,{tasks:[...D.tasks,{id:uid(),txt:r.txt,st:"todo",area:ob,minor:false}]});
      else await dopiszZadanie(r.data,{id:uid(),txt:r.txt,st:"todo",area:ob,minor:false});
    }else if(kt==="blok"){
      const nowy={id:uid(),s:r.od,e:r.doo,area:ob,txt:r.txt,done:false};
      if(r.data===d) saveDay(d,{blocks:[...D.blocks,nowy]});
      else{
        let dane={}; try{ const sn=await S.db.doc("days/"+r.data).get(); if(sn.exists) dane=sn.data()||{}; }catch(e){}
        const bl=Array.isArray(dane.blocks)?dane.blocks:[];
        await S.db.doc("days/"+r.data).set({...dane,blocks:[...bl,nowy]});
      }
    }else{
      if(typeof calSave==="function"){
        const kon=new Date(2000,0,1,+r.od.slice(0,2),+r.od.slice(3)); kon.setMinutes(kon.getMinutes()+60);
        await calSave({date:r.data, title:r.txt, allDay:false, sd:r.data, ed:r.data,
          st:r.od, et:pad(kon.getHours())+":"+pad(kon.getMinutes()), guests:"", loc:"", desc:"", notify:false});
      }else{
        await dopiszZadanie(r.data,{id:uid(),txt:r.od+" "+r.txt,st:"event",area:ob,minor:false});
      }
    }
    szPole.value=""; odswiezPodg(); render();
  };
  szPole.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); szWyslij(); } });
  odswiezPodg();
  const secSzyb=sec("Szybki wpis", szPole,
    el("div",{class:"row"}, el("button",{class:"btn",onclick:szWyslij},"Dodaj"), szPodg));

  /* --- terminy --- */
  const dzisiaj=key(new Date());
  const term=(TERMINY||[]).filter(x=>x.d && x.d>=dzisiaj)
    .sort((a,b)=>a.d.localeCompare(b.d)).slice(0,6);
  const secTerm=sec("Terminy");
  if(!term.length) secTerm.append(el("p",{class:"note"},
    "Brak terminów. Dodasz je w Ustawieniach — testy, płatności, zjazdy."));
  term.forEach(x=>{
    const ile=Math.round((parse(x.d)-parse(dzisiaj))/86400000);
    const pilne=ile<=3;
    secTerm.append(el("div",{class:"row",style:"flex-wrap:nowrap;gap:7px"},
      el("span",{style:"flex:1 1 auto;min-width:0"},x.txt),
      el("b",{style:"flex:0 0 auto;font-weight:600;color:"+(pilne?"var(--r)":"var(--fg-2)")},
        ile===0?"dziś":(ile===1?"jutro":("za "+ile+" dni")))));
  });
  const termEdyt=el("div",{hidden:true,style:"display:flex;flex-direction:column;gap:8px"});
  edytorTerminow(termEdyt);
  secTerm.append(el("div",{class:"row"},
    el("button",{class:"ghost",onclick:()=>{termEdyt.hidden=!termEdyt.hidden}},"edytuj terminy")),
    termEdyt);

  const secKotw=sec("Kotwice");
  secKotw.append(el("p",{class:"note"},
    "Zadania, które dopisują się same w wybrane dni tygodnia."));
  edytorKotwic(secKotw);

  const mk=miniKalendarz(d);
  const prawa = showCal ? [mk,secMust,secTyp,secSzab,secTerm,secKotw,secCal]
                       : [mk,secMust,secTyp,secSzab,secTerm,secKotw];
  return {L:[secSzyb,secTasks,secBloki,secDz], R:prawa};
}

/* ---------- Tydzień ---------- */
function vTydzien(){
  const mon=monday(S.date), w=isoWeek(S.date), W=weekDoc(w);
  const days=[...Array(7)].map((_,i)=>addD(mon,i));

  const dl=sec("Dni");
  days.forEach(ds=>{
    const dd=S.mdays[ds]||S.day[ds]||{};
    const tasks=dd.tasks||[], done=tasks.filter(t=>t.st==="done").length;
    const ev=calFor(ds).slice(0,2).map(e=>(e.t?e.t+" ":"")+e.s).join(" · ");
    dl.append(el("button",{class:"task",style:"width:100%;text-align:left",
      onclick:()=>{S.date=ds;S.view="dzis";S.month=ds.slice(0,7);resub();render()}},
      el("span",{style:"width:56px;flex:0 0 56px;color:var(--ink-2)"},DOW[dowIdx(ds)]+" "+parse(ds).getDate()),
      dd.type?el("span",{class:"chip",style:"flex:0 0 auto"},dd.type):el("span",{style:"width:20px;flex:0 0 20px"}),
      el("span",{class:"ttxt",style:"color:var(--ink-2)"},duza(dd.must||ev||"—")),
      el("span",{style:"color:var(--ink-3);font-variant-numeric:tabular-nums"},tasks.length?done+"/"+tasks.length:"")));
  });

  const hw=sec("Dom i pielęgnacja");
  const tb=el("table",{class:"tb dom"});
  const hr=el("tr",{},el("th",{class:"lft"},""));
  days.forEach(ds=>hr.append(el("th",{},DOW[dowIdx(ds)])));
  tb.append(el("thead",{},hr));
  const tbody=el("tbody");
  HOME.forEach(([k,label])=>{
    const tr=el("tr",{},el("td",{class:"lft"},duza(label)));
    days.forEach(ds=>{
      const cur=(W.home[ds]||{})[k];
      const klasa = "cell kw" + (cur==null ? "" : (k==="pranie" ? " s1" : " s"+cur));
      const opis = cur==null ? "nic nie zapisano"
        : (k==="pranie" ? (cur+" wsad"+(cur===1?"":(cur<5?"y":"ów")))
                        : (cur===1?"zrobione":"wersja skrócona"));
      tr.append(el("td",{},el("button",{class:klasa,
        title:label+" · "+DOW[dowIdx(ds)]+" — "+opis,
        onclick:()=>{
        const nx = k==="pranie" ? (cur==null?1:(cur>=3?null:cur+1)) : (cur===1?2:(cur===2?null:1));
        const h={...W.home,[ds]:{...(W.home[ds]||{})}};
        if(nx==null) delete h[ds][k]; else h[ds][k]=nx;
        saveWeek(w,{home:h});
      }}, k==="pranie" && cur ? String(cur) : "")));
    });
    tbody.append(tr);
  });
  tb.append(tbody);
  hw.append(el("div",{class:"scrollx"},tb),
    el("div",{class:"row",style:"gap:12px"},
      el("span",{class:"row",style:"gap:5px"},el("span",{class:"cell kw legkw s1",style:"pointer-events:none"}),
        el("span",{class:"note"},"zrobione")),
      el("span",{class:"row",style:"gap:5px"},el("span",{class:"cell kw legkw s2",style:"pointer-events:none"}),
        el("span",{class:"note"},"wersja skrócona")),
      el("span",{class:"row",style:"gap:5px"},el("span",{class:"cell kw legkw",style:"pointer-events:none"}),
        el("span",{class:"note"},"pusta"))),
    el("p",{class:"note"},"Pranie: cyfra w kratce to liczba wsadów. Lek tygodniowy — poniedziałek."));
  edytorDomu(hw);

  const rv=sec("Przegląd tygodnia");
  const pw = podsumowanie(days);
  rv.append(
    liczbyWiersz("Bloki zaplanowane", pw.blok),
    liczbyWiersz("Bloki zrobione", pw.blokD),
    liczbyWiersz("Zadania zrobione", pw.zrob + " z " + pw.zad),
    liczbyWiersz("Dni niskiej energii (N)", pw.dniN),
    liczbyWiersz("Średnio fizycznie / psychicznie / efektywność",
      pw.F + " · " + pw.P + " · " + pw.E),
    el("p",{class:"note"},"Liczby są po to, żeby odróżnić gorszy tydzień od tendencji — nie do oceniania."));
  REVIEW.forEach((qn,i)=>{
    const ta=el("textarea",{rows:2,placeholder:qn}); ta.value=W.review[i]||"";
    ta.addEventListener("change",()=>saveWeek(w,{review:{...W.review,[i]:duza(ta.value)}}));
    rv.append(el("div",{},el("div",{class:"note"},(i+1)+". "+qn),ta));
  });

  const t3=sec("TOP 3 tygodnia");
  [0,1,2].forEach(i=>t3.append(el("div",{class:"row"},
    el("span",{style:"color:var(--ink-3);width:12px"},String(i+1)),
    textRow(duza(W.top3[i]),"Najważniejsza sprawa",v=>{const a=[...W.top3];a[i]=duza(v);saveWeek(w,{top3:a})}))));

  const q=sec("Kratki bloków");
  Object.entries(AREAS).filter(([k])=>k!=="R").forEach(([k,v])=>{
    const cur=W.quota[k]||{n:0,d:0};
    const boxes=el("div",{class:"row",style:"gap:2px"});
    for(let i=0;i<cur.n;i++) boxes.append(el("button",{class:"btn icon",
      style:"padding:0 6px;color:"+v.c+(i<cur.d?";background:"+v.c+";color:#fff;border-color:transparent":""),
      title:i<cur.d?"Zrobiony":"Zaplanowany",
      onclick:()=>saveWeek(w,{quota:{...W.quota,[k]:{...cur,d:i<cur.d?i:i+1}}})},"▪"));
    q.append(el("div",{class:"row"},
      el("span",{style:"width:84px;flex:0 0 84px;color:"+v.c},v.n),
      el("button",{class:"ghost",onclick:()=>saveWeek(w,{quota:{...W.quota,[k]:{n:Math.max(0,cur.n-1),d:Math.min(cur.d,Math.max(0,cur.n-1))}}})},"−"),
      el("button",{class:"ghost",onclick:()=>saveWeek(w,{quota:{...W.quota,[k]:{...cur,n:cur.n+1}}})},"+"),
      boxes));
  });
  q.append(el("p",{class:"note"},"Górna granica, nie norma. Bez zjazdu: e-book 3 · szkolenie 2 · studia 1 · drobnice 2."));

  /* --- do przepisania do B6 --- */
  const pp=sec("Do przepisania");
  const tekstDnia=(ds)=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    const ta=(D.tasks||[]), bl=(D.blocks||[]);
    if(!ta.length && !bl.length && !D.must && !D.journal) return null;
    const dd=parse(ds);
    const linie=[DOW[dowIdx(ds)]+" "+dd.getDate()+"."+pad(dd.getMonth()+1)
      + (D.type ? " · "+D.type : "")];
    if(D.must) linie.push("! "+duza(D.must));
    ta.forEach(x=>linie.push((STMARK[x.st]||"•")+" "+duza(x.txt)
      + (x.note ? "  ("+x.note.replace(/\s+/g," ")+")" : "")));
    bl.forEach(x=>linie.push("□ "+x.s+"–"+x.e+" "+duza(x.txt||"")
      + (x.proj?" · "+x.proj:"") + (x.done?" ✓":"")));
    if(D.journal) linie.push("~ "+D.journal.replace(/\s+/g," "));
    return linie.join("\n");
  };
  const doPrzep = days.filter(ds=>{
    const D = S.mdays[ds] || (ds===S.date ? S.day[ds] : null) || {};
    return !D.przepisane && tekstDnia(ds);
  });
  if(!doPrzep.length) pp.append(el("p",{class:"note"},
    "Wszystko z tego tygodnia jest przepisane. Nowe wpisy pojawią się tutaj same."));
  doPrzep.forEach(ds=>{
    const pre=el("pre",{class:"przep"}, tekstDnia(ds));
    pp.append(el("div",{},pre,
      el("div",{class:"row"},
        el("button",{class:"ghost",onclick:async()=>{
          try{ await navigator.clipboard.writeText(tekstDnia(ds)); }catch(e){}
        }},"kopiuj"),
        el("button",{class:"ghost",onclick:async()=>{
          let dane={}; try{ const s=await S.db.doc("days/"+ds).get(); if(s.exists) dane=s.data()||{}; }catch(e){}
          await S.db.doc("days/"+ds).set({...dane, przepisane:true});
        }},"przepisane ✓"))));
  });
  if(doPrzep.length) pp.append(el("div",{class:"row"},
    el("button",{class:"btn",onclick:async()=>{
      const caly=doPrzep.map(tekstDnia).join("\n\n");
      try{ await navigator.clipboard.writeText(caly); }catch(e){}
    }},"Kopiuj cały tydzień")));
  pp.append(el("p",{class:"note"},
    "Dzień znika z listy, gdy oznaczysz go jako przepisany. Zmiana w dniówce go nie przywraca."));

  return {L:[dl,hw,pp,rv], R:[miniKalendarz(S.date),t3,q]};
}

/* ---------- Miesiąc ---------- */
function vMiesiac(){
  const [y,m]=S.month.split("-").map(Number);
  const first=new Date(y,m-1,1), start=addD(key(first),-((first.getDay()+6)%7));
  const g=el("div",{class:"mg"});
  DOW.forEach(d=>g.append(el("div",{class:"dow"},d)));
  const today=key(new Date());
  for(let i=0;i<42;i++){
    const ds=addD(start,i), dt=parse(ds), out=dt.getMonth()!==m-1;
    if(i>=35&&out) break;
    const dd=S.mdays[ds]||{};
    const c=el("button",{class:"mcell"+(out?" out":"")+(ds===today?" today":""),
      onclick:()=>{S.date=ds;S.view="dzis";S.month=ds.slice(0,7);resub();render()}});
    c.append(el("div",{class:"dn"},String(dt.getDate()),dd.type?el("span",{class:"chip"},dd.type):null));
    calFor(ds).slice(0,3).forEach(e=>c.append(el("div",{class:"ev",style:"color:var(--ink-2)"},
      (e.t?e.t+" ":"")+e.s)));
    if(dd.must) c.append(el("div",{class:"ev",style:"color:var(--t)"},duza(dd.must)));
    g.append(c);
  }
  const s=sec(MONTHN[m-1]+" "+y,g);
  calNote(s);
  s.append(el("p",{class:"note"},"Terminy pochodzą z Kalendarza Google. Typ dnia i „musi się udać” — z dniówek."));
  return {W:[s]};
}

/* ---------- Cele ---------- */
function vCele(){
  const cols=[["kiedys","Kiedyś"],["rok","Rok"],["kwartal","Kwartał"],
    ["miesiac","Miesiąc"],["tydzien","Tydzień"],["dzien","Dzień"]];
  const out=[];
  if(!S.goals.length) out.push(el("p",{class:"note"},"Brak celów. Dodaj pierwszy — rozpisujesz go od marzenia do dnia."));
  S.goals.forEach(g=>{
    const nameI=el("input",{type:"text",value:duza(g.name||""),placeholder:"Nazwa celu",
      style:"font-family:var(--disp);font-size:16px"});
    nameI.addEventListener("change",()=>save("goals/"+g.id,{...g,name:duza(nameI.value)}));
    const s=sec(null,el("div",{class:"row tight",style:"border-bottom:1px solid var(--line-2);padding-bottom:5px"},
      areaDot(g.area),nameI,el("span",{class:"spacer"}),
      el("button",{class:"ghost",title:"Obszar",onclick:()=>{const ks=Object.keys(AREAS);
        save("goals/"+g.id,{...g,area:ks[(ks.indexOf(g.area)+1)%ks.length]})}},(AREAS[g.area]||AREAS.Z).nr),
      el("button",{class:"ghost",title:"Usuń cel",onclick:()=>{S.db&&S.db.doc("goals/"+g.id).delete()}},"✕")));
    const kroki = g.kroki || {};
    const ruszylo = Object.values(kroki).reduce((n,a)=>n+((a&&a.length)||0),0);
    const grid=el("div",{class:"goalgrid"});
    cols.forEach(([k,label])=>{
      const ta=el("textarea",{rows:2,placeholder:"—"}); ta.value=duza(g[k]||"");
      ta.addEventListener("change",()=>save("goals/"+g.id,{...g,[k]:duza(ta.value)}));
      const ile = (kroki[k]||[]).length;
      const naglowek = el("div",{class:"row",style:"flex-wrap:nowrap;gap:5px;align-items:baseline"},
        el("span",{style:"flex:1 1 auto;min-width:0"},label),
        ile ? el("span",{class:"kroklicz",title:"Tyle razy ten krok trafił do dniówki"},"✓"+ile) : null,
        el("button",{class:"ghost",title:"Zrób z tego zadanie w wybranym dniu",
          onclick:()=>{ S.krok = (S.krok===g.id+"|"+k) ? null : g.id+"|"+k; render(); }},"→"));
      const pole = el("label",{class:"fld"},naglowek,ta);
      if(S.krok === g.id+"|"+k){
        const data = el("input",{type:"date",value:S.date,style:"width:auto;flex:1 1 130px"});
        const tresc = el("input",{type:"text",value:duza(g[k]||""),placeholder:"Treść zadania",
          style:"width:auto;flex:2 1 160px;min-width:0"});
        const wyslij = async()=>{
          const txt = duza(tresc.value); if(!txt) return;
          const ds = data.value || S.date;
          const ok = await dopiszZadanie(ds, {id:uid(), txt, st:"todo",
            area:g.area||"T", minor:false, zCelu:g.id});
          if(!ok) return;
          const nowe = {...kroki, [k]: [...(kroki[k]||[]), {d:ds, txt}]};
          save("goals/"+g.id, {...g, kroki:nowe});
          S.krok = null; render();
        };
        tresc.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); wyslij(); } });
        pole.append(el("div",{class:"row",style:"margin-top:4px"}, data, tresc,
          el("button",{class:"btn",onclick:wyslij},"Do dniówki"),
          el("button",{class:"ghost",onclick:()=>{S.krok=null;render()}},"anuluj")));
        if((kroki[k]||[]).length)
          pole.append(el("p",{class:"note"},"Już w dniówkach: "
            + (kroki[k]||[]).map(x=>parse(x.d).getDate()+"."+(parse(x.d).getMonth()+1)).join(", ")));
      }
      grid.append(pole);
    });
    s.append(grid);
    s.append(el("p",{class:"note"},
      ruszylo ? ("Ruszyło " + ruszylo + " krok" + (ruszylo===1?"":(ruszylo<5?"i":"ów"))
                 + " — tyle razy coś z tego celu trafiło do konkretnego dnia.")
              : "Żaden krok jeszcze nie trafił do dniówki. Strzałka → przy kroku robi z niego zadanie."));
    out.push(s);
  });
  out.push(el("button",{class:"btn",style:"align-self:flex-start",onclick:()=>{
    S.db&&S.db.collection("goals").add({name:"Nowy cel",area:"T",ord:S.goals.length+1,
      kiedys:"",rok:"",kwartal:"",miesiac:"",tydzien:"",dzien:""})}},"Dodaj cel"));
  return {W:out};
}

/* ---------- informacje o synchronizacji ---------- */
function kiedys(ts){
  if(!ts) return null;
  const m = Math.round((Date.now()-ts)/60000);
  const g = new Date(ts).toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
  const opis = m < 1 ? "przed chwilą" : m < 60 ? (m+" min temu")
             : m < 1440 ? (Math.round(m/60)+" godz. temu") : (Math.round(m/1440)+" dni temu");
  const dzien = new Date(ts).toDateString() === new Date().toDateString()
    ? "" : (new Date(ts).toLocaleDateString("pl-PL",{day:"numeric",month:"long"})+", ");
  return dzien + g + " · " + opis;
}

/* ---------- przeniesienie na drugie urzadzenie ---------- */
const b64u  = a => toB(a).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
const odB64u = s => { s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "="; return frB(s); };
async function kluczZKodu(kod, salt){
  const km = await crypto.subtle.importKey("raw", ENC.encode(kod), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:600000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function transferUtworz(){
  const kod  = String(Math.floor(100000 + Math.random()*900000));
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const dane = JSON.stringify({t:GH.token, o:GH.owner, r:GH.repo, g:GH.gcal,
                               wazne:Date.now() + 15*60000});
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv},
               await kluczZKodu(kod, salt), ENC.encode(dane));
  const pak = [b64u(salt), b64u(iv), b64u(ct)].join(".");
  return {kod, url: location.origin + location.pathname + "#p=" + pak};
}
async function transferOtworz(pak, kod){
  const [s,i,c] = pak.split(".");
  if(!s || !i || !c) throw new Error("zly kod");
  const jawne = DEC.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:odB64u(i)},
    await kluczZKodu(kod, odB64u(s)), odB64u(c)));
  const o = JSON.parse(jawne);
  if(!o.t || !o.wazne || o.wazne < Date.now()) throw new Error("przeterminowane");
  return o;
}
function qrRysuj(box, tekst){
  const rysuj = ()=>{
    try{
      const q = qrcode(0, "L"); q.addData(tekst); q.make();
      box.innerHTML = q.createSvgTag({cellSize:6, margin:3, scalable:true});
      const svg = box.querySelector("svg");
      if(svg){ svg.setAttribute("width","260"); svg.setAttribute("height","260");
               svg.style.width="260px"; svg.style.height="260px"; }
    }catch(e){ box.textContent = "Nie udało się narysować kodu."; }
  };
  if(window.qrcode) return rysuj();
  const s = document.createElement("script");
  s.src = "qrcode.js";
  s.onload = rysuj;
  s.onerror = ()=>{ box.textContent = "Nie udało się wczytać rysownika kodów."; };
  document.head.append(s);
}

function jsqrWczytaj(){
  return new Promise((ok,no)=>{
    if(window.jsQR) return ok();
    const s = document.createElement("script");
    s.src = "jsqr.js";
    s.onload = ()=>ok(); s.onerror = ()=>no(new Error("brak biblioteki"));

function skanujScreen(){
  const v = document.getElementById("view"); v.replaceChildren();
  const info = el("p",{class:"note",style:"text-align:center"},
    "Skieruj aparat na kod pokazany na komputerze.");
  const video = el("video",{playsinline:"",muted:"",autoplay:"",
    style:"width:100%;max-width:330px;border-radius:12px;background:#000;display:block;margin:0 auto"});
  video.muted = true; video.playsInline = true;
  const plotno = document.createElement("canvas");
  let strumien = null, dziala = true;
  const stop = ()=>{ dziala = false;
    if(strumien){ try{ strumien.getTracks().forEach(t=>t.stop()); }catch(e){} strumien = null; } };
  const klatka = ()=>{
    if(!dziala) return;
    try{
      if(video.readyState >= 2 && video.videoWidth && window.jsQR){
        plotno.width = video.videoWidth; plotno.height = video.videoHeight;
        const ctx = plotno.getContext("2d", {willReadFrequently:true});
        ctx.drawImage(video, 0, 0, plotno.width, plotno.height);
        const obraz = ctx.getImageData(0, 0, plotno.width, plotno.height);
        const znalezione = jsQR(obraz.data, obraz.width, obraz.height);
        if(znalezione && znalezione.data && znalezione.data.indexOf("#p=") > 0){
          stop();
          transferScreen(znalezione.data.split("#p=")[1]);
          return;
        }
      }
    }catch(e){}
    setTimeout(klatka, 130);
  };
  const s = sec("Skanowanie kodu", info, video,
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"ghost",onclick:()=>{ stop(); setupScreen(); }},"wróć")));
  s.className = "sec lock"; v.append(s);

  (async()=>{
    try{
      await jsqrWczytaj();
      strumien = await navigator.mediaDevices.getUserMedia(
        {video:{facingMode:{ideal:"environment"}}, audio:false});
      video.srcObject = strumien;
      await video.play().catch(()=>{});
      klatka();
    }catch(e){
      const czemu = (e && (e.name==="NotAllowedError" || e.name==="SecurityError"))
        ? "Nie dostałam dostępu do aparatu. Zezwól na kamerę i spróbuj jeszcze raz."
        : (e && e.name==="NotFoundError") ? "Nie widzę aparatu w tym urządzeniu."
        : "Nie udało się włączyć aparatu.";
      info.className = "err"; info.textContent = czemu;
    }
  })();
}

/* ---------- ekran przejmowania ustawien z komputera ---------- */
function transferScreen(pak, msg){
  const v = document.getElementById("view"); v.replaceChildren();
  const out = el("p",{class:"note",style:"text-align:center;min-height:19px"},
    msg || "Wpisz sześć cyfr pokazanych na komputerze.");
  let zajety = false;
  const pad = pinPad(async kod=>{
    if(zajety) return; zajety = true;
    out.textContent = "Sprawdzam…";
    let o = null;
    try{ o = await transferOtworz(pak, kod); }
    catch(e){
      zajety = false; pad.shake(); pad.wipe();
      out.textContent = (e && e.message === "przeterminowane")
        ? "Kod wygasł — pokaż nowy na komputerze." : "Zły kod.";
      return;
    }
    GH.token = o.t; GH.owner = o.o || GH.owner; GH.repo = o.r || GH.repo;
    if(o.g) GH.gcal = o.g;
    history.replaceState(null, "", location.pathname);
    pinNowy();
  });
  const s = sec("Przenoszenie z komputera", out, pad);
  s.className = "sec lock"; v.append(s);
  setTimeout(()=>pad.ring(), 60);
}
function pinNowy(){
  const v = document.getElementById("view"); v.replaceChildren();
  const out = el("p",{class:"note",style:"text-align:center;min-height:19px"},
    "Ustaw PIN na tym urządzeniu — sześć cyfr.");
  let zajety = false;
  const pad = pinPad(async pin=>{
    if(zajety) return; zajety = true;
    out.textContent = "Łączę…";
    try{
      await deriveKey(pin, toB(crypto.getRandomValues(new Uint8Array(16))));
      await boot(true);
    }catch(e){
      zajety = false; pad.wipe();
      out.textContent = (e && e.status === 401) ? "Token odrzucony." : "Nie udało się połączyć.";
    }
  });
  const s = sec("Nowe urządzenie", out, pad);
  s.className = "sec lock"; v.append(s);
  setTimeout(()=>pad.ring(), 60);
}

const FILES = {};            // ścieżka pliku -> {sha, data}
const SUBS  = [];            // subskrypcje w pamięci
const DIRTY = new Set();     // pliki do zapisania
let   SAVING = false, SAVED_AT = 0, SAVE_ERR = null, PULLING = false, PULLED_AT = 0;

const TOK_KEY = "planer.gtok";

let snapTimer = null;
async function snapSave(){                 // kopia lokalna, zaszyfrowana tym samym PIN-em

let VAULT = null, AESKEY = null, SALT = null;
const ENC = new TextEncoder(), DEC = new TextDecoder();
const toB = a => btoa(String.fromCharCode(...new Uint8Array(a)));
const frB = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pin, saltB64){        // liczone raz na sesję, potem szyfrowanie jest natychmiastowe
  const km = await crypto.subtle.importKey("raw", ENC.encode(pin), "PBKDF2", false, ["deriveKey"]);
  AESKEY = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:frB(saltB64), iterations:600000, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  SALT = saltB64;
}
async function seal(txt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, AESKEY, ENC.encode(txt));
  return {iv:toB(iv), ct:toB(ct)};
}
async function unseal(v){
  return DEC.decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:frB(v.iv)}, AESKEY, frB(v.ct)));
}
function cfgLoad(){
  let m = {}; try{ m = JSON.parse(localStorage.getItem(CFG_KEY)||"{}"); }catch(e){}
  if(m.owner) GH.owner = m.owner;
  if(m.repo)  GH.repo  = m.repo;
  if(m.branch)GH.branch= m.branch;
  if(m.gcal)  GH.gcal  = m.gcal;
  SALT  = m.salt || null;
  VAULT = (m.ct && m.iv && m.salt) ? {ct:m.ct, iv:m.iv} : null;
  return !!VAULT;
}
async function cfgSave(){
  if(!AESKEY || !GH.token) return;
  const v = await seal(GH.token);
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(
    {owner:GH.owner, repo:GH.repo, branch:GH.branch, gcal:GH.gcal, salt:SALT, ...v})); }catch(e){}
  VAULT = v;
}

const fileFor = path => {
  const [col, id] = path.split("/");
  return col === "days" ? "data/days-" + id.slice(0,7) + ".json" : "data/" + col + ".json";
};
const b64 = s => { const b = new TextEncoder().encode(s); let r="";
  for(const x of b) r += String.fromCharCode(x); return btoa(r); };
const unb64 = s => new TextDecoder().decode(
  Uint8Array.from(atob(s.replace(/\n/g,"")), c => c.charCodeAt(0)));

async function api(path, opts){
  const r = await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+path,
    Object.assign({headers:{Authorization:"Bearer "+GH.token,
      Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}, opts||{}));
  if(r.status === 404) return null;
  if(!r.ok) throw Object.assign(new Error("GitHub "+r.status), {status:r.status});
  return r.json();
}
async function pull(file){
  const j = await api(file + "?ref=" + GH.branch);
  FILES[file] = j ? {sha:j.sha, data:JSON.parse(unb64(j.content))} : {sha:null, data:{}};
  return FILES[file];
}
async function push(file){
  const f = FILES[file]; if(!f) return;
  const body = {message:"planer "+new Date().toISOString().slice(0,16).replace("T"," "),
    content:b64(JSON.stringify(f.data, null, 1)), branch:GH.branch};
  if(f.sha) body.sha = f.sha;
  try{
    const j = await api(file, {method:"PUT", body:JSON.stringify(body)});
    f.sha = j.content.sha;
  }catch(e){
    if(e.status === 409 || e.status === 422){      // ktoś zapisał w międzyczasie
      const mine = f.data; await pull(file);
      FILES[file].data = Object.assign({}, FILES[file].data, mine);
      return push(file);
    }
    throw e;
  }
}
let saveTimer = null;
function schedule(file){
  DIRTY.add(file);
  snapLater();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1500);
}
async function flush(){
  if(SAVING || !DIRTY.size) return;
  if(!navigator.onLine){ status(); return; }
  SAVING = true; SAVE_ERR = null; status();
  const todo = [...DIRTY]; DIRTY.clear();
  try{ for(const f of todo) await push(f); SAVED_AT = Date.now(); }
  catch(e){ SAVE_ERR = e.status === 401 || e.status === 403
      ? "Token nie ma prawa zapisu albo wygasł."
      : "Nie udało się zapisać. Sprawdź połączenie."; todo.forEach(f=>DIRTY.add(f)); }
  SAVING = false; status();
}
window.addEventListener("beforeunload", e => { if(DIRTY.size){ flush(); e.preventDefault(); e.returnValue=""; } });

const fire = () => SUBS.slice().forEach(f => { try{ f(); }catch(e){} });
const snap = (id, d) => ({id, exists:!!d, data:()=>d, metadata:{fromCache:false,hasPendingWrites:false}});

function docRef(path){
  const [col,id] = path.split("/"), file = fileFor(path);
  const bag = () => (FILES[file] || {data:{}}).data;
  return {
    id, path,
    get(){ return Promise.resolve(snap(id, bag()[id])); },
    set(d){ (FILES[file] = FILES[file] || {sha:null,data:{}}).data[id] = d; schedule(file); fire(); return Promise.resolve(); },
    update(d){ Object.assign(bag()[id] || (bag()[id]={}), d); schedule(file); fire(); return Promise.resolve(); },
    delete(){ delete bag()[id]; schedule(file); fire(); return Promise.resolve(); },
    onSnapshot(n){ const f=()=>n(snap(id,bag()[id])); SUBS.push(f); setTimeout(f,0);
      return ()=>{ const i=SUBS.indexOf(f); if(i>=0) SUBS.splice(i,1); }; },
    collection(c){ return colRef(path+"/"+c); }
  };
}
function colRef(col, filters, ord){
  filters = filters || [];
  const rows = () => {
    let out = [];
    if(col === "days"){
      Object.keys(FILES).filter(f=>f.startsWith("data/days-"))
        .forEach(f => out.push(...Object.entries(FILES[f].data)));
    } else {
      const f = FILES["data/"+col+".json"]; if(f) out = Object.entries(f.data);
    }
    filters.forEach(([fl,op,v]) => out = out.filter(([k,d]) => {
      const x = d[fl];
      return op===">=" ? x>=v : op==="<=" ? x<=v : op==="==" ? x===v : true; }));
    out.sort((a,b) => ord ? String(a[1][ord[0]]??"").localeCompare(String(b[1][ord[0]]??""))
                          : a[0].localeCompare(b[0]));
    return out;
  };
  const self = {
    path: col,
    where:(f,o,v)=>colRef(col, filters.concat([[f,o,v]]), ord),
    orderBy:(f,d)=>colRef(col, filters, [f,d||"asc"]),
    limit:()=>self,
    doc:(id)=>docRef(col+"/"+(id || ("n"+Math.random().toString(36).slice(2,8)))),
    add(d){ const id="n"+Math.random().toString(36).slice(2,8);
      return docRef(col+"/"+id).set(d).then(()=>docRef(col+"/"+id)); },
    run(){ const e=rows(); return {docs:e.map(([k,d])=>snap(k,d)), size:e.length, empty:!e.length,
      docChanges:()=>[], metadata:{fromCache:false,hasPendingWrites:false}}; },
    get(){ return Promise.resolve(self.run()); },
    onSnapshot(n){ const f=()=>n(self.run()); SUBS.push(f); setTimeout(f,0);
      return ()=>{ const i=SUBS.indexOf(f); if(i>=0) SUBS.splice(i,1); }; }
  };
  return self;
}

/* ---------- pole PIN: sześć cyfr, jak blokada telefonu ---------- */
function pinPad(onDone){
  const wrap = el("div",{class:"pin"});
  const dots = el("div",{class:"pindots"});
  const inp  = el("input",{type:"tel",inputmode:"numeric",autocomplete:"off",
    maxlength:"6",class:"pininput","aria-label":"PIN",
    name:"pin"+Math.random().toString(36).slice(2,9)});  // zmienna nazwa: przegladarka nie przywroci wpisu
  const boxes = [];
  for(let i=0;i<6;i++){ const b = el("span",{class:"pinbox"}); boxes.push(b); dots.append(b); }
  const paint = ()=>{ const n = inp.value.length;
    boxes.forEach((b,i)=>{ b.className = "pinbox" + (i<n ? " on" : (i===n ? " cur" : "")); }); };
  const powstalo = Date.now();   // pierwsze chwile: przegladarka moze sama wstawic stary wpis
  inp.addEventListener("input",()=>{
    inp.value = inp.value.replace(/[^0-9]/g,"").slice(0,6);
    if(Date.now() - powstalo < 250){ inp.value = ""; paint(); return; }
    paint();
    if(inp.value.length===6) onDone(inp.value);
  });
  setTimeout(()=>{ inp.value = ""; paint(); }, 0);
  inp.addEventListener("focus",paint);
  wrap.append(dots,inp);
  wrap.pin   = ()=>inp.value;
  wrap.ring  = ()=>inp.focus();
  wrap.wipe  = ()=>{ inp.value=""; paint(); inp.focus(); };
  wrap.shake = ()=>{ wrap.classList.add("bad"); setTimeout(()=>wrap.classList.remove("bad"),430); };
  paint();
  return wrap;
}

      +"bez PIN-u nie da się go odczytać nawet z pamięci przeglądarki. "
      +"Nie wysyłaj tokenu nikomu — także mnie w rozmowie."));
  const box = sec("Pierwsze uruchomienie",
    msg ? el("p",{class:"err"},msg) : null,
    el("p",{class:"note"},"Masz już planer na komputerze? Otwórz tam "
      +"Ustawienia → Przeniesienie na telefon → Pokaż kod i zeskanuj go stąd."),
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"btn on",style:"padding:10px 20px;font-size:15px",
        onclick:()=>skanujScreen()},"Skanuj kod QR")),
    el("div",{class:"row",style:"justify-content:center"},
      el("button",{class:"ghost",onclick:()=>{ reczne.hidden = !reczne.hidden; }},
        "albo wpisz token ręcznie")),
    reczne);
  box.append(el("p",{class:"note",style:"text-align:right;opacity:.75"},
    "wersja " + (typeof VER==="string" ? VER : "?")));

}

/* ---------- ekran blokady ---------- */
function unlockScreen(msg){
  const v = document.getElementById("view"); v.replaceChildren();
  const out = el("p",{class:"note",style:"text-align:center;min-height:19px"},
    msg || "Wpisz PIN, żeby otworzyć planer.");
  let busy = false;
  const pad = pinPad(async pin=>{
    if(busy) return; busy = true;
    out.textContent = "Otwieram…";
    let tok = null;
    try{ await deriveKey(pin, SALT); tok = await unseal(VAULT); }
    catch(e){
      AESKEY = null; busy = false;
      pad.shake(); pad.wipe(); out.textContent = "Zły PIN.";
      return;
    }
    GH.token = tok;
    try{ await boot(false); }
    catch(e){
      busy = false; S.ready = true;
      setupScreen(e.status===401 ? "Token odrzucony — wpisz nowy." : "Brak połączenia z GitHubem.");
    }
  });
  const s = sec("Planer zamknięty", out, pad,
    el("div",{class:"row",style:"justify-content:center;margin-top:4px"},
      el("button",{class:"ghost",onclick:()=>{
        VAULT = null; GH.token = ""; AESKEY = null;
        try{ localStorage.removeItem(TOK_KEY); }catch(e){}
        setupScreen("Wpisz token jeszcze raz i ustaw nowy PIN."); }},"nie pamiętam PIN-u")));
  s.className = "sec lock";
  v.append(s);
  setTimeout(()=>pad.ring(),60);
}

const DATA_FILES = ["data/goals.json","data/lists.json","data/weeks.json",
  "data/habits.json","data/health.json","data/cfg.json"];
async function boot(fromSetup){
  const month = S.month;
  const files = DATA_FILES.concat(["data/days-"+month+".json"]);
  const zKopii = await snapLoad();
  let bezSieci = false;
  for(const f of files){
    try{ await pull(f); }
    catch(e){
      if(e && e.status) throw e;           // zły token albo repozytorium — pokaż ustawienia
      bezSieci = true;                     // brak internetu
      if(!zKopii) throw e;
    }
  }
  S.offline = bezSieci;
  if(!bezSieci){ PULLED_AT = Date.now(); snapLater(); }
  if(fromSetup) await cfgSave();
  await gRestore();
  S.db = {doc:docRef, collection:(p)=>colRef(p)};
  S.ready = true; S.canWrite = null;
  resub(); render(); status();
}
async function pullAll(){
  if(PULLING || DIRTY.size || SAVING) return;
  PULLING = true; status();
  try{ for(const f of Object.keys(FILES)) await pull(f); PULLED_AT = Date.now();
       fire(); snapLater(); }catch(e){}
  PULLING = false; status();
}
render();
(async()=>{
  S.ready = true;
  const pak = (location.hash || "").startsWith("#p=") ? location.hash.slice(3) : null;
  if(pak){ cfgLoad(); transferScreen(pak); return; }
  if(cfgLoad()){ unlockScreen(); return; }
  setupScreen(GH.token ? "Token jest teraz szyfrowany — ustaw PIN do planera." : "");
})();
window.addEventListener("online", ()=>{ S.offline=false; status(); flush().then(pullAll); });
